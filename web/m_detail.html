<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131722">
<title>品种详情</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#131722;--panel:#1e222d;--line:#2a2e39;--txt:#d1d4dc;--mut:#787b86;
        --red:#ef5350;--green:#26a69a;--gold:#f0b90b;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:block;}
  #app{margin:0 auto;width:100%;max-width:480px;min-width:0;height:100vh;height:100dvh;
       display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
  .top{flex:none;display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);}
  .top a{color:var(--gold);text-decoration:none;font-size:15px;}
  .top .nm{font-size:15px;font-weight:800;}
  .top .cd{font-size:11px;color:var(--mut);}
  .price{flex:none;display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);}
  .price .p{font-size:26px;font-weight:800;line-height:1;}
  .price .c{font-size:14px;font-weight:700;}
  #chart{flex:none;width:100%;height:230px;border-bottom:1px solid var(--line);overflow:hidden;}
  .st{flex:1;overflow-y:auto;padding:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;}
  .card .t{font-size:12px;color:var(--mut);margin-bottom:8px;}
  .row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;}
  .row .mut{color:var(--mut);}
  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a href="/m">‹ 返回</a>
    <div><div class="nm" id="nm">加载中</div><div class="cd" id="cd"></div></div>
  </div>
  <div class="price"><div class="p" id="p">–</div><div class="c" id="chg"></div></div>
  <div id="chart"></div>
  <div class="st">
    <div class="card">
      <div class="t">开仓建议（模拟账户100万 · 单笔最大风险1%）</div>
      <div id="adviceBody" style="font-size:13px;color:var(--mut);">正在计算…</div>
    </div>
    <div class="card"><div class="t">说明</div>
      <div style="font-size:12px;color:var(--mut);line-height:1.7;">
        简版K线为最近约160根15分，黄线为缠论笔，红▲买/绿▼平为分型确认点。手数按"止损距离×乘数"反推，区间为信号价上下各2个最小跳动。
      </div>
    </div>
  </div>
</div>
<script>
var $=function(id){return document.getElementById(id);};
var params=new URLSearchParams(location.search);
var SYM=params.get('sym')||'MA2610';
var U_SIDE=params.get('side');
var U_PRICE=params.get('price');
var U_TIME=params.get('time');
var U_REASON=params.get('reason')||'';
var N=160;
var chart,candle,bi;

// ===== 图表视图状态持久化：只记住"缩放力度"（页面容纳多少根K线），
// 位置永远锚定右侧最新K线——返回列表再进、换品种、刷新都一致 =====
var VIEW_KEY='cl_chart_view';
var _saveT=null;
function saveView(){
  try{
    var bs=chart.timeScale().options().barSpacing;
    if(isFinite(bs)&&bs>0) localStorage.setItem(VIEW_KEY,JSON.stringify({barSpacing:bs}));
  }catch(e){}
}
function saveViewSoon(){ if(_saveT)return; _saveT=setTimeout(function(){_saveT=null;saveView();},300); }
function applyView(){
  var raw=null; try{raw=localStorage.getItem(VIEW_KEY);}catch(e){}
  if(raw){
    try{
      var r=JSON.parse(raw);
      if(r&&isFinite(r.barSpacing)&&r.barSpacing>0){
        chart.timeScale().applyOptions({barSpacing:r.barSpacing,rightOffset:3});
        chart.timeScale().scrollToRealTime();
        return;
      }
    }catch(e){}
  }
  chart.timeScale().fitContent();
}

function chartW(){
  var el=$('chart');
  return Math.min(el.clientWidth||window.innerWidth,window.innerWidth);
}
// 把UTC时间戳转成本地时间对象，避免lightweight-charts时区问题
// lightweight-charts把时间戳当UTC显示，加8小时转成北京时间
const TZ_OFFSET=28800;
function fixTime(data){return data.map(x=>({...x,time:x.time+TZ_OFFSET}));}
function toLocalTime(data){return data.map(x=>({...x,time:tsToObj(x.time)}));}

function buildChart(k,markers,biArr){
  chart=LightweightCharts.createChart($('chart'),{
    width:chartW(),height:230,
    layout:{background:{type:'solid',color:'#131722'},textColor:'#787b86',fontSize:10},
    grid:{vertLines:{visible:false},horzLines:{color:'rgba(42,46,57,.5)'}},
    crosshair:{mode:0},
    rightPriceScale:{borderColor:'rgba(197,203,206,.15)'},
    timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false}
  });
  candle=chart.addCandlestickSeries({upColor:'#ef5350',downColor:'#26a69a',
    borderUpColor:'#ef5350',borderDownColor:'#26a69a',wickUpColor:'#ef5350',wickDownColor:'#26a69a'});
  bi=chart.addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  candle.setData(fixTime(k));
  bi.setData(fixTime(biArr));
  candle.setMarkers(fixTime(markers));
  applyView();
  // 用户每次缩放/平移都保存视图状态
  chart.timeScale().subscribeVisibleLogicalRangeChange(saveViewSoon);
}

function buyAdviceHtml(price, reason, r){
  var rows='';
  if(r){
    rows=
      '<div class="row" style="margin-top:8px;"><span class="mut">建议开仓区间</span><b style="color:#f0b90b">'+r.entry_low+' ~ '+r.entry_high+'</b></div>'+
      '<div class="row"><span class="mut">止损位</span><b>'+r.stop_loss+'（'+r.stop_pts+'点）</b></div>'+
      '<div class="row"><span class="mut">建议手数</span><b style="color:#f0b90b">'+r.lots+' 手</b></div>'+
      '<div class="row"><span class="mut">每手保证金</span><b>'+r.margin_per_lot+' 元</b></div>'+
      '<div class="row"><span class="mut">单笔最大风险</span><b>'+r.risk_amount+' 元（账户1%）</b></div>';
  } else {
    rows='<div style="margin-top:8px;font-size:12px;color:var(--mut);">止损/手数待计算（历史信号）。</div>';
  }
  return '<div style="font-size:15px;font-weight:800;color:#ef5350;">▲ 建议买入 · @ '+price+'</div>'+rows+
    '<div style="margin-top:8px;font-size:12px;color:var(--mut);line-height:1.6;">开仓理由：'+reason+'</div>';
}

function render(s){
  $('nm').textContent=s.name;
  $('cd').textContent=s.symbol+' · 15分 · '+s.bi_count+'笔';
  $('p').textContent=s.last_price;
  var up=s.change>=0;
  var col=up?'#ef5350':'#26a69a';
  $('chg').innerHTML='<span style="color:'+col+'">'+(up?'▲':'▼')+' '+Math.abs(s.change)+' ('+s.change_pct+'%)</span>';

  var k=s.kline.slice(-N);
  var st=k[0].time;
  var biArr=(s.bi||[]).filter(function(p){return p.time>=st;});
  var marks=(s.markers||[]).filter(function(x){return x.time>=st;});
  buildChart(k,marks,biArr);

  var ab=$('adviceBody');
  var last=s.last_signal, r=s.risk;
  if(U_SIDE==='buy'){
    ab.innerHTML=buyAdviceHtml(U_PRICE, U_REASON, r);
  } else if(U_SIDE==='sell'){
    ab.innerHTML=
      '<div style="font-size:14px;font-weight:800;color:#26a69a;">▼ 平仓信号 · @ '+U_PRICE+'</div>'+
      '<div style="margin-top:6px;font-size:12px;color:var(--mut);">'+U_REASON+'</div>'+
      '<div style="margin-top:6px;font-size:12px;color:var(--mut);">平多止盈，等待下一个底分型买入信号。</div>';
  } else if(r && last && last.side==='buy'){
    ab.innerHTML=buyAdviceHtml(last.price, last.reason||'', r);
  } else if(last){
    ab.innerHTML=
      '<div style="font-size:14px;font-weight:800;color:#26a69a;">▼ 当前为平仓信号 · @ '+last.price+'</div>'+
      '<div style="margin-top:6px;font-size:12px;color:var(--mut);">'+(last.reason||'')+'</div>'+
      '<div style="margin-top:6px;font-size:12px;color:var(--mut);">平多止盈，等待下一个底分型买入信号。</div>';
  } else {
    ab.innerHTML='<span class="mut">暂无信号，等待分型确认。</span>';
  }
}

fetch('/api/detail?sym='+encodeURIComponent(SYM))
  .then(function(r){return r.json();})
  .then(function(s){render(s);})
  .catch(function(e){$('adviceBody').textContent='加载失败：'+e;});
</script>
</body>
</html>
