<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>形态监控矩阵</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  body{background:#131722;color:#d1d4dc;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .red{color:#ef5350;} .green{color:#26a69a;} .gold{color:#f0b90b;} .mut{color:#787b86;}
  header{display:flex;align-items:center;gap:14px;padding:10px 22px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;}
  header h1{font-size:17px;font-weight:800;letter-spacing:1px;}
  header h1 span{color:#f0b90b;}
  .conn{display:flex;align-items:center;gap:7px;font-size:13px;color:#787b86;}
  .dot{width:9px;height:9px;border-radius:50%;background:#ef5350;}
  .dot.on{background:#26a69a;box-shadow:0 0 8px #26a69a;}
  .sp{flex:1;}
  .btn{border:1px solid #2a2e39;background:#2a2e39;color:#d1d4dc;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;}
  .btn:hover{filter:brightness(1.2);}
  .btn.off{color:#787b86;}
  .btn.tab{padding:2px 10px;font-size:11.5px;margin-left:8px;border-radius:6px;}
  .btn.tab.on{background:#f0b90b;color:#131722;border-color:#f0b90b;font-weight:700;}
  main{flex:1;display:flex;flex-direction:column;padding:12px 22px;gap:12px;overflow:hidden;}
  /* ===== 矩阵 ===== */
  #matrixWrap{flex:none;overflow:auto;background:#1e222d;border:1px solid #2a2e39;border-radius:12px;padding:10px;}
  table#matrix{border-collapse:separate;border-spacing:5px;width:100%;table-layout:fixed;}
  #matrix th{color:#787b86;font-weight:700;font-size:12.5px;padding:4px 2px;white-space:nowrap;overflow:hidden;}
  #matrix th.rowhead{text-align:center;color:#d1d4dc;font-size:13px;width:64px;}
  #matrix th.colhead{cursor:pointer;}
  #matrix th.colhead:hover{color:#f0b90b;}
  td.cell{width:64px;height:44px;text-align:center;background:#262b38;border:1px solid #2a2e39;border-radius:8px;
          font-size:13px;font-weight:800;cursor:pointer;transition:background .15s,border-color .15s;
          position:relative;user-select:none;}
  td.cell:hover{filter:brightness(1.35);}
  td.cell.empty{color:#4a4f5a;font-weight:400;font-size:11px;}
  td.cell.watch_a{background:#1e222d;border:1px dashed #56606f;color:#9aa3b2;font-size:12px;}
  td.cell.cand_a.long{background:#262b38;border:2px solid #ef5350;color:#ef5350;}
  td.cell.cand_a.short{background:#262b38;border:2px solid #26a69a;color:#26a69a;}
  td.cell.cand_b.long{background:#262b38;border:2px solid #f0b90b;color:#f0b90b;font-size:11.5px;}
  td.cell.cand_b.short{background:#262b38;border:2px solid #b388ff;color:#b388ff;font-size:11.5px;}
  td.cell.conf_a.long{background:rgba(239,83,80,.85);border:2px solid #ffb3ad;color:#fff;}
  td.cell.conf_a.short{background:rgba(38,166,154,.85);border:2px solid #a8e6e2;color:#fff;}
  td.cell.trig_b.long{background:rgba(240,185,11,.85);border:2px solid #ffe082;color:#fff;font-size:11.5px;}
  td.cell.trig_b.short{background:rgba(179,136,255,.85);border:2px solid #d1c4ff;color:#fff;font-size:11.5px;}
  td.cell.gone_b{border:1px dashed #787b86;color:#787b86;font-size:11px;}
  .clr{position:absolute;top:1px;right:3px;font-size:11px;color:rgba(255,255,255,.75);cursor:pointer;}
  td.cell.cand_b .clr,td.cell.gone_b .clr{color:#787b86;}
  /* ===== 图例 ===== */
  .legend{display:flex;gap:14px;font-size:11.5px;color:#787b86;flex:none;flex-wrap:wrap;align-items:center;}
  .lg{display:flex;align-items:center;gap:5px;}
  .chip{width:15px;height:15px;border-radius:4px;display:inline-block;}
  /* ===== 事件流（卡片式，一行3-4张） ===== */
  #streamWrap{flex:1;background:#1e222d;border:1px solid #2a2e39;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  #streamWrap .ph{padding:8px 16px;border-bottom:1px solid #2a2e39;font-size:13px;font-weight:700;flex:none;}
  #stream{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:9px;align-content:start;}
  .evt{border-radius:10px;padding:9px 12px;border:1px solid #2a2e39;border-left:4px solid;display:flex;flex-direction:column;gap:3px;cursor:pointer;}
  .evt:hover{filter:brightness(1.25);}
  .evt .r1{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#787b86;}
  .evt .r1 .kind{font-weight:800;padding:1px 8px;border-radius:9px;font-size:10.5px;}
  .evt.A.long .kind{background:rgba(239,83,80,.25);color:#ef5350;}
  .evt.A.short .kind{background:rgba(38,166,154,.25);color:#26a69a;}
  .evt.B.long .kind{background:rgba(240,185,11,.22);color:#f0b90b;}
  .evt.B.short .kind{background:rgba(179,136,255,.22);color:#b388ff;}
  .evt.A.long{background:linear-gradient(135deg,rgba(239,83,80,.20),rgba(239,83,80,.04));border-left-color:#ef5350;}
  .evt.A.short{background:linear-gradient(135deg,rgba(38,166,154,.20),rgba(38,166,154,.04));border-left-color:#26a69a;}
  .evt.B.long{background:linear-gradient(135deg,rgba(240,185,11,.16),rgba(240,185,11,.03));border-left-color:#f0b90b;}
  .evt.B.short{background:linear-gradient(135deg,rgba(179,136,255,.16),rgba(179,136,255,.03));border-left-color:#b388ff;}
  .evt .r2{font-size:13.5px;font-weight:800;}
  .evt .r3{font-size:17px;font-weight:800;}
  .evt .r4{font-size:11px;color:#787b86;}
  .evt .r4 b{color:#d1d4dc;}

/* ---------- 持仓面板 ---------- */
#posPanel{position:fixed;width:372px;max-height:88vh;background:#1b1f2a;border:1px solid #f0b90b66;
  border-radius:12px;z-index:99;display:none;flex-direction:column;box-shadow:0 14px 44px #000d;overflow:hidden;}
#posPanelHead{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid #2a2e39;
  cursor:move;font-weight:700;font-size:13.5px;user-select:none;}
#posCards{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;}
#posCards .empty{color:#787b86;font-size:12.5px;text-align:center;padding:26px 0;}
/* 持仓卡（与移动端同款：金色信息带，交易级别+进场时间双主角） */
.posCard{position:relative;background:#161C26;border:1px solid #2a2e39;border-radius:14px;overflow:hidden;display:flex;}
.posCard .pbar{width:5px;flex-shrink:0;background:#f0b90b;}
.posCard.long .pbar{background:#ef5350;}
.posCard.short .pbar{background:#26a69a;}
.posCard .bd{flex:1;min-width:0;padding:11px 12px 10px 14px;display:flex;flex-direction:column;}
.posCard .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.posCard .pname{font-size:18px;font-weight:800;letter-spacing:.5px;color:#fff;}
.posCard .psym{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:#9aa0b0;margin-left:6px;}
.posCard .dir{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;flex-shrink:0;}
.posCard.long .dir{color:#ff7b7b;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);}
.posCard.short .dir{color:#2fbfae;background:rgba(38,166,154,.1);border:1px solid rgba(38,166,154,.35);}
.posCard .hero{margin-top:9px;background:linear-gradient(135deg,rgba(240,185,11,.16),rgba(240,185,11,.04));
  border:1px solid rgba(240,185,11,.25);border-radius:10px;display:flex;align-items:stretch;}
.posCard .hl{padding:7px 0 7px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
.posCard .hl.lvl{flex:0 0 32%;}
.posCard .lv-num{font-size:21px;font-weight:800;color:#f0b90b;line-height:1.05;}
.posCard .lv-num small{font-size:11.5px;font-weight:700;margin-left:1px;}
.posCard .lv-lab,.posCard .tl{font-size:9px;color:#9aa0b0;margin-top:2px;letter-spacing:1.5px;white-space:nowrap;}
.posCard .hdiv{width:1px;background:rgba(240,185,11,.25);margin:7px 0;}
.posCard .hl.time{flex:1;}
.posCard .tv{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.5px;font-weight:700;color:#e9eef5;line-height:1.1;white-space:nowrap;}
.posCard .r2{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11px;color:#787b86;white-space:nowrap;overflow:hidden;}
.posCard .sig{font-weight:700;font-size:12px;}
.posCard .sig.buy{color:#ff7b7b;} .posCard .sig.sell{color:#2fbfae;}
.posCard .arr{color:#565a66;}
.posCard .xtra{margin-top:5px;font-size:11px;color:#9aa0b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.posCard .foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.posCard .dur{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
.posCard .dur i{width:5px;height:5px;border-radius:50%;font-style:normal;}
.posCard .dur.today{color:#2fbfae;background:rgba(38,166,154,.1);} .posCard .dur.today i{background:#2fbfae;}
.posCard .dur.over{color:#FFB454;background:rgba(255,180,84,.13);} .posCard .dur.over i{background:#FFB454;}
.posCard .ops{display:flex;gap:7px;flex-shrink:0;}
.posCard .ops button{height:29px;padding:0 15px;border-radius:15px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;border:1px solid #2a2e39;color:#d1d4dc;}
.posCard .ops button:hover{border-color:#f0b90b;color:#f0b90b;}
.posCard .ops button.pc{color:#ff7b7b;background:rgba(255,92,92,.08);border-color:rgba(255,92,92,.4);}
.posCard .ops button.pc:hover{border-color:#ff7b7b;color:#ff7b7b;}
#pcResults button.sel{border-color:#f0b90b !important;color:#f0b90b !important;font-weight:700;background:#f0b90b14 !important;}
#posForm{border-top:1px solid #2a2e39;padding:10px 13px;display:flex;flex-direction:column;gap:7px;}
#posForm .pf-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
/* 下拉箭头：固定在右侧 10px 处，不再贴边 */
select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238B95A7' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;}
#posForm .pf-row label{width:34px;color:#787b86;flex:none;}
#posForm select,#posForm input{flex:1;background-color:#131722;border:1px solid #2a2e39;color:#d1d4dc;
  border-radius:7px;padding:5px 9px;font-size:12.5px;}
#posForm select{padding-right:26px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238B95A7' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;}
/* 右上角预警弹卡：页面内 DOM 弹窗，不依赖浏览器通知授权（Notification 授权丢了也能弹） */
#popStack{position:fixed;top:20px;right:20px;z-index:150;display:flex;flex-direction:column;gap:10px;
  pointer-events:none;max-width:340px;max-height:calc(100vh - 40px);overflow:hidden;}
.alert-pop{pointer-events:auto;position:relative;background:#1e222d;border:2px solid #ef5350;border-radius:12px;
  padding:11px 30px 11px 16px;box-shadow:0 8px 30px #000a;cursor:pointer;font-size:12.5px;
  animation:popSlide .25s ease;}
.alert-pop.down{border-color:#26a69a;}
.alert-pop .t{font-size:14px;font-weight:700;margin-bottom:4px;}
.alert-pop .t.up{color:#ef5350;} .alert-pop .t.down{color:#26a69a;}
.alert-pop .i{color:#9aa0b0;line-height:1.65;}
.alert-pop .x{position:absolute;top:5px;right:10px;color:#787b86;cursor:pointer;font-size:16px;}
@keyframes popSlide{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}

</style>
</head>
<body>
<header>
  <a href="/pc" class="btn" style="text-decoration:none;">‹ 返回</a>
  <h1>形态<span>监控矩阵</span></h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="connTx">连接中…</span></div>
  <div class="sp"></div>
  <button class="btn" id="muteBtn" onclick="toggleMute()">🔊 提示音开</button>
  <button class="btn" onclick="sndPanelToggle()" title="声音分类设置：确认/触发与候选分开调音">♪ 设置</button>
  <button class="btn" id="posBtn" onclick="togglePosPanel()">持仓 <span id="posCountHdr" class="mut" style="font-size:11px"></span></button>
</header>

<!-- 声音分类设置面板 -->
<!-- 右上角预警弹卡容器 + 声音分类设置面板 -->
<div id="popStack"></div>
<div id="sndPanel" style="display:none;position:fixed;top:52px;right:16px;z-index:130;background:#1e222d;
     border:1px solid #f0b90b66;border-radius:12px;padding:13px 15px;width:260px;box-shadow:0 12px 36px #000d;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <b style="font-size:13px;">声音设置</b>
    <span style="cursor:pointer;color:#787b86;" onclick="sndPanelToggle()">×</span>
  </div>
  <div style="font-size:11.5px;color:#f0b90b;margin-bottom:5px;">确认 / 触发类（上行双音）</div>
  <div style="display:flex;gap:7px;align-items:center;">
    <input type="range" id="sndConf" min="400" max="1600" step="20" style="flex:1;" oninput="sndChange('conf',this.value)">
    <button class="btn" onclick="sndTest(true)" style="padding:3px 9px;font-size:11.5px;flex:none;">试听</button>
  </div>
  <div style="font-size:11.5px;color:#26a69a;margin:11px 0 5px;">候选 / 观察类（单长音）</div>
  <div style="display:flex;gap:7px;align-items:center;">
    <input type="range" id="sndCand" min="400" max="1600" step="20" style="flex:1;" oninput="sndChange('cand',this.value)">
    <button class="btn" onclick="sndTest(false)" style="padding:3px 9px;font-size:11.5px;flex:none;">试听</button>
  </div>
  <div style="font-size:10.5px;color:#565a66;margin-top:10px;line-height:1.6;">延续触发（同一信号再次确认）也会响铃，自动按类别选音色；设置自动保存在本机。</div>
</div>

<!-- 持仓面板（可拖动竖条，位置记忆） -->
<div id="posPanel">
  <div id="posPanelHead">
    <span>持仓状态</span><span class="mut" id="posCount" style="font-weight:400;font-size:11.5px"></span>
    <span style="flex:1"></span>
    <button class="btn" style="padding:2px 9px" onclick="posFormOpen()">+ 添加</button>
    <button class="btn" style="padding:2px 9px" onclick="togglePosPanel()">×</button>
  </div>
  <div id="posCards"></div>
  <div id="pcModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;">
    <div style="background:#1e222d;border:1px solid #2a2e39;border-radius:12px;padding:20px 22px;min-width:380px;">
      <h3 style="margin:0 0 12px;font-size:15px;">平仓 · 交易简报</h3>
      <p id="pcInfo" style="margin:0 0 14px;font-size:12.5px;line-height:1.9;color:#9aa0b0;"></p>
      <div id="pcResults" style="display:flex;gap:9px;margin-bottom:12px;">
        <button data-v="止盈" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止盈</button>
        <button data-v="止损" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止损</button>
        <button data-v="保本" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">保本</button>
      </div>
      <input id="pcPnl" placeholder="盈亏金额，如 +800 或 -300（选填）" style="width:100%;box-sizing:border-box;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:8px 11px;font-size:13px;">
      <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
        <button class="btn" onclick="document.getElementById('pcModal').style.display='none'">取消</button>
        <button class="btn" style="background:#f0b90b;color:#131722;font-weight:700;" onclick="posDelConfirm()">确认平仓</button>
      </div>
      <input type="hidden" id="pcDelId">
    </div>
  </div>
  <div id="posForm" style="display:none">
    <div class="pf-row"><label>品种</label><select id="pfSymbol"></select></div>
    <div class="pf-row"><label>级别</label><select id="pfPeriod">
      <option value="3">3分</option><option value="5" selected>5分</option>
      <option value="15">15分</option><option value="30m">30分</option>
      <option value="60">60分</option><option value="daily">日线</option></select></div>
    <div class="pf-row"><label>进场</label><select id="pfEntry" onchange="pfDeriveExit()">
      <option value="二买">A类二买点</option><option value="二卖">A类二卖点</option>
      <option value="三买">B类三买点</option><option value="三卖">B类三卖点</option></select></div>
    <div class="pf-row"><label>离场</label><select id="pfExit">
      <option value="二卖">A类二卖点</option><option value="二买">A类二买点</option>
      <option value="三卖">B类三卖点</option><option value="三买">B类三买点</option></select></div>
    <div class="pf-row"><label>备注</label><input id="pfNote" placeholder="选填" /></div>
    <div class="pf-row" style="gap:8px;justify-content:flex-end">
      <button class="btn" onclick="posFormClose()">取消</button>
      <button class="btn" id="pfSubmit" style="background:#f0b90b;color:#131722;font-weight:700" onclick="posSubmit()">确认</button>
    </div>
  </div>
</div>
<main>
  <div id="matrixWrap"><table id="matrix"></table></div>
  <div class="legend">
    <span class="lg"><span class="chip" style="border:2px solid #ef5350"></span>A类候选(多)</span>
    <span class="lg"><span class="chip" style="border:2px solid #26a69a"></span>A类候选(空)</span>
    <span class="lg"><span class="chip" style="border:2px solid #f0b90b"></span>B类候选(多)=三买</span>
    <span class="lg"><span class="chip" style="border:2px solid #b388ff"></span>B类候选(空)=三卖</span>
    <span class="lg"><span class="chip" style="border:1px dashed #56606f"></span>A类观察中</span>
    <span class="lg"><span class="chip" style="background:rgba(239,83,80,.85)"></span>A类确认(多)=二买</span>
    <span class="lg"><span class="chip" style="background:rgba(38,166,154,.85)"></span>A类确认(空)=二卖</span>
    <span class="lg"><span class="chip" style="background:rgba(240,185,11,.85)"></span>B类触发(多)=三买</span>
    <span class="lg"><span class="chip" style="background:rgba(179,136,255,.85)"></span>B类触发(空)=三卖</span>
    <span class="lg"><span class="chip" style="background:#262b38"></span>扫描中</span>
    <span class="mut" style="margin-left:auto;">点击格子进详情页 · 确认/触发 24h 自动淡化</span>
  </div>
  <div id="streamWrap">
    <div class="ph">实时事件流
      <button class="btn tab on" id="tabAll" onclick="setTab('all')">全部</button>
      <button class="btn tab" id="tabConf" onclick="setTab('conf')">确认</button>
      <span class="mut" style="font-weight:400;font-size:11px;margin-left:6px" id="streamCap"></span>
    </div>
    <div id="stream"></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let PERIODS=[],CONTRACTS=[],CELLS={};   // CELLS: 'sym|period' -> cell
let _muted=localStorage.getItem('cl_matrix_mute')==='1';
let _titleTimer=null,_baseTitle=document.title;

/* ---------- 矩阵渲染 ---------- */
function render(){
  const tb=$('matrix');
  let h='<tr><th class="rowhead">级别＼品种</th>';
  for(const c of CONTRACTS) h+=`<th class="colhead" onclick="go('${c.symbol}','15')">${c.name}</th>`;
  h+='</tr>';
  for(const p of PERIODS){
    h+=`<tr><th class="rowhead">${periodLabel(p)}</th>`;
    for(const c of CONTRACTS){
      const key=c.symbol+'|'+p;
      const cell=CELLS[key];
      h+=`<td class="cell" id="c_${cssKey(key)}" onclick="cellClick('${c.symbol}','${p}')" title="">…</td>`;
    }
    h+='</tr>';
  }
  tb.innerHTML=h;
  for(const key in CELLS) paintCell(CELLS[key]);
  // 尚未有状态的格子标"扫描中"
  document.querySelectorAll('td.cell').forEach(td=>{
    if(td.textContent==='…') td.textContent='·';
  });
}
function cssKey(k){return k.replace(/[^a-zA-Z0-9]/g,'_');}
function periodLabel(p){return ({'30':'30秒','1':'1分','3':'3分','5':'5分','15':'15分','30m':'30分','60':'60分','daily':'日线'})[p]||p;}
function arrow(side){return side==='long'?'▲':'▼';}

function paintCell(cell){
  const key=cell.symbol+'|'+cell.period;
  const td=$('c_'+cssKey(key));
  if(!td) return;
  td.className='cell '+cell.state+(cell.side?(' '+cell.side):'');
  td.title='';
  let txt='';
  const side=arrow(cell.side);
  if(cell.state==='idle'){txt='·';td.classList.add('empty');}
  else if(cell.state==='watch_a'){txt='A'+side+' 观察';td.title=`背驰结构 ${cell.p1} / ${cell.p2} / ${cell.p3}\n突破 ${cell.p2} 转候选\n(观察中，不推送)`;}
  else if(cell.state==='cand_a'){txt='A'+side+' 候选';td.title=`背驰V反已突破 ${cell.p2}\n等回调笔确立 → A类确认\n${fmtT(cell.time)}`;}
  else if(cell.state==='conf_a'){txt='A'+side+' 确认';td.title=`A类确认（二买/二卖进场关注）@${cell.price}\n${fmtT(cell.time)}`;}
  else if(cell.state==='cand_b'){txt='B'+side+' 候选';td.title=`${cell.pattern} @${cell.price}\n${fmtT(cell.time)}\n结构 ${cell.p1} / ${cell.p2} / ${cell.p3}`;}
  else if(cell.state==='trig_b'){txt='B'+side+' 触发';td.title=`B类触发（三买/三卖进场关注）@${cell.price}\n${fmtT(cell.time)}`;}
  else if(cell.state==='gone_b'){txt='B× 作废';}
  td.innerHTML=txt;
}
function fmtT(t){if(!t)return '';return String(t).replace('T',' ').slice(5,16);}

function applyCell(cell){
  CELLS[cell.symbol+'|'+cell.period]=cell;
  paintCell(cell);
}

function go(sym,period){location.href='/pc/detail?sym='+sym+'&period='+period;}
function cellClick(sym,period){go(sym,period);}

/* ---------- 事件流（用户定稿 2026-10-08：候选/确认无优先级纯时间序；
   「全部」30 条、「确认」20 条两个页签；延续触发原卡片更新，保留首次时间） ---------- */
let EVTS=[];          // 事件仓库（旧→新）
let TAB='all';
const CAP={all:30,conf:20};
const isConf=m=>(m.pattern||'').includes('CONF')||(m.pattern||'').includes('TRIG');
const evKey=m=>m.fingerprint||('k_'+m.pattern+m.symbol+m.period+m.time);

function setTab(t){
  TAB=t;
  $('tabAll').classList.toggle('on',t==='all');
  $('tabConf').classList.toggle('on',t==='conf');
  renderStream();
}

function upsertEvent(m){
  const k=evKey(m);
  const i=EVTS.findIndex(x=>evKey(x)===k);
  if(i>=0){
    m.first_time=(EVTS[i].first_time||EVTS[i].time);   // 保留首次时间
    if(EVTS[i].time===m.time&&EVTS[i].price===m.price){EVTS[i]=m;return false;}  // 无变化
    EVTS[i]=m;
  }else{
    m.first_time=m.first_time||m.time;
    EVTS.push(m);
    if(EVTS.length>200)EVTS=EVTS.slice(-200);
  }
  return true;
}

function cardEl(m){
  const div=document.createElement('div');
  const long=(m.side||'long')==='long';
  const cls=m.kind==='A'?('A '+m.side):('B '+m.side);
  const kind=m.snapshot
    ?(m.state==='watch_a'?'A类·观察':m.state==='cand_a'?'A类·候选':m.state==='conf_a'?'A类·确认':m.state==='trig_b'?'B类·触发':'B类·候选')
    :((m.pattern||'').startsWith('VREV_CONF')?'A类·确认'
      :(m.pattern||'').startsWith('VREV')?'A类·候选'
      :(m.pattern||'').includes('TRIG')?'B类·触发':'B类·候选');
  const sub=m.kind==='A'
    ?(m.snapshot?'观察中，破位即报警':('3→4跨 <b>'+(m.bi_span??'?')+'</b> 笔'))
    :('幅度 <b>'+(m.ratio??'?')+'</b>×');
  // 主时间=触发时刻（端点K线完结）；延续更新的卡片额外显示首次成立时间
  const first=(m.first_time&&m.first_time!==trigT(m))&&` <span class="mut" style="font-size:10px">首${fmtT(m.first_time)}</span>`||'';
  div.className='evt '+cls;
  div.dataset.fp=evKey(m);
  div.onclick=()=>location.href='/pc/detail?sym='+encodeURIComponent(m.symbol)+'&period='+encodeURIComponent(m.period||'15');
  div.innerHTML=`<div class="r1"><span class="kind">${kind}</span><span>${fmtT(trigT(m))}${first}</span></div>
    <div class="r2">${m.name} <span class="mut" style="font-size:11px">${periodLabel(m.period)}</span>
      <span style="float:right;color:${long?'#ef5350':'#26a69a'}">${long?'▲多':'▼空'}</span></div>
    <div class="r3">${m.price??''}</div>
    <div class="r4">${m.brief||sub}</div>`;
  return div;
}

const trigT=m=>m.trigger_time||m.time||'';

function renderStream(){
  const firstT=m=>m.first_time||m.time||'';
  const list=(TAB==='conf'?EVTS.filter(isConf):EVTS)
    .slice().sort((a,b)=>{
      const d=trigT(b)>trigT(a)?1:trigT(b)<trigT(a)?-1:0;   // 按触发时刻降序（主序，时间说话）
      if(d)return d;
      const f=firstT(b)>firstT(a)?-1:firstT(b)<firstT(a)?1:0; // 同刻：结构形成晚的在前
      if(f)return f;
      const k=evKey(a)>evKey(b)?1:evKey(a)<evKey(b)?-1:0;     // 同刻同结构（A/B配对）：指纹定序，实时与重建同序
      return k;
    });
  const view=list.slice(0,CAP[TAB]);
  const st=$('stream');st.innerHTML='';
  view.forEach(m=>st.appendChild(cardEl(m)));
  $('streamCap').textContent=`（${TAB==='all'?'候选+确认':'仅确认/触发'} ${view.length}/${CAP[TAB]} 条）`;
}

/* ---------- 提醒：分类提示音（确认/触发 vs 候选，音调可调） + 标题闪烁 + 系统通知 ---------- */
let _snd={conf:1200,cand:700};   // 确认/触发类与候选类的基准频率
try{const s=JSON.parse(localStorage.getItem('cl_matrix_snd')||'null');if(s&&s.conf&&s.cand)_snd=s;}catch(e){}
function evIsConf(m){
  if(m.snapshot||m.state)return m.state==='conf_a'||m.state==='trig_b';
  const p=(m.pattern||'');
  return p.indexOf('CONF')>=0||p.indexOf('TRIG')>=0;
}
function beepTone(freq,conf){
  if(_muted)return;
  try{
    const ctx=window.__audio||(window.__audio=new (window.AudioContext||window.webkitAudioContext)());
    const seq=conf?[[0,freq],[0.16,freq*1.3]]:[[0,freq]];   // 确认=上行双音更急促；候选=单长音
    seq.forEach(([dt,fr])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type=conf?'square':'sine';o.frequency.value=fr;
      const t0=ctx.currentTime+dt;
      g.gain.setValueAtTime(.001,t0);
      g.gain.exponentialRampToValueAtTime(.25,t0+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+(conf?.14:.3));
      o.start(t0);o.stop(t0+(conf?.16:.32));
    });
  }catch(e){}
}
function beepFor(m){
  if(_muted)return;
  const conf=evIsConf(m);
  beepTone(conf?_snd.conf:_snd.cand,conf);
}
function flashTitle(txt){
  if(_titleTimer)clearInterval(_titleTimer);
  let on=true;
  _titleTimer=setInterval(()=>{
    document.title=(on?'🔴 '+txt:_baseTitle);on=!on;
  },700);
  setTimeout(()=>{clearInterval(_titleTimer);document.title=_baseTitle;_titleTimer=null;},10000);
}
function notify(m){
  if(_muted||!('Notification' in window)||Notification.permission!=='granted')return;
  try{new Notification('形态预警',{body:m.text});}catch(e){}
}
/* 右上角弹卡（页面内，不依赖通知授权）：同屏只保留一张，新事件立即顶替（谁出现就提示谁），
   同一事件延续触发时原位刷新内容；12 秒无新事件自动消失；点卡片跳对应品种详情页 */
let _pops={};   // fingerprint -> {el, timer}：叠叠乐多卡，各自 12 秒倒计时依次消失
function showPatternPopup(m,isUpdate){
  const long=(m.side||'long')==='long';
  let rec=_pops[m.fingerprint];
  if(rec)clearTimeout(rec.timer);   // 延续触发：原卡刷新、重新计时，不另开新卡
  else{
    const el=document.createElement('div');
    el.className='alert-pop '+(long?'up':'down');
    el.onclick=()=>{location.href='/pc/detail?sym='+encodeURIComponent(m.symbol);};
    el.innerHTML='<span class="x" onclick="event.stopPropagation();this.parentElement.remove()">×</span>'+
      '<div class="t '+(long?'up':'down')+'"></div><div class="i"></div>';
    $('popStack').prepend(el);   // 新卡在最上，老卡依次下挤（聊天软件通知式排列）
    rec=_pops[m.fingerprint]={el};
  }
  rec.el.querySelector('.t').textContent=(isUpdate?'🔔 延续触发 · ':'')+
    (m.kind==='A'?'A类·背驰V反':'B类·三买卖点')+(long?'（多）':'（空）');
  rec.el.querySelector('.i').innerHTML=(m.text||'')+'<br>'+
    '价 <b>'+m.price+'</b>　触发 '+(m.trigger_time||'').replace('T',' ');
  rec.timer=setTimeout(()=>{rec.el.remove();delete _pops[m.fingerprint];},12000);
}
/* 时效闸门：事件触发时刻距今超过 3 分钟 = 天勤断线窗口错过扫描后恢复的补发，
   只进事件流，不弹卡/响铃/闪标题（否则恢复瞬间"新事件+一串旧闻"齐弹齐响） */
function evIsFresh(m){
  try{
    const t=String(m.trigger_time||m.time||'').replace(' ','T');
    if(!t)return true;
    return (Date.now()-new Date(t).getTime())/1000 <= 180;
  }catch(e){return true;}
}
function toggleMute(){
  _muted=!_muted;
  try{localStorage.setItem('cl_matrix_mute',_muted?'1':'0');}catch(e){}
  paintMute();
  if(!_muted&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission();
}

function sndPanelToggle(){
  const p=$('sndPanel');

  p.style.display=show?'block':'none';

}
function sndChange(kind,val){
  _snd[kind]=+val;
  try{localStorage.setItem('cl_matrix_snd',JSON.stringify(_snd));}catch(e){}
}
function sndTest(conf){
  const f=conf?+$('sndConf').value:+$('sndCand').value;
  const keep=_muted;_muted=false;
  beepTone(f,conf);
  _muted=keep;
}
function paintMute(){
  $('muteBtn').textContent=_muted?'🔇 提示音关':'🔊 提示音开';
  $('muteBtn').classList.toggle('off',_muted);

/* ---------- WS ---------- */
let ws=null;
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws?role=pc`);
  ws.onopen=()=>{$('dot').classList.add('on');$('connTx').textContent='已连接';};
  ws.onclose=()=>{$('dot').classList.remove('on');$('connTx').textContent='断线重连中…';setTimeout(connect,3000);};
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(m.type==='init'){
      (m.history||[]).forEach(x=>{if(x.type==='pattern_alert')upsertEvent(x);});
      renderStream();
    }else if(m.type==='pattern_alert'){
      const changed=upsertEvent(m);renderStream();
      if(changed&&m.first!==false&&evIsFresh(m)){beepFor(m);flashTitle(m.text);notify(m);showPatternPopup(m,false);}
    }else if(m.type==='pattern_alert_update'){
      const changed=upsertEvent(m);renderStream();
      // 延续触发：内容有实质变化（触发时刻/价格变了）也响铃+弹卡；同刻重复推送不重复吵；
      // 补发的陈旧事件只进流不提醒（evIsFresh）
      if(changed&&evIsFresh(m)){beepFor(m);flashTitle(m.text);notify(m);showPatternPopup(m,true);}
    }else if(m.type==='pattern_state'){
      applyCell(m.cell);
    }
  };
}

(async function(){
  paintMute();

  (d.events||[]).forEach(upsertEvent);   // 旧→新入库，renderStream 新在上
  renderStream();
  connect();

function posFormOpen(editId){
  const f=$('posForm');

  const sel=$('pfSymbol');

    sel.innerHTML=src.map(c=>`<option value="${c.symbol}">${c.name} ${c.symbol}</option>`).join('');
  }
  const rec=editId?POSITIONS.find(x=>x.id===editId):null;
  if(rec){
    sel.value=rec.symbol;
    $('pfPeriod').value=rec.period;
    $('pfEntry').value=rec.entry;

    $('pfNote').value=rec.note||'';

function posFormClose(){ $('posForm').style.display='none'; posEditId=null; }
function pfDeriveExit(){ $('pfExit').value=POS_EXIT[$('pfEntry').value]||$('pfEntry').value; }
async function posSubmit(){

              entry:$('pfEntry').value, exit:$('pfExit').value, note:$('pfNote').value.trim()};

  const hold=Math.max(0,Math.round((now-opened)/60000));

}
async function posDelConfirm(){
  const id=$('pcDelId').value;
  const selB=document.querySelector('#pcResults button.sel');
  const r=await fetch('/api/positions/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id, close_result:selB?selB.dataset.v:'', close_pnl:$('pcPnl').value.trim()})});
  const d=await r.json();
  if(d.error){ alert(d.error); return; }
  POSITIONS=d.positions||[]; renderPos(); posCountText();
  $('pcModal').style.display='none';
}
function pcSel(b){
  document.querySelectorAll('#pcResults button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
}
/* 面板拖动（标题栏手柄，位置记忆） */
(function(){
  const head=document.getElementById('posPanelHead');
  let sx=0,sy=0,ol=0,ot=0,dragging=false;
  head.addEventListener('mousedown',e=>{
    if(e.target.tagName==='BUTTON')return;
    const p=$('posPanel');
    dragging=true; sx=e.clientX; sy=e.clientY;
    ol=parseInt(p.style.left||'0'); ot=parseInt(p.style.top||'0');
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const p=$('posPanel');
    let nl=ol+e.clientX-sx, nt=ot+e.clientY-sy;
    nl=Math.max(0,Math.min(window.innerWidth-120,nl));
    nt=Math.max(0,Math.min(window.innerHeight-60,nt));
    p.style.left=nl+'px'; p.style.top=nt+'px';
  });
  document.addEventListener('mouseup',()=>{ if(dragging){ dragging=false; posSavePos(); } });
})();

  // 暴露给 inline onclick（本块在 IIFE 内，函数默认局部）
  Object.assign(window,{togglePosPanel,loadPositions,renderPos,posFormOpen,posFormClose,pfDeriveExit,posSubmit,posDel,posDelConfirm,pcSel,posSavePos,posEdit});
  window.__matrixReady=true;
})();
</script>
