<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>持仓页</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#131722;color:#d1d4dc;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;}
header h1{font-size:16px;font-weight:800;letter-spacing:1px;}
header h1 span{color:#4a9eff;}
.mut{color:#787b86;font-size:11.5px;}
.sp{flex:1;}
.dot{width:8px;height:8px;border-radius:50%;background:#ef5350;flex:none;}
.dot.on{background:#26a69a;box-shadow:0 0 8px #26a69a;}
.btn{border:1px solid #2a2e39;background:#2a2e39;color:#d1d4dc;border-radius:8px;padding:5px 11px;
  font-size:12px;cursor:pointer;text-decoration:none;display:inline-block;}
.btn:hover{border-color:#4a9eff;color:#4a9eff;}
.vsel{background:#1e222d;color:#d1d4dc;border:1px solid #2a2e39;border-radius:6px;
  font-size:11px;padding:2px 4px;cursor:pointer;margin-left:2px;}
.vsel:hover{border-color:#4a9eff;}
/* ===== 2×2 四宫格：小头(品种条) + 迷你K线笔图 / 添加 ===== */
main{flex:1;overflow-y:auto;scrollbar-width:thin;padding:8px;}
#wrap{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));
  height:100%;min-height:540px;gap:8px;}
.strip{background:#161b22;border:1px solid #2a2e39;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.shead{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;flex-wrap:wrap;cursor:grab;}
.shead:active{cursor:grabbing;}
.shead button,.shead a,.shead select{cursor:pointer;}
.grip{cursor:grab;color:#4a5264;font-size:14px;padding:0 2px;user-select:none;letter-spacing:-1px;}
.grip:active{cursor:grabbing;color:#b388ff;}
.strip.dragover{outline:2px dashed #b388ff;outline-offset:-3px;}
.shead .pname{font-size:15px;font-weight:800;}
.shead .psym{color:#787b86;font-size:11px;}
.dir{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:8px;}
.dir.long{color:#ef5350;background:rgba(239,83,80,.14);}
.dir.short{color:#26a69a;background:rgba(38,166,154,.14);}
.shead .px{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
.shead .pnl{font-size:12px;font-weight:800;padding:1px 8px;border-radius:9px;}
.shead .pnl.pos{color:#ef5350;background:rgba(239,83,80,.12);}
.shead .pnl.neg{color:#26a69a;background:rgba(38,166,154,.12);}
.vbadge{font-size:12px;font-weight:800;padding:3px 11px;border-radius:9px;border:1.5px solid;}
.vbadge.hold{color:#26a69a;border-color:#26a69a;background:rgba(38,166,154,.09);}
.vbadge.warn{color:#f0b90b;border-color:#f0b90b;background:rgba(240,185,11,.08);}
.vbadge.stop{color:#ef5350;border-color:#ef5350;background:rgba(239,83,80,.12);animation:pulse 1.2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.shead button{border-radius:7px;height:26px;padding:0 11px;font-size:11.5px;font-weight:700;cursor:pointer;
  background:transparent;border:1px solid #2a2e39;color:#d1d4dc;}
.shead button:hover{border-color:#4a9eff;color:#4a9eff;}
.shead button.close{color:#ff7b7b;border-color:rgba(255,92,92,.45);background:rgba(255,92,92,.08);}
.shead button.hold{color:#b388ff;border-color:rgba(179,136,255,.5);background:rgba(179,136,255,.07);}
.shead button.hold:hover{border-color:#b388ff;color:#d1c4ff;}
/* 迷你图容器 / 空槽 */
.chartbox{flex:1;min-height:0;position:relative;}
.chartbox .emsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#56606f;font-size:12px;}
.slotbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
.addbig{background:transparent;border:1.5px dashed #3a3f4d;color:#56606f;border-radius:14px;
  padding:22px 44px;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;}
.addbig:hover{border-color:#4a9eff;color:#4a9eff;}
/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;}
.modal .box{background:#1e222d;border-radius:14px;padding:22px 24px;min-width:400px;}
#damp .box{border:2px solid #ef5350;}
#damp .t{font-size:17px;font-weight:800;color:#ef5350;margin-bottom:12px;}
#damp .b{font-size:13.5px;line-height:2;color:#d1d4dc;margin-bottom:18px;}
#damp .b b{color:#f0b90b;}
#damp .ops{display:flex;gap:10px;justify-content:flex-end;}
#damp .ops button{border:none;border-radius:9px;height:38px;padding:0 20px;font-size:13.5px;font-weight:700;cursor:pointer;}
#damp .ok{background:#ef5350;color:#fff;}
#damp .no{background:#2a2e39;color:#26a69a;border:1px solid #26a69a;}
.frow{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:9px;}
.frow label{width:56px;color:#787b86;flex:none;}
.frow select,.frow input{flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;}
.frow .seg{display:flex;border:1px solid #2a2e39;border-radius:8px;overflow:hidden;flex:1;}
.frow .seg button{flex:1;border:none;background:#1e222d;color:#787b86;padding:7px 0;font-size:12.5px;cursor:pointer;}
.frow .seg button.on{background:#b388ff;color:#131722;font-weight:800;}
</style>
</head>
<body>
<header>
  <h1>🚗 持仓页</h1>
  <span class="mut">添加≠持仓 · 盯笔看图 · 买点有选择权，卖点没有——卖点从宽，一切归锚</span>
  <span class="sp"></span>
  <span class="conn" style="display:flex;align-items:center;gap:6px;font-size:12px;color:#787b86;">
    <span class="dot" id="dot"></span><span id="connTx">连接中…</span></span>
  <span class="mut" id="updTx" title="现价来自新浪行情，每10秒拉一次；非交易时段价格不变属正常。灰色=本轮拉取失败，绿色=成功">行情 --:--:--</span>
  <button class="btn" onclick="cfgToggle()">⚙ 设置</button>
</header>

<!-- 设置面板（存本机） -->
<div id="cfgPanel" style="display:none;position:fixed;top:52px;right:16px;z-index:130;background:#1e222d;
     border:1px solid #f0b90b66;border-radius:12px;padding:13px 15px;width:260px;box-shadow:0 12px 36px #000d;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <b style="font-size:13px;">设置</b>
    <span style="cursor:pointer;color:#787b86;" onclick="cfgToggle()">×</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:12px;">右侧价格轴</span>
    <div style="display:flex;border:1px solid #2a2e39;border-radius:8px;overflow:hidden;" title="每个模块图右边的价格刻度；关掉图更宽更清爽，鼠标悬停十字线仍能看到价格">
      <button id="psOn" onclick="psChange(true)" style="background:#1e222d;color:#787b86;border:none;padding:5px 11px;font-size:12px;cursor:pointer;">开</button>
      <button id="psOff" onclick="psChange(false)" style="background:#1e222d;color:#787b86;border:none;padding:5px 11px;font-size:12px;cursor:pointer;">关</button>
    </div>
  </div>
</div>
<main><div id="wrap"></div></main>

<!-- 添加观察（≠持仓） -->
<div class="modal" id="addModal">
  <div class="box">
    <h3 style="margin:0 0 14px;font-size:15px;">添加盯盘块 <span class="mut" style="font-size:11.5px;">（只是看图，不进持仓）</span></h3>
    <div class="frow"><label>品种</label><select id="addSymbol"></select></div>
    <div class="frow"><label>级别</label><select id="addPeriod">
      <option value="3">3分</option><option value="5">5分</option><option value="15" selected>15分</option>
      <option value="30m">30分</option><option value="60">60分</option></select></div>
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="document.getElementById('addModal').style.display='none'">取消</button>
      <button class="btn" style="background:#4a9eff;color:#131722;font-weight:700;border:none;" onclick="addWatchGo()">添加</button>
    </div>
  </div>
</div>
<!-- 确认持仓 -->
<div class="modal" id="holdModal">
  <div class="box">
    <h3 style="margin:0 0 6px;font-size:15px;">添加持仓</h3>
    <p id="holdInfo" style="margin:0 0 14px;font-size:12.5px;color:#9aa0b0;line-height:1.8;"></p>
    <div class="frow"><label>进场类型</label>
      <select id="holdEntry" onchange="holdDeriveExit()">
        <option value="二买">A类二买点</option><option value="二卖">A类二卖点</option>
        <option value="三买">B类三买点</option><option value="三卖">B类三卖点</option></select></div>
    <div class="frow"><label>离场类型</label><select id="holdExit">
      <option value="二卖">A类二卖点</option><option value="二买">A类二买点</option>
      <option value="三卖">B类三卖点</option><option value="三买">B类三买点</option></select></div>
    <div class="frow"><label>备注</label><input id="holdNote" placeholder="选填"></div>
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="document.getElementById('holdModal').style.display='none'">取消</button>
      <button class="btn" id="holdGo" style="background:#b388ff;color:#131722;font-weight:700;border:none;" onclick="holdGo()">确认持仓</button>
    </div>
  </div>
</div>

<div class="modal" id="damp" onclick="if(event.target===this)dampClose()">
  <div class="box">
    <div class="t" id="dampT"></div>
    <div class="b" id="dampB"></div>
    <div class="ops">
      <button class="no" onclick="dampClose()">🛡 我遵守体系</button>
      <button class="ok" id="dampGo">仍然平仓</button>
    </div>
  </div>
</div>
<div class="modal" id="pcModal">
  <div class="box">
    <h3 style="margin:0 0 12px;font-size:15px;">平仓 · 交易简报</h3>
    <p id="pcInfo" style="margin:0 0 14px;font-size:12.5px;line-height:1.9;color:#9aa0b0;"></p>
    <div id="pcResults" style="display:flex;gap:9px;margin-bottom:12px;">
      <button data-v="止盈" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止盈</button>
      <button data-v="止损" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止损</button>
      <button data-v="保本" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">保本</button>
    </div>
    <input id="pcPnl" placeholder="盈亏金额，如 +800 或 -300（选填）" style="width:100%;box-sizing:border-box;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:8px 11px;font-size:13px;">
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="document.getElementById('pcModal').style.display='none'">取消</button>
      <button class="btn" style="background:#f0b90b;color:#131722;font-weight:700;" onclick="posDelConfirm()">确认平仓</button>
    </div>
    <input type="hidden" id="pcDelId">
  </div>
</div>
<div class="modal" id="pcWarn">
  <div class="box" style="border:2px solid #f0b90b;">
    <div style="font-size:15px;font-weight:800;color:#f0b90b;margin-bottom:10px;">⚠ 结果和盈亏对不上</div>
    <div id="pwB" style="font-size:13px;line-height:2;color:#d1d4dc;margin-bottom:16px;"></div>
    <div style="display:flex;gap:9px;justify-content:flex-end;">
      <button class="btn" onclick="document.getElementById('pcWarn').style.display='none'">我去改一下</button>
      <button class="btn" style="background:#f0b90b;color:#131722;font-weight:700;" onclick="pcWarnGo()">没选错，继续平仓</button>
    </div>
  </div>
</div>
<div class="modal" id="pfModal">
  <div class="box">
    <h3 style="margin:0 0 14px;font-size:15px;">编辑持仓</h3>
    <div style="display:flex;flex-direction:column;gap:9px;font-size:13px;">
      <div class="frow"><label style="width:40px;">品种</label>
        <select id="pfSymbol" disabled style="flex:1;"></select></div>
      <div class="frow"><label style="width:40px;">级别</label><select id="pfPeriod" style="flex:1;">
        <option value="3">3分</option><option value="5">5分</option><option value="15">15分</option>
        <option value="30m">30分</option><option value="60">60分</option></select></div>
      <div class="frow"><label style="width:40px;">进场</label>
        <select id="pfEntry" onchange="pfDeriveExit()" style="flex:1;">
          <option value="二买">A类二买点</option><option value="二卖">A类二卖点</option>
          <option value="三买">B类三买点</option><option value="三卖">B类三卖点</option></select></div>
      <div class="frow"><label style="width:40px;">离场</label><select id="pfExit" style="flex:1;">
        <option value="二卖">A类二卖点</option><option value="二买">A类二买点</option>
        <option value="三卖">B类三卖点</option><option value="三买">B类三买点</option></select></div>
      <div class="frow"><label style="width:40px;">进场价</label>
        <input id="pfPrice" placeholder="选填，用于保本价与锁定利润测算" style="flex:1;"></div>
      <div class="frow"><label style="width:40px;">备注</label>
        <input id="pfNote" placeholder="选填" style="flex:1;"></div>
    </div>
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="posFormClose()">取消</button>
      <button class="btn" id="pfSubmit" style="background:#f0b90b;color:#131722;font-weight:700;border:none;" onclick="posSubmit()">保存修改</button>
    </div>
  </div>
</div>

<script src="/popup_cards.js"></script><script src="/hotkeys.js"></script>
<script src="/posbi_cards.js"></script>
<script>
const $=id=>document.getElementById(id);
let POSITIONS=[],QUOTES={},CONTRACTS=[],CELLS={},ws=null,posEditId=null;
const POS_EXIT={'二买':'二卖','二卖':'二买','三买':'三卖','三卖':'三买'};
const P_RANK={'3':3,'5':5,'15':15,'30m':30,'60':60};
const P_LAB={'3':'3分','5':'5分','15':'15分','30m':'30分','60':'60分'};
const UP_RANK={idle:0,watch_a:1,cand_a:2,cand_b:2,conf_a:3,trig_b:3,gone_b:1};
const FP_PAT={'VREV_CONF_LONG':'A类·二买确认','VREV_LONG':'A类·二买候选',
  'VREV_CONF_SHORT':'A类·二卖确认','VREV_SHORT':'A类·二卖候选',
  '3BUY_CAND':'B类·三买候选','3BUY_TRIG':'B类·三买触发',
  '3SELL_CAND':'B类·三卖候选','3SELL_TRIG':'B类·三卖触发'};
const posIsLong=p=>(p.entry||'').includes('买');
const posLabel=v=>{v=v||'';return v.startsWith('二')?('A类'+v+'点'):v.startsWith('三')?('B类'+v+'点'):v;};
const V_WORD={hold:'持有',warn:'警戒',stop:'止损触发'};
const durTxt=p=>{
  if(!p.open_iso)return '';
  const days=Math.floor((Date.now()-new Date(p.open_iso))/86400000);
  return days>=1?('第 '+(days+1)+' 天'):(Math.floor((Date.now()-new Date(p.open_iso))/3600000)+' 小时');
};

/* ---------- 进场参考指纹（硬止损=进场卡结构点，判决/阻尼用） ---------- */
function fpStruct(p){
  const parts=(p.entry_fp||'').split('|');
  if(parts.length>=3){
    const p1=parseFloat(parts[1]),p2=parseFloat(parts[2]);
    if(isFinite(p1)&&isFinite(p2))return {pat:parts[0],patTxt:FP_PAT[parts[0]]||parts[0],p1:p1,p2:p2,hard:p1};
  }
  return null;
}
function verdictOf(p){
  const q=(QUOTES[p.symbol]||{}).price;
  if(q==null)return null;
  const long=posIsLong(p),s=fpStruct(p);
  if(!s)return {key:'warn',txt:'这笔持仓没记录当时的进场卡，系统不知道你的结构防守位——先按你自己的进场结构手动防守',px:q};
  if(long?q<s.hard:q>s.hard)
    return {key:'stop',txt:'危险价到了：现价'+(long?'跌破':'反弹触及')+' '+s.hard+'（进场卡结构'+(long?'低点':'高点')+'，做空/做多的依据已坏）——无条件平仓，别等回头',px:q};
  const d=Math.abs(q-s.hard).toFixed(1);
  return {key:'hold',
    txt:'现价离危险价 '+s.hard+' 还有 <b style="color:#26a69a">'+d+'</b> 点，'+(long?'多单':'空单')+'安全，拿着不用动。',px:q};
}

/* ---------- 槽位：持仓自动占槽 + 观察(添加≠持仓)填空位，共 4 格 ----------
   观察存 localStorage(cl_cockpit_watches)，与服务端持仓互不干扰。 */
const NSLOT=4;
let WATCHES=[];
try{WATCHES=JSON.parse(localStorage.getItem('cl_cockpit_watches')||'[]');}catch(e){WATCHES=[];}
function saveWatches(){try{localStorage.setItem('cl_cockpit_watches',JSON.stringify(WATCHES));}catch(e){}}
let _slotList=[],_slotSig='';

const ORDER_KEY='cl_cockpit_order';
function slotKeyOf(s){return s.pos?('p'+s.pos.id):(s.watch?('w'+s.watch.symbol+'|'+s.watch.period):'');}
function buildSlots(){
  const slots=[];
  POSITIONS.forEach(p=>slots.push({pos:p}));
  WATCHES.forEach(w=>{
    if(watchesDup(w))return;
    if(slots.length<NSLOT)slots.push({watch:w});
  });
  while(slots.length<NSLOT)slots.push({});
  // 2026-10-28 用户定稿：槽位顺序固定（持仓→只看→空槽），拖动顺序只走 CSS order 视觉层
  // （applyVisualOrder）——buildSlots 若按存序重排 DOM，轮询触发的 render 会让槽位索引漂移，
  // 与拖动的交换逻辑叠加产生"中间卡跟着动"的假排序。固定顺序保证 _slotKeys/_slotSig 稳定，
  // 轮询 render 全部走 updateDyn 零重建。
  _slotList=slots;
  return slots;
}
function watchesDup(w){return POSITIONS.some(p=>p.symbol===w.symbol&&String(p.period)===String(w.period));}

/* ---------- 槽位看图级别：临时串大小级别看图，本级别金色加粗不忘（按槽位记 localStorage） ---------- */
const VIEW_KEY='cl_cockpit_view';
let VIEW={};
try{VIEW=JSON.parse(localStorage.getItem(VIEW_KEY)||'{}');}catch(e){VIEW={};}
function saveViewPer(){try{localStorage.setItem(VIEW_KEY,JSON.stringify(VIEW));}catch(e){}}
function viewPeriod(i,base){const v=VIEW[i];return (v&&P_LAB[v])?String(v):String(base);}
function perTagHtml(base,per){
  const bl='<b style="color:#f0b90b">本 '+(P_LAB[base]||base)+'</b>';
  if(String(per)===String(base))return bl;
  return bl+' <span style="color:#9aa0b0">· 看 '+(P_LAB[per]||per)+'</span>';
}
function viewSelHtml(i,base){
  const cur=viewPeriod(i,base);
  const opts=Object.keys(P_LAB).map(k=>
    '<option value="'+k+'"'+(String(k)===cur?' selected':'')+'>'+P_LAB[k]+(String(k)===String(base)?' · 本':'')+'</option>').join('');
  return '<select class="vsel" title="切换看图级别（只改这张图，不动持仓级别）" onchange="viewChange('+i+',this.value)">'+opts+'</select>';
}
function viewChange(i,per){
  VIEW[i]=per;saveViewPer();
  const s=_slotList[i];
  if(s){
    const base=s.pos?s.pos.period:(s.watch?s.watch.period:null);
    const tag=$('vtag_'+i);
    if(tag&&base)tag.innerHTML=perTagHtml(base,per)+' · '+(s.pos?posLabel(s.pos.entry)+' 进 · 已持 '+durTxt(s.pos):'只看');
    const dl=$('dl_'+i);
    if(dl)dl.href='/pc/detail?sym='+encodeURIComponent(s.pos?s.pos.symbol:s.watch.symbol)+'&period='+encodeURIComponent(per);
  }

/* ---------- 渲染：逐槽位差分（2026-10-26 用户定稿：增删/平仓只动那一格，其余图表原地保留） ---------- */
let _slotKeys=[];
function destroyChart(i){
  const c=CHARTS[i];
  if(c){try{c.timer&&clearInterval(c.timer);}catch(e){}try{c.chart.remove();}catch(e){}delete CHARTS[i];}
}
function render(){
  const slots=buildSlots();
  const newKeys=slots.map(slotKeyOf);
  const sig=JSON.stringify(newKeys);
  if(sig===_slotSig){updateDyn();return;}
  const wrap=$('wrap');
  slots.forEach((s,i)=>{
    if(_slotKeys[i]===newKeys[i]&&wrap.children[i])return;   // 该槽位没变：DOM与图表全保留
    destroyChart(i);
    const el=slotEl(s,i);
    if(wrap.children[i])wrap.replaceChild(el,wrap.children[i]);
    else wrap.appendChild(el);
    const sym=s.pos?s.pos.symbol:(s.watch?s.watch.symbol:null);
    if(sym)mountChart(i,sym,viewPeriod(i,s.pos?s.pos.period:s.watch.period));
  });
  while(wrap.children.length>slots.length){
    destroyChart(wrap.children.length-1);
    wrap.removeChild(wrap.lastChild);
  }
  _slotKeys=newKeys;_slotSig=sig;
  applyVisualOrder();
  updateDyn();
}
/* ---------- 拖动换位（2026-10-26 用户定稿：手动拖动排序，替代隐式自动排序） ---------- */
let _dragIdx=-1;
function dragStart(ev,i){
  // 头部整体可拖，但按在按钮/链接/下拉上时不启动拖动
  if(ev.target&&ev.target.closest&&ev.target.closest('button,a,select')){ev.preventDefault();return;}
  _dragIdx=i;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',String(i));}catch(e){}}
function dragOver(ev){if(_dragIdx<0)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';
  document.querySelectorAll('.strip.dragover').forEach(x=>x.classList.remove('dragover'));
  const st=ev.target&&ev.target.closest?ev.target.closest('.strip'):null;
  if(st)st.classList.add('dragover');}
function dragEnd(){_dragIdx=-1;document.querySelectorAll('.strip.dragover').forEach(x=>x.classList.remove('dragover'));}
function dragDrop(ev,i){ev.preventDefault();const src=_dragIdx;dragEnd();
  if(src<0||src===i||src>=_slotList.length)return;
  const kids=$('wrap').children;
  const keyOf=idx=>(_slotKeys[idx]===''?('e'+idx):_slotKeys[idx]);
  // 交换语义（2026-10-28 用户二审定稿）：拖到哪张卡，就和那张卡互换视觉位，其余卡不动。
  // 关键：一律以 style.order（当前视觉位）为准操作——保存数组是"视觉位→卡"，DOM 序≠视觉序
  // （拖过之后就不等），按 DOM 槽位交换会跟视觉对不上，产生"中间卡跟着动"的轮转。
  const so=kids[src].style.order?parseInt(kids[src].style.order):src;
  const to=kids[i].style.order?parseInt(kids[i].style.order):i;
  kids[src].style.order=String(to);
  kids[i].style.order=String(so);
  // 重存顺序数组：视觉位 k ← 那张卡的 key（零刷新：DOM/图表/定时器/每槽状态全部原地保留）
  const saved=new Array(kids.length);
  for(let idx=0;idx<kids.length;idx++){
    const o=kids[idx].style.order?parseInt(kids[idx].style.order):idx;
    saved[o]=keyOf(idx);
  }
  for(let k=0;k<saved.length;k++)if(saved[k]==null)saved[k]='e'+k;
  try{localStorage.setItem(ORDER_KEY,JSON.stringify(saved));}catch(e){}
}
/* 结构性渲染（增删/平仓/重开页面）后按存的顺序重排视觉位置（图表照旧只对没变的槽位原地保留） */
function applyVisualOrder(){
  let order=[];try{order=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');}catch(e){}
  // 旧格式（空槽存 ''）与唯一 key 格式不兼容，直接弃用一次，落回 DOM 序
  if(!order.length||order.some(k=>k===''||k==null))return;
  const kids=$('wrap').children;
  for(let idx=0;idx<kids.length;idx++){
    const k=_slotKeys[idx]===''?('e'+idx):_slotKeys[idx];
    const v=order.indexOf(k);
    if(v>=0)kids[idx].style.order=String(v);
  }
}
function slotEl(s,i){
  const div=document.createElement('div');
  div.className='strip';
  div.ondragover=dragOver;div.ondrop=function(ev){dragDrop(ev,i);};div.ondragend=dragEnd;

  }else if(s.watch){

      '<span class="mut" id="vtag_'+i+'">'+perTagHtml(w.period,viewPeriod(i,w.period))+' · 只看</span>'+
      viewSelHtml(i,w.period)+

      '<button onclick="removeWatch('+i+')">移除</button>';

    ?'<div class="chartbox" id="chart_'+i+'" onclick="slChartClick(event,'+i+')"><div class="emsg">加载行情…</div></div>'
    :'<div class="slotbody"><button class="addbig" onclick="addOpen('+i+')">＋ 添加</button></div>';
  div.innerHTML='<div class="shead" draggable="true" ondragstart="dragStart(event,'+i+')" title="按住头部拖动换位">'+head+'</div>'+body;
  return div;

function cname(sym){const c=CONTRACTS.find(x=>x.symbol===sym);return c?c.name:sym;}
/* 小头动态数字：价格/盈亏/判决徽标（不动图表） */
function updateDyn(){
  _slotList.forEach((s,i)=>{

    const px=$('px_'+i);if(!px)return;

/* ---------- 迷你K线+笔图（/api/live，与详情页同一套笔配置） ---------- */
const TZ_OFFSET=28800;
const fixTime=data=>data.map(x=>({...x,time:x.time+TZ_OFFSET}));
const BI_DEFAULTS={bi_algo:'normal',is_strict:'1',bi_fx_check:'strict',
                   bi_end_is_peak:'1',bi_allow_sub_peak:'1',gap_as_kl:'0'};
let biConf={...BI_DEFAULTS};
try{
  const saved=JSON.parse(localStorage.getItem('cl_bi_conf')||'null');
  if(saved)Object.keys(BI_DEFAULTS).forEach(k=>{if(saved[k]!=null)biConf[k]=String(saved[k]);});
}catch(e){}
function biQuery(){
  return '&subpeak='+biConf.bi_allow_sub_peak+'&algo='+biConf.bi_algo+
         '&strict='+biConf.is_strict+'&fxcheck='+biConf.bi_fx_check+
         '&endpeak='+biConf.bi_end_is_peak+'&gap='+biConf.gap_as_kl;
}
const CHARTS={};
/* 缩放按槽位记（0~3），存 localStorage：换品种/重开页面都按该槽位的缩放来 */
const ZOOM_KEY='cl_cockpit_zoom';
let ZOOMS={};
try{ZOOMS=JSON.parse(localStorage.getItem(ZOOM_KEY)||'{}');}catch(e){ZOOMS={};}
let _zoomT={};
function zoomSaveSoon(i){
  if(_zoomT[i])return;
  _zoomT[i]=setTimeout(()=>{_zoomT[i]=null;
    const c=CHARTS[i];if(!c||!c.chart)return;
    try{
      const ts=c.chart.timeScale();
      const bs=ts.options().barSpacing;
      const lr=ts.getVisibleLogicalRange();
      if(isFinite(bs)&&bs>0&&lr&&isFinite(lr.to)&&c.klen>0){
        // 文华式全量记忆：rel=最后一根K线到右缘根数，span=一屏根数（2026-10-23 与详情页同款）
        ZOOMS[i]={bs:bs,rel:lr.to-(c.klen-1),span:Math.max(2,lr.to-lr.from)};
        localStorage.setItem(ZOOM_KEY,JSON.stringify(ZOOMS));
      }
    }catch(e){}
  },300);
}
function zoomApply(i){
  const c=CHARTS[i];if(!c||!c.chart)return;
  try{
    const ts=c.chart.timeScale();
    const z=ZOOMS[i];
    if(z&&z.rel!=null&&isFinite(z.rel)&&isFinite(z.span)&&z.span>1&&c.klen>0){
      if(isFinite(z.bs)&&z.bs>0)ts.applyOptions({barSpacing:z.bs});
      ts.applyOptions({rightOffset:Math.max(0,z.rel)});
      const to=(c.klen-1)+z.rel;
      try{ts.setVisibleLogicalRange({from:to-z.span,to:to});}catch(e){}
      return;
    }
    if(isFinite(z)&&z>0)ts.applyOptions({barSpacing:z,rightOffset:3});   // 旧格式(纯数字)兼容：只还原缩放
    ts.scrollToRealTime();
  }catch(e){}
}
/* ---------- 设置面板：右侧价格轴开关（存本机，实时作用于全部模块图） ---------- */
let _pscale=true;
try{_pscale=localStorage.getItem('cl_pscale_visible')!=='0';}catch(e){}
function paintSeg(onId,offId,on){

  o.style.background=on?'#2c3140':'#1e222d';o.style.color=on?'#f0b90b':'#787b86';o.style.fontWeight=on?'700':'400';
  f.style.background=!on?'#2c3140':'#1e222d';f.style.color=!on?'#f0b90b':'#787b86';f.style.fontWeight=!on?'700':'400';

function psChange(on){

function destroyCharts(){
  Object.values(CHARTS).forEach(c=>{try{c.timer&&clearInterval(c.timer);}catch(e){}try{c.chart.remove();}catch(e){}});
  Object.keys(CHARTS).forEach(k=>delete CHARTS[k]);
}
function mountChart(i,sym,period){
  const box=$('chart_'+i);if(!box||!window.LightweightCharts)return;
  const chart=LightweightCharts.createChart(box,{
    layout:{background:{type:'solid',color:'#131722'},textColor:'#787b86',fontSize:10},
    grid:{vertLines:{visible:false},horzLines:{visible:false}},
    rightPriceScale:{borderColor:'#2a2e39'},
    timeScale:{borderColor:'#2a2e39',timeVisible:true,secondsVisible:false,rightOffset:3},
    crosshair:{mode:0},autoSize:true});
  const candle=chart.addCandlestickSeries({upColor:'#ef5350',downColor:'#26a69a',
    borderUpColor:'#ef5350',borderDownColor:'#26a69a',wickColor:'#787b86'});   // 中国习惯：红涨绿跌
  const bi=chart.addLineSeries({color:'#f0b90b',lineWidth:1,
    priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  CHARTS[i]={sym,period,chart,candle,bi,lastBi:'',timer:null,slLine:null};
  psApply(CHARTS[i]);
  refreshChart(i);
  ctimer(i);
  slLoad(i,sym);   // 取回本品种通用止损线（与详情页同源，一条线跨级别/跨页面通用）
  alertLoadSym(i,sym);   // 取回本品种未触发的预警线（与详情页共用 /api/alerts，两页互通）
}
function ctimer(i){CHARTS[i].timer=setInterval(()=>{if(!document.hidden)refreshChart(i);},40000+i*3500);}
async function refreshChart(i){
  const c=CHARTS[i];if(!c||!c.chart)return;
  try{
    const r=await fetch('/api/live?sym='+encodeURIComponent(c.sym)+'&period='+c.period+biQuery()+'&mk=price');
    const s=await r.json();
    if(s.error||!s.kline)return;
    const biStr=JSON.stringify(s.bi||[]);
    if(biStr!==c.lastBi){
      c.lastBi=biStr;
      c.candle.setData(fixTime(s.kline||[]));
      c.bi.setData(fixTime(s.bi||[]));
      c.klen=(s.kline||[]).length;
      zoomApply(i);
      if(!c.zoomHooked){
        c.zoomHooked=true;
        c.chart.timeScale().subscribeVisibleLogicalRangeChange(()=>zoomSaveSoon(i));
      }
    }else{
      c.candle.update(fixTime(s.kline||[]).slice(-1)[0]);
      c.klen=(s.kline||[]).length;
    }
    const box=$('chart_'+i);
    if(box){const e=box.querySelector('.emsg');if(e)e.remove();}
  }catch(e){}
}

const _prevCell={};
function onCell(c){
  if(!c||!c.symbol)return;
  const k=c.symbol+'|'+c.period,prev=_prevCell[k];
  _prevCell[k]=c;
  const p=POSITIONS.find(x=>x.symbol===c.symbol);
  if(!p)return;
  const side=posIsLong(p)?'long':'short';
  const mine=c.side===side;
  const myRank=P_RANK[p.period]||0;
  if(prev&&mine&&(P_RANK[c.period]||0)>myRank){
    const pr=UP_RANK[prev.state]??0,nr=UP_RANK[c.state]??0;
    if(nr>pr&&(c.state==='conf_a'||c.state==='trig_b')){
      try{
        PopupCards.push({fp:'up_'+c.symbol+'_'+c.period+'_'+c.state,
          title:'⚠ '+p.name+' 可能要升级',
          info:(P_LAB[c.period]||c.period)+' 同方向'+(KIND_OF[c.state]==='a'?'A类':'B类')+'已确认/触发 —— 本级别卖点出现时可留底仓',
          tone:'pos',onClick:()=>gotoDetail(c.symbol,c.period),ms:12000,
          href:'/pc/detail?sym='+encodeURIComponent(c.symbol)});
      }catch(e){}
    }
  }

}

async function loadQuotes(){
  const x=new Date();
  const ts='行情 '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')+':'+String(x.getSeconds()).padStart(2,'0');
  const el=$('updTx');

    const qq=d.quotes||d;

    _slotList.forEach(s=>{

/* ---------- 模块右键菜单：一键止损线（2026-10-29 照详情页交互整套移植） ----------
   右键模块 → 一键止损线（按现价）→ 点击图面布线 → 拖线微调 → 线上实时反算 金额/手数/点数。

   乘数/最小跳动取 /api/fees；资金/止损比与详情页计算器共用 localStorage（cl_calc_*）。
   性能：布线/拖完各一次 POST，画线纯客户端，零轮询——4 个全设和 40 个没区别 */
let _slMenuSlot=-1,_slLines={},_slSettingSlot=-1,_slDragSlot=-1,_slDragOffset=0;

try{const sc=localStorage.getItem('cl_calc_capital');if(sc&&parseFloat(sc)>0)slCalc.capital=parseFloat(sc);}catch(e){}
try{const sr=localStorage.getItem('cl_calc_risk_pct');if(sr&&parseFloat(sr)>0)slCalc.riskPct=parseFloat(sr);}catch(e){}
const FEES={};
(async function(){try{
  const j=await (await fetch('/api/fees')).json();
  const d=j&&j.fees?j.fees:j;
  for(const k in d)if(d[k]&&typeof d[k]==='object')FEES[k]=d[k];

function slMult(sym){const f=FEES[sym];const m=f&&f.multiplier!=null?Number(f.multiplier):NaN;return (isFinite(m)&&m>0)?m:10;}
function snapSl(sym,price){const f=FEES[sym];const t=f&&f.min_tick!=null?Number(f.min_tick):1;
  if(!isFinite(t)||t<=0)return price;return Math.round(price/t)*t;}
function slTitleText(sym,stop){

  let lots=(slCalc.capital>0&&perLot>0)?Math.floor(maxLoss/perLot):1;if(lots<1)lots=1;
  const loss=lots*perLot;
  const over=slCalc.capital>0&&perLot>0&&(loss/slCalc.capital*100)>slCalc.riskPct*100+0.001;
  return (over?'⚠ ':'')+loss.toFixed(0)+'元/'+lots+'手/'+pts.toFixed(1)+'点';

/* 拖线（详情页同款：距线 15px 内按下 → 移动 → 松手吸附落盘） */
document.addEventListener('mousedown',function(e){
  if(_slSettingSlot>=0||_alertSettingSlot>=0||_alertDragSlot>=0)return;

      _slDragOffset=(cur!=null&&!isNaN(cur))?(c.slLine.options().price-cur):0;

    }

/* 预警线拖动（与止损线同款交互；松手按现价重算上/下穿并 PATCH） */

/* ---------- 模块右键菜单：价格预警（2026-11-02 照详情页功能移植） ----------

let _alertSettingSlot=-1,_alertDragSlot=-1,_alertDragIdx=-1,_alertDragOffset=0;

function alertCancelSet(i){

  const seen={},out=[];
  for(const k in CHARTS){
    if(CHARTS[k].sym!==sym)continue;
    for(const a of (_alertLines[k]||[]))if(!seen[a.id]){seen[a.id]=1;out.push(a);}
  }
  return out;
}
function alertRenderMenuList(sym){
  const box=$('alertMenuList');if(!box)return;
  const items=alertMenuItems(sym);
  box.innerHTML=items.length?items.map(a=>{
    let px='';try{px=a.line.options().price;}catch(e){}
    return '<button class="btn" style="display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:space-between;margin-top:6px;" onclick="alertMenuDel('+a.id+')"><span>'+(a.dir==='up'?'上穿 ':'下穿 ')+px+'</span><span style="color:#ef5350;">✕</span></button>';
  }).join(''):'<div class="mut" style="margin-top:6px;font-size:11px;">暂无预警线</div>';
}
function alertMenuDel(id){
  const sym=_slSym(_slMenuSlot);if(!sym)return;
  fetch('/api/alerts/'+id,{method:'DELETE'}).catch(()=>{});
  for(const k in CHARTS){
    const c=CHARTS[k];if(c.sym!==sym)continue;
    const arr=_alertLines[k]||[];
    for(let idx=arr.length-1;idx>=0;idx--){
      if(arr[idx].id===id){try{c.candle.removePriceLine(arr[idx].line);}catch(e){}arr.splice(idx,1);}
    }
  }
  alertRenderMenuList(sym);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&_alertSettingSlot>=0)alertCancelSet(_alertSettingSlot);});
</script>
<!-- 模块右键菜单：止损价（/api/sl_line，按品种一条通用）+ 价格预警（/api/alerts，与详情页共用，可多条）。函数在主脚本块内定义，避免执行时序竞态 -->
<div id="slMenu" style="display:none;position:fixed;z-index:10001;background:#1e222d;border:1px solid #2a2e39;border-radius:10px;padding:10px;min-width:200px;box-shadow:0 12px 40px rgba(0,0,0,.55);">
  <div class="mut" id="slMenuSym" style="margin-bottom:8px;font-size:12px;"></div>
  <div id="slMenuMain">
    <button class="btn" style="display:block;width:100%;box-sizing:border-box;text-align:center;" onclick="slStartSet()">🛡 一键止损线（按现价）</button>
    <button class="btn" style="display:block;width:100%;box-sizing:border-box;margin-top:8px;text-align:center;" onclick="alertStartSet()">⚡ 添加价格预警（点图布线）</button>
    <div id="alertMenuList"></div>
    <button class="btn" id="slMenuDel" style="display:none;width:100%;box-sizing:border-box;margin-top:8px;text-align:center;border-color:#ef5350;color:#ef5350;" onclick="slMenuDel()">✕ 删除止损线</button>
    <button class="btn" style="display:block;width:100%;box-sizing:border-box;margin-top:8px;text-align:center;" onclick="slHideMenu()">取消</button>
  </div>
</div>
</body>
</html>
