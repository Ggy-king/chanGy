<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>持仓驾驶舱 · chanGy</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#131722;color:#d1d4dc;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;}
header h1{font-size:16px;font-weight:800;letter-spacing:1px;}
header h1 span{color:#4a9eff;}
.mut{color:#787b86;font-size:11.5px;}
.sp{flex:1;}
.dot{width:8px;height:8px;border-radius:50%;background:#ef5350;flex:none;}
.dot.on{background:#26a69a;box-shadow:0 0 8px #26a69a;}
.btn{border:1px solid #2a2e39;background:#2a2e39;color:#d1d4dc;border-radius:8px;padding:5px 11px;
  font-size:12px;cursor:pointer;text-decoration:none;display:inline-block;}
.btn:hover{border-color:#4a9eff;color:#4a9eff;}
/* ===== 2×2 四仓一屏：每格竖向四模块长条（压缩版） ===== */
main{flex:1;overflow-y:auto;scrollbar-width:thin;padding:8px;}
#wrap{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:8px;}
.strip{background:#161b22;border:1px solid #2a2e39;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.shead{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;flex-wrap:wrap;}
.shead .pname{font-size:15px;font-weight:800;}
.shead .psym{color:#787b86;font-size:11px;}
.dir{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:8px;}
.dir.long{color:#ef5350;background:rgba(239,83,80,.14);}
.dir.short{color:#26a69a;background:rgba(38,166,154,.14);}
.shead .px{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
.shead .pnl{font-size:12px;font-weight:800;padding:1px 8px;border-radius:9px;}
.shead .pnl.pos{color:#ef5350;background:rgba(239,83,80,.12);}
.shead .pnl.neg{color:#26a69a;background:rgba(38,166,154,.12);}
.vbadge{font-size:12px;font-weight:800;padding:3px 11px;border-radius:9px;border:1.5px solid;}
.vbadge.hold{color:#26a69a;border-color:#26a69a;background:rgba(38,166,154,.09);}
.vbadge.warn{color:#f0b90b;border-color:#f0b90b;background:rgba(240,185,11,.08);}
.vbadge.stop{color:#ef5350;border-color:#ef5350;background:rgba(239,83,80,.12);animation:pulse 1.2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.shead button{border-radius:7px;height:26px;padding:0 11px;font-size:11.5px;font-weight:700;cursor:pointer;
  background:transparent;border:1px solid #2a2e39;color:#d1d4dc;}
.shead button:hover{border-color:#4a9eff;color:#4a9eff;}
.shead button.close{color:#ff7b7b;border-color:rgba(255,92,92,.45);background:rgba(255,92,92,.08);}
/* 四模块竖轨：左侧贯穿线 + ①②③④ 节点 */
.rail{position:relative;padding:9px 12px 9px 42px;flex:1;min-height:0;overflow:hidden;}
.rail:before{content:'';position:absolute;left:19px;top:14px;bottom:14px;width:2px;
  background:linear-gradient(#26a69a,#4a9eff,#f0b90b,#b388ff);opacity:.45;border-radius:2px;}
.mod{position:relative;margin-bottom:9px;}
.mod:last-child{margin-bottom:0;}
.mod .node{position:absolute;left:-32px;top:0;width:22px;height:22px;border-radius:50%;
  background:#1e222d;border:2px solid #4a9eff;color:#4a9eff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;}
.mod.m1 .node{border-color:#26a69a;color:#26a69a;}
.mod.m2 .node{border-color:#4a9eff;color:#4a9eff;}
.mod.m3 .node{border-color:#f0b90b;color:#f0b90b;}
.mod.m4 .node{border-color:#b388ff;color:#b388ff;}
.mod .mt{font-size:9.5px;color:#787b86;letter-spacing:1.5px;margin-bottom:5px;font-weight:700;}
.mod .mt b{color:#9aa0b0;}
/* ① 三个价 */
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.ptile{background:#0d1117;border:1px solid #2a2e39;border-radius:9px;padding:6px 9px;position:relative;min-width:0;}
.ptile .k{font-size:9.5px;color:#787b86;letter-spacing:.3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ptile .k em{font-style:normal;color:#9aa0b0;}
.ptile .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ptile .s{font-size:9.5px;color:#787b86;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ptile.hot{border-color:#ef5350;background:linear-gradient(180deg,rgba(239,83,80,.13),#0d1117);}
.ptile.hot .v{color:#ef5350;}
.ptile.near{border-color:#f0b90b;}
.ptile.gold .v{color:#f0b90b;}
.ptile.dim .v{color:#56606f;}
.ptile input{width:64px;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:6px;
  padding:2px 5px;font-size:13px;font-weight:700;}
.ptile .set{font-size:9.5px;color:#4a9eff;cursor:pointer;text-decoration:underline;margin-left:4px;}
/* ② 进场参考（当时推的确认卡） */
.refcard{display:inline-flex;align-items:center;gap:9px;background:#0d1117;border:1px solid rgba(74,158,255,.4);
  border-radius:9px;padding:5px 12px;cursor:pointer;}
.refcard:hover{background:rgba(74,158,255,.08);}
.refcard .rk{font-size:9px;color:#787b86;letter-spacing:1px;}
.refcard .rv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
.refcard .rm{font-size:10px;color:#9aa0b0;}
.refnone{font-size:11px;color:#787b86;padding:4px 2px;}
/* ③ 判决 */
.vbox{border-radius:10px;padding:7px 12px;border:1.5px solid;}
.vbox.hold{border-color:rgba(38,166,154,.55);background:linear-gradient(135deg,rgba(38,166,154,.13),rgba(38,166,154,.03));}
.vbox.warn{border-color:rgba(240,185,11,.55);background:linear-gradient(135deg,rgba(240,185,11,.11),rgba(240,185,11,.02));}
.vbox.stop{border-color:rgba(239,83,80,.65);background:linear-gradient(135deg,rgba(239,83,80,.14),rgba(239,83,80,.03));animation:pulse 1.2s ease infinite;}
.vbox .vw{font-size:14.5px;font-weight:800;margin-right:9px;}
.vbox.hold .vw{color:#26a69a;}.vbox.warn .vw{color:#f0b90b;}.vbox.stop .vw{color:#ef5350;}
.vbox .vt{font-size:11.5px;font-weight:600;line-height:1.7;display:inline;}
.vbox.stop .vt{color:#ef5350;}
/* ④ 升级链：扁块 + 箭头 */
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.lvb{background:#0d1117;border:1px solid #2a2e39;border-radius:8px;padding:3px 9px;cursor:pointer;min-width:64px;}
.lvb:hover{background:rgba(74,158,255,.07);}
.lvb.own{border-color:rgba(74,158,255,.5);}
.lvb .l1{font-size:9px;color:#787b86;display:flex;gap:4px;align-items:center;}
.lvb .l1 .own{background:#4a9eff;color:#fff;border-radius:5px;padding:0 4px;font-size:8px;font-weight:800;line-height:12px;}
.lvb .l2{font-size:11px;font-weight:800;margin-top:1px;white-space:nowrap;}
.arr{color:#3a3f4d;font-size:12px;font-weight:800;}
.chip{font-size:10.5px;padding:3px 9px;border-radius:8px;background:#0d1117;border:1px solid #2a2e39;color:#9aa0b0;white-space:nowrap;}
.chip.bad{color:#ef5350;border-color:rgba(239,83,80,.55);font-weight:800;}
.chip.gold{color:#f0b90b;border-color:rgba(240,185,11,.5);}
.chip.blue{color:#4a9eff;border-color:rgba(74,158,255,.5);}
.hintErr{font-size:11px;color:#787b86;padding:4px 2px;}
.empty{border:1.5px dashed #2a2e39;border-radius:14px;padding:30px 0;text-align:center;color:#3a3f4d;}
.empty .big{font-size:22px;font-weight:800;letter-spacing:2px;}
/* 平仓阻尼 + 交易简报弹层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;}
.modal .box{background:#1e222d;border-radius:14px;padding:22px 24px;min-width:400px;}
#damp .box{border:2px solid #ef5350;}
#damp .t{font-size:17px;font-weight:800;color:#ef5350;margin-bottom:12px;}
#damp .b{font-size:13.5px;line-height:2;color:#d1d4dc;margin-bottom:18px;}
#damp .b b{color:#f0b90b;}
#damp .ops{display:flex;gap:10px;justify-content:flex-end;}
#damp .ops button{border:none;border-radius:9px;height:38px;padding:0 20px;font-size:13.5px;font-weight:700;cursor:pointer;}
#damp .ok{background:#ef5350;color:#fff;}
#damp .no{background:#2a2e39;color:#26a69a;border:1px solid #26a69a;}
</style>
</head>
<body>
<header>
  <h1>🚗 持仓<span>驾驶舱</span></h1>
  <span class="mut">三个价 · 进场参考 · 买点有选择权，卖点没有——卖点从宽，一切归锚</span>
  <span class="sp"></span>
  <span class="conn" style="display:flex;align-items:center;gap:6px;font-size:12px;color:#787b86;">
    <span class="dot" id="dot"></span><span id="connTx">连接中…</span></span>
  <a class="btn" href="/pc/matrix">← 矩阵</a>
</header>
<main><div id="wrap"></div></main>

<div class="modal" id="damp" onclick="if(event.target===this)dampClose()">
  <div class="box">
    <div class="t" id="dampT"></div>
    <div class="b" id="dampB"></div>
    <div class="ops">
      <button class="no" onclick="dampClose()">🛡 我遵守体系</button>
      <button class="ok" id="dampGo">仍然平仓</button>
    </div>
  </div>
</div>
<div class="modal" id="pcModal">
  <div class="box">
    <h3 style="margin:0 0 12px;font-size:15px;">平仓 · 交易简报</h3>
    <p id="pcInfo" style="margin:0 0 14px;font-size:12.5px;line-height:1.9;color:#9aa0b0;"></p>
    <div id="pcResults" style="display:flex;gap:9px;margin-bottom:12px;">
      <button data-v="止盈" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止盈</button>
      <button data-v="止损" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止损</button>
      <button data-v="保本" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">保本</button>
    </div>
    <input id="pcPnl" placeholder="盈亏金额，如 +800 或 -300（选填）" style="width:100%;box-sizing:border-box;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:8px 11px;font-size:13px;">
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="document.getElementById('pcModal').style.display='none'">取消</button>
      <button class="btn" style="background:#f0b90b;color:#131722;font-weight:700;" onclick="posDelConfirm()">确认平仓</button>
    </div>
    <input type="hidden" id="pcDelId">
  </div>
</div>
<div class="modal" id="pfModal">
  <div class="box">
    <h3 style="margin:0 0 14px;font-size:15px;">编辑持仓</h3>
    <div style="display:flex;flex-direction:column;gap:9px;font-size:13px;">
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">品种</label>
        <select id="pfSymbol" disabled style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;"></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">级别</label>
        <select id="pfPeriod" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;">
          <option value="3">3分</option><option value="5">5分</option><option value="15">15分</option>
          <option value="30m">30分</option><option value="60">60分</option></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">进场</label>
        <select id="pfEntry" onchange="pfDeriveExit()" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;">
          <option value="二买">A类二买点</option><option value="二卖">A类二卖点</option>
          <option value="三买">B类三买点</option><option value="三卖">B类三卖点</option></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">离场</label>
        <select id="pfExit" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;">
          <option value="二卖">A类二卖点</option><option value="二买">A类二买点</option>
          <option value="三卖">B类三卖点</option><option value="三买">B类三买点</option></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">进场价</label>
        <input id="pfPrice" placeholder="选填，用于保本价与锁定利润测算" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;"></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">备注</label>
        <input id="pfNote" placeholder="选填" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;"></div>
    </div>
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="posFormClose()">取消</button>
      <button class="btn" id="pfSubmit" style="background:#f0b90b;color:#131722;font-weight:700;border:none;" onclick="posSubmit()">保存修改</button>
    </div>
  </div>
</div>

<script src="/popup_cards.js"></script>
<script>
const $=id=>document.getElementById(id);
let POSITIONS=[],QUOTES={},SL={},CONTRACTS=[],CELLS={},ws=null,posEditId=null;
const POS_EXIT={'二买':'二卖','二卖':'二买','三买':'三卖','三卖':'三买'};
const P_RANK={'3':3,'5':5,'15':15,'30m':30,'60':60};
const PERIODS=['3','5','15','30m','60'];
const P_LAB={'3':'3分','5':'5分','15':'15分','30m':'30分','60':'60分'};
const ST_TXT={watch_a:'观察',cand_a:'候选',cand_b:'候选',conf_a:'确认',trig_b:'触发'};
const UP_RANK={idle:0,watch_a:1,cand_a:2,cand_b:2,conf_a:3,trig_b:3,gone_b:1};
const KIND_OF={watch_a:'a',cand_a:'a',conf_a:'a',cand_b:'b',trig_b:'b',gone_b:'a'};
const FP_PAT={'VREV_CONF_LONG':'A类·二买确认','VREV_LONG':'A类·二买候选',
  'VREV_CONF_SHORT':'A类·二卖确认','VREV_SHORT':'A类·二卖候选',
  '3BUY_CAND':'B类·三买候选','3BUY_TRIG':'B类·三买触发',
  '3SELL_CAND':'B类·三卖候选','3SELL_TRIG':'B类·三卖触发'};
const posIsLong=p=>(p.entry||'').includes('买');
const posLabel=v=>{v=v||'';return v.startsWith('二')?('A类'+v+'点'):v.startsWith('三')?('B类'+v+'点'):v;};
const V_WORD={hold:'持有',warn:'警戒',stop:'止损触发'};
const durTxt=p=>{
  if(!p.open_iso)return '';
  const days=Math.floor((Date.now()-new Date(p.open_iso))/86400000);
  return days>=1?('第 '+(days+1)+' 天'):(Math.floor((Date.now()-new Date(p.open_iso))/3600000)+' 小时');
};

/* ---------- 进场参考：解析 entry_fp（进场时推的确认卡指纹 PATTERN|p1|p2） ----------
   p1 恰好就是四种买点的硬止损：A类=一买低点/一卖高点，B类=原中枢上沿/下沿。零计算。 */
function fpStruct(p){
  const parts=(p.entry_fp||'').split('|');
  if(parts.length>=3){
    const p1=parseFloat(parts[1]),p2=parseFloat(parts[2]);
    if(isFinite(p1)&&isFinite(p2))return {pat:parts[0],patTxt:FP_PAT[parts[0]]||parts[0],p1:p1,p2:p2,hard:p1};
  }
  return null;
}

/* ---------- 判决（提示性）：现价 vs 硬止损（进场卡结构点），锚接入前只有两态 ---------- */
function verdictOf(p){
  const q=(QUOTES[p.symbol]||{}).price;
  if(q==null)return null;
  const long=posIsLong(p),s=fpStruct(p);
  if(!s)return {key:'warn',txt:'这笔持仓没记录当时的进场卡，系统不知道你的结构防守位——先按你自己的进场结构手动防守',px:q};
  if(long?q<s.hard:q>s.hard)
    return {key:'stop',txt:'危险价到了：现价'+(long?'跌破':'反弹触及')+' '+s.hard+'（进场卡结构'+(long?'低点':'高点')+'，做空/做多的依据已坏）——无条件平仓，别等回头',px:q};
  const d=Math.abs(q-s.hard).toFixed(1);
  return {key:'hold',
    txt:'现价离危险价 '+s.hard+' 还有 <b style="color:#26a69a">'+d+'</b> 点，'+(long?'多单':'空单')+'安全，拿着不用动。能让你平仓的只有三件事：① '+(long?'跌破':'反弹到')+' '+s.hard+'（硬止损）→ 无条件走 ② 破止盈锚 → 止盈走（锚待接入）③ 回抽进枢 → 保本走',
    px:q};
}

/* ---------- 渲染 ---------- */
function render(){
  const wrap=$('wrap');
  wrap.innerHTML='';
  if(!POSITIONS.length){
    wrap.innerHTML='<div class="empty"><div class="big">暂无持仓</div><div class="mut" style="margin-top:8px;">等矩阵信号响了再加仓</div></div>';
    return;
  }
  POSITIONS.forEach(p=>wrap.appendChild(stripEl(p)));
  for(let i=POSITIONS.length;i<4;i++){          // 凑满 4 格：空位占格，一屏不滚动
    const s=document.createElement('div');
    s.className='empty';
    s.innerHTML='<div class="big">空仓位</div><div class="mut" style="margin-top:6px;">等矩阵信号响了再加仓</div>';
    wrap.appendChild(s);
  }
}
function stripEl(p){
  const long=posIsLong(p),unit=P_LAB[p.period]||p.period;
  const v=verdictOf(p),q=(QUOTES[p.symbol]||{}).price;
  const p0=p.price?parseFloat(p.price):null;
  const profit=(p0&&v)?(long?(v.px-p0):(p0-v.px)):null;
  const div=document.createElement('div');
  div.className='strip';
  div.innerHTML=
    '<div class="shead">'+
      '<span class="pname">'+p.name+'</span><span class="psym">'+p.symbol+'</span>'+
      '<span class="dir '+(long?'long':'short')+'">'+(long?'▲ 多单':'▼ 空单')+'</span>'+
      '<span class="mut">'+unit+' · '+posLabel(p.entry)+' 进 · 已持 '+durTxt(p)+'</span>'+
      '<span class="sp"></span>'+
      '<span class="px">'+(v?v.px:'—')+'</span>'+
      (profit==null?'':'<span class="pnl '+(profit>=0?'pos':'neg')+'">'+(profit>=0?'+':'')+profit.toFixed(1)+' 点</span>')+
      (v?'<span class="vbadge '+v.key+'">'+(v.key==='hold'?'🟢':v.key==='warn'?'🟡':'🔴')+' '+V_WORD[v.key]+'</span>':'')+
      '<button onclick="posEdit(\''+p.id+'\')">编辑</button>'+
      '<button class="close" onclick="askClose(\''+p.id+'\')">平仓</button></div>'+
    '<div class="rail">'+
      mod1(p,v,p0,long)+
      mod2(p,long)+
      mod3(v)+
      mod4(p,long)+
    '</div>';
  return div;
}
/* ① 三个价 */
function mod1(p,v,p0,long){
  const s=fpStruct(p);
  const q=v?v.px:null;
  const dist=(ref)=>(q&&ref!=null)?(Math.abs(q-ref).toFixed(1)+' 点'):('—');
  const hardHot=v&&v.key==='stop';
  const hardVal=s?s.hard:'—';
  const hardSub=s?(hardHot?'⛔ 已到！无条件平仓，别等回头':'现价距它 '+dist(s.hard)+'（'+(long?'多单跌到':'空单反弹到')+'这就平）'):('未记录进场卡——手动防守');
  const eHtml=p0?p0:('<input id="ep_'+p.id+'" placeholder="录入" size="5"><span class="set" onclick="savePrice(\''+p.id+'\')">存</span>');
  const eSub=(p0&&q!=null)?(Math.abs(q-p0).toFixed(1)+' 点缓冲'):('回抽进枢时挂成本价平仓');
  const tile=(cls,k,em,vHtml,sub)=>'<div class="ptile '+cls+'"><div class="k">'+k+' <em>'+em+'</em></div>'+
    '<div class="v">'+vHtml+'</div><div class="s">'+sub+'</div></div>';
  let body='<div class="ptiles">'+
    tile(hardHot?'hot':'','硬止损',long?'多单跌到就走':'空单涨到就走',hardVal,hardSub)+
    tile('','保本价','离开失败挂这里',eHtml,eSub)+
    tile('gold dim','移动止盈锚','破它就止盈','—','待中枢模块定稿接入')+
    '</div>';
  const sl=SL[p.symbol];
  if(sl)body+='<div class="hintErr" style="margin-top:5px;">另有矩阵⚙一键止损线：<b style="color:#9aa0b0">'+sl+'</b>（与结构硬止损不一致时，以更近者先触发）</div>';
  return '<div class="mod m1"><span class="node">①</span><div class="mt">三个价 · <b>持仓期只跟这三个价，不做主观决策</b></div>'+body+'</div>';
}
/* ② 进场参考（当时推的确认卡区间） */
function mod2(p,long){
  const s=fpStruct(p);
  let body;
  if(s){
    const col=s.pat.indexOf('LONG')>=0||s.pat.indexOf('BUY')>=0?'#ef5350':'#26a69a';
    body='<div class="refcard" onclick="gotoDetail(\''+p.symbol+'\',\''+p.period+'\')">'+
      '<div><div class="rk">进场参考 · 当时推的确认卡</div>'+
      '<div class="rv" style="color:'+col+'">'+s.patTxt+'　'+s.p1+' → '+s.p2+'</div></div>'+
      '<div class="rm">'+(P_LAB[p.period]||p.period)+'<br>结构区间</div></div>';
  }else{
    body='<div class="refnone">未记录进场结构卡（旧持仓）——升级与硬止损先按品种/级别监控，锚待中枢模块定稿后回填</div>';
  }
  return '<div class="mod m2"><span class="node">②</span><div class="mt">进场参考 · <b>拿当时推的那张卡当第一段结构，不另算</b></div>'+body+'</div>';
}
/* ③ 判决 */
function mod3(v){
  let body;
  if(!v)body='<div class="hintErr">判决等待行情…</div>';
  else body='<div class="vbox '+v.key+'"><span class="vw">'+(v.key==='hold'?'🟢':v.key==='warn'?'🟡':'🔴')+' '+V_WORD[v.key]+'</span>'+
    '<span class="vt">'+v.txt+'</span></div>';
  return '<div class="mod m3"><span class="node">③</span><div class="mt">判决 · <b>次级别波动和顶分型都是噪音，不是卖出理由</b></div>'+body+'</div>';
}
/* ④ 升级（动态）：本级别 → 更大级别，同方向形态链；确认/触发=红色可能要升级 */
function mod4(p,long){
  const side=long?'long':'short';
  const myRank=P_RANK[p.period]||0;
  const lvls=[p.period].concat(PERIODS.filter(x=>(P_RANK[x]||0)>myRank));
  let anyRed=false,anyState=false;
  const blocks=lvls.map((lv,i)=>{
    const c=CELLS[p.symbol+'|'+lv]||{};
    const st=c.state||'idle';
    const mine=st!=='idle'&&st!=='gone_b'&&c.side===side;
    if(mine)anyState=true;
    const hot=mine&&(st==='conf_a'||st==='trig_b');
    if(hot)anyRed=true;
    const col=!mine?'#56606f'
      :(KIND_OF[st]==='a'?(side==='long'?'#ef5350':'#26a69a'):(side==='long'?'#f0b90b':'#b388ff'));
    const txt=mine?((KIND_OF[st]==='a'?'A类·':'B类·')+(ST_TXT[st]||'')):'监控中';
    const ownTag=lv===p.period?'<span class="own">本</span>':'';
    const arrow=i?'<span class="arr">→</span>':'';
    return arrow+'<div class="lvb'+(lv===p.period?' own':'')+'" style="border-color:'+col+'55" '+
      'onclick="gotoDetail(\''+p.symbol+'\',\''+lv+'\')">'+
      '<div class="l1">'+(P_LAB[lv]||lv)+ownTag+'</div>'+
      '<div class="l2" style="color:'+col+'">'+txt+'</div></div>';
  }).join('');
  let tail;
  if(anyRed)tail='<span class="chip bad">⚠ 可能要升级 —— 更大级别同向已确认</span>';
  else if(anyState)tail='<span class="chip gold">大级别同向酝酿中</span>';
  else tail='<span class="chip">监控中 · 更大级别暂无同向形态</span>';
  return '<div class="mod m4"><span class="node">④</span><div class="mt">升级 · <b>更大级别出现同方向同类型，才标升级</b></div>'+
    '<div class="chain">'+blocks+tail+'</div></div>';
}
function gotoDetail(sym,period){location.href='/pc/detail?sym='+encodeURIComponent(sym)+'&period='+encodeURIComponent(period);}

/* ---------- 平仓：判决红灯直通，绿/黄弹阻尼（软熔断） ---------- */
function askClose(id){
  const p=POSITIONS.find(x=>x.id===id);if(!p)return;
  const v=verdictOf(p);
  if(v&&v.key==='stop'){
    if(confirm('✅ 体系放行：'+V_WORD[v.key]+' —— '+v.txt+'\n确认进入平仓简报？'))posDel(id);
    return;
  }
  $('dampT').textContent='⚠ 体系判定：现在卖出违反你的出场规则';
  $('dampB').innerHTML='当前判决：<b>'+((v&&v.key==='warn')?'🟡 警戒':'🟢 持有')+'</b> —— '+(v?v.txt:'')+
    '<br>你的出场只有三个价：破<b>止盈锚</b>止盈走、回抽进枢<b>保本</b>走、破<b>硬止损</b>无条件走。'+
    '<br>其他一切（顶分型、次级别回调、心里发慌）都不构成卖出理由。'+
    '<br>历史上你亏的不是拿久了，是<b>卖早了</b>。';
  $('dampGo').textContent='仍然平仓（我接受）';
  $('dampGo').onclick=()=>{dampClose();posDel(id);};
  $('damp').style.display='flex';
}
function dampClose(){$('damp').style.display='none';}
function posDel(id){
  const rec=POSITIONS.find(x=>x.id===id);if(!rec)return;
  const now=new Date();
  const opened=rec.open_iso?new Date(rec.open_iso):now;
  const hold=Math.max(0,Math.round((now-opened)/60000));
  const hm=hold>=60?Math.floor(hold/60)+'小时'+hold%60+'分':hold+'分钟';
  $('pcInfo').innerHTML='<b style="color:#d1d4dc">'+rec.name+'（'+rec.symbol+'）</b> '+(P_LAB[rec.period]||rec.period)+'<br>'+
    '进场 <b style="color:#d1d4dc">'+posLabel(rec.entry)+'</b> → 离场 <b style="color:#d1d4dc">'+posLabel(rec.exit)+'</b><br>'+
    '开仓 '+rec.open_time+' '+rec.weekday+' · 持仓 <b style="color:#e8d44d">'+hm+'</b><br>'+
    '<span style="font-size:11px;">简报全部选填，直接确认就是平仓删除</span>';
  $('pcDelId').value=id;
  document.querySelectorAll('#pcResults button').forEach(x=>x.classList.remove('sel'));
  $('pcPnl').value='';
  $('pcModal').style.display='flex';
}
async function posDelConfirm(){
  const id=$('pcDelId').value;
  const selB=document.querySelector('#pcResults button.sel');
  try{
    const r=await fetch('/api/positions/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id,close_result:selB?selB.dataset.v:'',close_pnl:$('pcPnl').value.trim()})});
    const d=await r.json();
    if(d.error){alert(d.error);return;}
    POSITIONS=d.positions||[];render();
  }catch(e){alert('平仓失败：'+e);}
  $('pcModal').style.display='none';
}
function pcSel(b){
  document.querySelectorAll('#pcResults button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
}

/* ---------- 编辑持仓 / 进场价录入 ---------- */
function posEdit(id){posFormOpen(id);}
function posFormOpen(editId){
  posEditId=editId||null;
  const sel=$('pfSymbol');
  if(CONTRACTS.length)sel.innerHTML=CONTRACTS.map(c=>'<option value="'+c.symbol+'">'+c.name+' '+c.symbol+'</option>').join('');
  const rec=editId?POSITIONS.find(x=>x.id===editId):null;
  if(rec){
    sel.value=rec.symbol;
    $('pfPeriod').value=rec.period;
    $('pfEntry').value=rec.entry;
    $('pfExit').value=rec.exit;
    $('pfPrice').value=rec.price||'';
    $('pfNote').value=rec.note||'';
    $('pfSubmit').textContent='保存修改';
  }
  $('pfModal').style.display='flex';
}
function posFormClose(){$('pfModal').style.display='none';posEditId=null;}
function pfDeriveExit(){$('pfExit').value=POS_EXIT[$('pfEntry').value]||'';}
async function posSubmit(){
  if(!posEditId)return;
  const body={id:posEditId,period:$('pfPeriod').value,entry:$('pfEntry').value,exit:$('pfExit').value,
    note:$('pfNote').value.trim()};
  const pv=parseFloat($('pfPrice').value);
  if(pv>0)body.price=pv;
  try{
    const r=await fetch('/api/positions/update',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const d=await r.json();
    if(d.error){alert(d.error);return;}
    POSITIONS=d.positions||[];render();
  }catch(e){alert('保存失败：'+e);}
  posFormClose();
}
async function savePrice(id){
  const el=$('ep_'+id);if(!el)return;
  const v=parseFloat(el.value);
  if(!v||v<=0){alert('请输入有效的价格');return;}
  try{
    const r=await fetch('/api/positions/update',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id,price:v})});
    const d=await r.json();
    if(d.error){alert(d.error);return;}
    POSITIONS=d.positions||[];render();
  }catch(e){alert('保存失败：'+e);}
}

/* ---------- 升级推送：更大级别同方向形态推进（观察→候选→确认/触发）→ 右上角红色弹卡 ---------- */
const _prevCell={};
function onCell(c){
  if(!c||!c.symbol)return;
  const k=c.symbol+'|'+c.period,prev=_prevCell[k];
  _prevCell[k]=c;
  const p=POSITIONS.find(x=>x.symbol===c.symbol);
  if(!p)return;
  const side=posIsLong(p)?'long':'short';
  const mine=c.side===side;
  const myRank=P_RANK[p.period]||0;
  if(prev&&mine&&(P_RANK[c.period]||0)>myRank){
    const pr=UP_RANK[prev.state]??0,nr=UP_RANK[c.state]??0;
    if(nr>pr&&(c.state==='conf_a'||c.state==='trig_b')){
      try{
        PopupCards.push({fp:'up_'+c.symbol+'_'+c.period+'_'+c.state,
          title:'⚠ '+p.name+' 可能要升级',
          info:(P_LAB[c.period]||c.period)+' 同方向'+(KIND_OF[c.state]==='a'?'A类':'B类')+'已确认/触发 —— 本级别卖点出现时可留底仓',
          tone:'pos',onClick:()=>gotoDetail(c.symbol,c.period),ms:12000,
          href:'/pc/detail?sym='+encodeURIComponent(c.symbol)});
      }catch(e){}
    }
  }
  CELLS[k]=c;
  render();
}

/* ---------- 数据 ---------- */
async function loadPositions(){
  try{const r=await fetch('/api/positions');const d=await r.json();POSITIONS=d.positions||[];render();}catch(e){}
}
async function loadQuotes(){
  try{
    const r=await fetch('/api/quotes');const d=await r.json();
    const qq=d.quotes||d;
    POSITIONS.forEach(p=>{if(qq[p.symbol])QUOTES[p.symbol]=qq[p.symbol];});
    render();
  }catch(e){}
}
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/ws?role=pc');
  ws.onopen=()=>{$('dot').classList.add('on');$('connTx').textContent='已连接';};
  ws.onclose=()=>{$('dot').classList.remove('on');$('connTx').textContent='断线重连中…';setTimeout(connect,3000);};
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(m.type==='pattern_state')onCell(m.cell);
  };
}
(async function(){
  try{
    const r=await fetch('/api/pattern_matrix');
    const d=await r.json();
    CONTRACTS=d.contracts||[];
    (d.cells||[]).forEach(c=>{CELLS[c.symbol+'|'+c.period]=c;_prevCell[c.symbol+'|'+c.period]=c;});
  }catch(e){}
  await loadPositions();
  loadQuotes();
  try{POSITIONS.forEach(async p=>{
    const r=await fetch('/api/sl_line?sym='+encodeURIComponent(p.symbol));
    const d=await r.json();SL[p.symbol]=d.price;render();
  });}catch(e){}
  connect();
  setInterval(loadQuotes,10000);      // 现价 10s（判决实时复算）
  setInterval(loadPositions,30000);   // 持仓 30s
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadPositions();loadQuotes();}});
})();
</script>
</body>
