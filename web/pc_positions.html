<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>持仓驾驶舱 · chanGy</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#131722;color:#d1d4dc;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;}
header h1{font-size:16px;font-weight:800;letter-spacing:1px;}
header h1 span{color:#4a9eff;}
.mut{color:#787b86;font-size:11.5px;}
.sp{flex:1;}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:#787b86;}
.dot{width:8px;height:8px;border-radius:50%;background:#ef5350;}
.dot.on{background:#26a69a;box-shadow:0 0 8px #26a69a;}
.btn{border:1px solid #2a2e39;background:#2a2e39;color:#d1d4dc;border-radius:8px;padding:5px 11px;
  font-size:12px;cursor:pointer;text-decoration:none;display:inline-block;}
.btn:hover{border-color:#4a9eff;color:#4a9eff;}
/* ===== 2×2 网格：最多4仓，一屏放下，不滚动 ===== */
main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:10px;min-height:0;}
.slot{border:1.5px dashed #2a2e39;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#3a3f4d;}
.slot .big{font-size:22px;font-weight:800;letter-spacing:2px;}
.slot .mut{margin-top:6px;}
.posBig{background:#161b22;border:1px solid #2a2e39;border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.posBig .head{display:flex;align-items:center;gap:8px;padding:6px 14px;flex:none;}
.posBig .pname{font-size:16px;font-weight:800;}
.posBig .psym{color:#787b86;font-size:11.5px;}
.posBig .dir{font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;}
.posBig .dir.long{color:#ef5350;background:rgba(239,83,80,.14);}
.posBig .dir.short{color:#26a69a;background:rgba(38,166,154,.14);}
.posBig .sp{flex:1;}
/* 许可灯（紧凑一行） */
.light{display:flex;align-items:center;gap:10px;padding:7px 14px;font-weight:800;flex:none;}
.light .lamp{font-size:20px;line-height:1;}
.light .ltxt{font-size:14.5px;line-height:1.4;}
.light.green{background:rgba(38,166,154,.10);border-top:1px solid rgba(38,166,154,.4);border-bottom:2px solid rgba(38,166,154,.55);}
.light.green .ltxt{color:#26a69a;}
.light.yellow{background:rgba(240,185,11,.08);border-top:1px solid rgba(240,185,11,.4);border-bottom:2px solid rgba(240,185,11,.55);}
.light.yellow .ltxt{color:#f0b90b;}
.light.red{background:rgba(239,83,80,.13);border-top:1px solid rgba(239,83,80,.4);border-bottom:2px solid rgba(239,83,80,.6);animation:pulse 1.2s ease infinite;}
.light.red .ltxt{color:#ef5350;}
@keyframes pulse{0%,100%{background:rgba(239,83,80,.13);}50%{background:rgba(239,83,80,.24);}}
/* 主体：左=格子+价格，右=活卡片 */
.body{flex:1;display:flex;min-height:0;}
.left{width:38%;flex:none;border-right:1px solid #2a2e39;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0;}
/* 级别阶梯：本级别+更大级别永远在榜，酝酿→观察→候选→确认 四段进度（升级感） */
.ladder{display:flex;gap:8px;padding:8px 14px;flex:none;border-bottom:1px dashed #2a2e39;overflow-x:auto;scrollbar-width:none;}
.ladder::-webkit-scrollbar{display:none;}
.lv{flex:1;min-width:106px;background:#0d1117;border:1px solid #2a2e39;border-radius:10px;padding:6px 10px;cursor:pointer;}
.lv.own{border-color:rgba(74,158,255,.45);background:linear-gradient(180deg,rgba(74,158,255,.09),rgba(13,17,23,.4));}
.lv .lvh{display:flex;align-items:center;gap:5px;font-size:10px;}
.lv .lvname{font-weight:800;font-size:11px;color:#9aa0b0;}
.lv .own{background:#4a9eff;color:#fff;border-radius:6px;padding:0 5px;font-size:9px;font-weight:800;line-height:15px;}
.lv .dirchip{margin-left:auto;font-size:9.5px;font-weight:800;}
.lv .st{font-size:12.5px;font-weight:800;margin-top:3px;}
.lv .steps{display:flex;gap:3px;margin-top:5px;}
.lv .steps i{flex:1;height:3px;border-radius:2px;background:#222836;}
.lv .steps i.on{background:currentColor;}
/* 升级推送卡 */
.evt.UP{border-left-color:#4a9eff;background:linear-gradient(135deg,rgba(74,158,255,.15),rgba(74,158,255,.03));}
.evt.UP .kind{background:rgba(74,158,255,.22);color:#4a9eff;}
.more{font-size:10.5px;color:#4a9eff;cursor:pointer;padding:4px 2px;text-align:center;}
.more:hover{text-decoration:underline;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.pgrid>div{background:#0d1117;border-radius:8px;padding:5px 7px;}
.pgrid .k{font-size:9px;color:#787b86;letter-spacing:.5px;margin-bottom:2px;white-space:nowrap;}
.pgrid .v{font-size:13px;font-weight:800;white-space:nowrap;}
.pgrid .v.pos{color:#ef5350;} .pgrid .v.neg{color:#26a69a;} .pgrid .v.dim{color:#9aa0b0;font-weight:600;font-size:11.5px;}
.pgrid input{width:60px;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:5px;
  padding:2px 5px;font-size:12px;font-weight:700;}
.pgrid .set{font-size:9.5px;color:#4a9eff;cursor:pointer;text-decoration:underline;margin-left:4px;}
/* 活卡片（矩阵同款） */
.cards{flex:1;min-width:0;overflow-y:auto;scrollbar-width:none;padding-right:2px;}
.cards::-webkit-scrollbar{display:none;}
.cards .ct{font-size:9px;color:#787b86;letter-spacing:2px;margin-bottom:5px;}
.evt{position:relative;background:#1b202b;border-left:3px solid #2a2e39;border-radius:9px;
  padding:6px 10px;margin-bottom:6px;cursor:pointer;}
.evt .r1{display:flex;align-items:center;font-size:10.5px;color:#787b86;gap:6px;}
.evt .r1 .kind{font-weight:800;padding:1px 8px;border-radius:9px;font-size:10px;}
.evt .r1 .bif{font-size:9.5px;padding:1px 7px;border-radius:9px;border:1px solid #3a3f4d;color:#7c8190;}
.evt .r1 .bif.on{background:rgba(240,185,11,.16);border-color:#f0b90b;color:#f0b90b;font-weight:800;}
.evt.A.long .kind{background:rgba(239,83,80,.25);color:#ef5350;}
.evt.A.short .kind{background:rgba(38,166,154,.25);color:#26a69a;}
.evt.B.long .kind{background:rgba(240,185,11,.22);color:#f0b90b;}
.evt.B.short .kind{background:rgba(179,136,255,.22);color:#b388ff;}
.evt.A.long{background:linear-gradient(135deg,rgba(239,83,80,.20),rgba(239,83,80,.04));border-left-color:#ef5350;}
.evt.A.short{background:linear-gradient(135deg,rgba(38,166,154,.20),rgba(38,166,154,.04));border-left-color:#26a69a;}
.evt.B.long{background:linear-gradient(135deg,rgba(240,185,11,.16),rgba(240,185,11,.03));border-left-color:#f0b90b;}
.evt.B.short{background:linear-gradient(135deg,rgba(179,136,255,.16),rgba(179,136,255,.03));border-left-color:#b388ff;}
.evt .r2{font-size:13px;font-weight:800;margin-top:2px;}
.evt .r3{font-size:12px;color:#d1d4dc;font-weight:700;}
.evt .r4{font-size:10.5px;color:#9aa0b0;margin-top:1px;}
.cards .none{font-size:11px;color:#56606f;padding:10px 4px;}
/* 规则与操作 */
.foot{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px dashed #2a2e39;flex:none;}
.foot .rule{font-size:10.5px;color:#787b86;line-height:1.55;flex:1;}
.foot .rule b{color:#9aa0b0;}
.foot button{border-radius:8px;height:30px;padding:0 16px;font-size:12px;font-weight:700;cursor:pointer;
  background:transparent;border:1px solid #2a2e39;color:#d1d4dc;}
.foot button:hover{border-color:#4a9eff;color:#4a9eff;}
.foot button.close{color:#ff7b7b;border-color:rgba(255,92,92,.45);background:rgba(255,92,92,.08);}
.foot button.close:hover{border-color:#ff7b7b;color:#ff7b7b;}
/* 平仓阻尼 + 交易简报弹层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;}
.modal .box{background:#1e222d;border-radius:14px;padding:22px 24px;min-width:400px;}
#damp .box{border:2px solid #ef5350;}
#damp .t{font-size:17px;font-weight:800;color:#ef5350;margin-bottom:12px;}
#damp .b{font-size:13.5px;line-height:2;color:#d1d4dc;margin-bottom:18px;}
#damp .b b{color:#f0b90b;}
#damp .ops{display:flex;gap:10px;justify-content:flex-end;}
#damp .ops button{border:none;border-radius:9px;height:38px;padding:0 20px;font-size:13.5px;font-weight:700;cursor:pointer;}
#damp .ok{background:#ef5350;color:#fff;}
#damp .no{background:#2a2e39;color:#26a69a;border:1px solid #26a69a;}
</style>
</head>
<body>
<header>
  <h1>🚗 持仓<span>驾驶舱</span></h1>
  <span class="mut">持有许可 · 实时判决 · 卖出只认体系信号</span>
  <span class="sp"></span>
  <span class="conn"><span class="dot" id="dot"></span><span id="connTx">连接中…</span></span>
  <a class="btn" href="/pc/matrix">← 矩阵</a>
</header>
<main id="grid"></main>

<div class="modal" id="damp" onclick="if(event.target===this)dampClose()">
  <div class="box">
    <div class="t" id="dampT"></div>
    <div class="b" id="dampB"></div>
    <div class="ops">
      <button class="no" onclick="dampClose()">🛡 我遵守体系</button>
      <button class="ok" id="dampGo">仍然平仓</button>
    </div>
  </div>
</div>
<div class="modal" id="pcModal">
  <div class="box">
    <h3 style="margin:0 0 12px;font-size:15px;">平仓 · 交易简报</h3>
    <p id="pcInfo" style="margin:0 0 14px;font-size:12.5px;line-height:1.9;color:#9aa0b0;"></p>
    <div id="pcResults" style="display:flex;gap:9px;margin-bottom:12px;">
      <button data-v="止盈" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止盈</button>
      <button data-v="止损" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">止损</button>
      <button data-v="保本" onclick="pcSel(this)" style="flex:1;padding:8px 0;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#d1d4dc;cursor:pointer;font-size:13px;">保本</button>
    </div>
    <input id="pcPnl" placeholder="盈亏金额，如 +800 或 -300（选填）" style="width:100%;box-sizing:border-box;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:8px 11px;font-size:13px;">
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="document.getElementById('pcModal').style.display='none'">取消</button>
      <button class="btn" style="background:#f0b90b;color:#131722;font-weight:700;" onclick="posDelConfirm()">确认平仓</button>
    </div>
    <input type="hidden" id="pcDelId">
  </div>
</div>
<div class="modal" id="pfModal">
  <div class="box">
    <h3 style="margin:0 0 14px;font-size:15px;">编辑持仓</h3>
    <div style="display:flex;flex-direction:column;gap:9px;font-size:13px;">
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">品种</label>
        <select id="pfSymbol" disabled style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;"></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">级别</label>
        <select id="pfPeriod" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;">
          <option value="3">3分</option><option value="5">5分</option><option value="15">15分</option>
          <option value="30m">30分</option><option value="60">60分</option></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">进场</label>
        <select id="pfEntry" onchange="pfDeriveExit()" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;">
          <option value="二买">A类二买点</option><option value="二卖">A类二卖点</option>
          <option value="三买">B类三买点</option><option value="三卖">B类三卖点</option></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">离场</label>
        <select id="pfExit" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;">
          <option value="二卖">A类二卖点</option><option value="二买">A类二买点</option>
          <option value="三卖">B类三卖点</option><option value="三买">B类三买点</option></select></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">进场价</label>
        <input id="pfPrice" placeholder="选填，用于锁定利润测算" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;"></div>
      <div style="display:flex;align-items:center;gap:10px;"><label style="width:40px;color:#787b86;">备注</label>
        <input id="pfNote" placeholder="选填" style="flex:1;background:#131722;border:1px solid #2a2e39;color:#d1d4dc;border-radius:8px;padding:7px 9px;"></div>
    </div>
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" onclick="posFormClose()">取消</button>
      <button class="btn" id="pfSubmit" style="background:#f0b90b;color:#131722;font-weight:700;border:none;" onclick="posSubmit()">保存修改</button>
    </div>
  </div>
</div>

<script src="/popup_cards.js"></script>
<script>
const $=id=>document.getElementById(id);
let POSITIONS=[],CELLS={},QUOTES={},SL={},CONTRACTS=[],EVTS=[],UPCARDS=[],EXP={},ws=null,posEditId=null;
const POS_EXIT={'二买':'二卖','二卖':'二买','三买':'三卖','三卖':'三买'};
const P_RANK={'3':3,'5':5,'15':15,'30m':30,'60':60};
const P_LAB={'3':'3分','5':'5分','15':'15分','30m':'30分','60':'60分'};
const ST_TXT={'conf_a':'确认','cand_a':'候选','cand_b':'候选','trig_b':'触发','watch_a':'观察','gone_b':'作废'};
const posIsLong=p=>(p.entry||'').includes('买');
const posLabel=v=>{v=v||'';return v.startsWith('二')?('A类'+v+'点'):v.startsWith('三')?('B类'+v+'点'):v;};

/* ---------- 许可灯与判决（与矩阵持仓状态卡同一套推导，零新增逻辑） ---------- */
function analyze(p){
  const long=posIsLong(p), exitSide=long?'short':'long';
  const myRank=P_RANK[p.period]||0;
  const own=CELLS[p.symbol+'|'+p.period]||{state:'idle',symbol:p.symbol,period:p.period};
  const bigger=Object.keys(CELLS).map(k=>CELLS[k])
    .filter(c=>c.symbol===p.symbol&&(P_RANK[c.period]||0)>myRank&&c.state&&c.state!=='idle')
    .sort((a,b)=>(P_RANK[a.period]||0)-(P_RANK[b.period]||0));
  const ex=own.side===exitSide?own.state:null;
  const upB=bigger.find(c=>c.side===(long?'long':'short')&&(c.state==='conf_a'||c.state==='trig_b'));
  let light,lightTxt;
  if(ex==='conf_a'){light='red';lightTxt='离场预警 · A类'+(long?'卖':'买')+'点确认 —— 按体系：平仓';}
  else if(ex==='trig_b'){light='red';lightTxt='⛔ 无条件全平 · B类'+(long?'卖':'买')+'点触发';}
  else if(ex){light='yellow';lightTxt='观察 · 本级别反向'+(own.state==='cand_a'?'A类候选':'B类候选')+' —— 不算离场信号，不许卖';}
  else if(upB){light='yellow';lightTxt='机会 · '+(P_LAB[upB.period]||upB.period)+'同向'+(upB.state==='conf_a'?'A类确认':'B类触发')+' —— 本级别卖点出现时可留底仓';}
  else{light='green';lightTxt='持有 · 本级别卖点未出现 —— 现在卖出 = 违反体系';}
  return {light,lightTxt,long};
}
/* ---------- 级别阶梯（本级别+更大级别永远在榜；酝酿→观察→候选→确认 升级感） ---------- */
const PERIODS=['3','5','15','30m','60'];
const UP_RANK={idle:0,watch_a:1,cand_a:2,cand_b:2,conf_a:3,trig_b:3,gone_b:1};
const ST_LAB={watch_a:'观察中',cand_a:'候选中',cand_b:'候选中',conf_a:'已确认',trig_b:'已触发',gone_b:'作废'};
function lvDiv(p,lvl){
  const c=CELLS[p.symbol+'|'+lvl]||{state:'idle',symbol:p.symbol,period:lvl};
  const st=c.state||'idle';
  const stage=UP_RANK[st]??0;
  const kind=st.indexOf('_a')>=0?'a':'b', side=c.side||'';
  const col=st==='idle'?'#56606f'
    :kind==='a'?(side==='long'?'#ef5350':'#26a69a')
    :(side==='long'?'#f0b90b':'#b388ff');
  const txt=st==='idle'?'酝酿中':(kind==='a'?'A类·':'B类·')+(ST_LAB[st]||'酝酿中');
  const lit=st==='idle'?0:Math.min(stage+1,4);
  const steps=[0,1,2,3].map(i=>'<i class="'+(i<lit?'on':'')+'"></i>').join('');
  const isOwn=lvl===p.period;
  return '<div class="lv'+(isOwn?' own':'')+'" style="color:'+col+'" '+
    'onclick="location.href=\'/pc/detail?sym='+encodeURIComponent(p.symbol)+'&period='+encodeURIComponent(lvl)+'\'">'+
    '<div class="lvh"><span class="lvname">'+(P_LAB[lvl]||lvl)+'</span>'+(isOwn?'<span class="own">本</span>':'')+
    (side?'<span class="dirchip">'+(side==='long'?'▲多':'▼空')+'</span>':'')+'</div>'+
    '<div class="st">'+txt+'</div><div class="steps">'+steps+'</div></div>';
}

/* ---------- 活卡片（矩阵同款渲染，只取本级别+大级别） ---------- */
const evKey=m=>m.fingerprint||('k_'+m.pattern+m.symbol+m.period+m.time);
const trigT=m=>m.trigger_time||m.time||'';
const isConf=m=>{
  if(m.snapshot||m.state)return m.state==='conf_a'||m.state==='trig_b';
  const p=(m.pattern||'');
  return p.indexOf('CONF')>=0||p.indexOf('TRIG')>=0;
};
function upsertEvent(m){
  const k=evKey(m);
  const i=EVTS.findIndex(x=>evKey(x)===k);
  if(i>=0){
    m.first_time=(EVTS[i].first_time||EVTS[i].time);
    if(EVTS[i].time===m.time&&EVTS[i].price===m.price&&!!EVTS[i].bi_formed===!!m.bi_formed){EVTS[i]=m;return;}
    EVTS[i]=m;
  }else{
    m.first_time=m.first_time||m.time;
    EVTS.push(m);
    if(EVTS.length>200)EVTS=EVTS.slice(-200);
  }
}
function cardEl(m){
  const div=document.createElement('div');
  if(m._up){   /* 升级推送卡：级别状态推进 观察→候选→确认 */
    const col=m.side==='long'?'#ef5350':m.side==='short'?'#26a69a':'#4a9eff';
    const lab=s=>({idle:'酝酿',watch_a:'观察',cand_a:'候选',cand_b:'候选',conf_a:'确认',trig_b:'触发',gone_b:'作废'}[s]||s);
    const kl=(m.to||'').indexOf('_a')>=0?'A类':'B类';
    div.className='evt UP';
    div.onclick=()=>location.href='/pc/detail?sym='+encodeURIComponent(m.symbol)+'&period='+encodeURIComponent(m.period||'15');
    div.innerHTML='<div class="r1"><span class="kind">⬆ 升级</span><span>'+fmtTs(m._ts)+'</span></div>'+
      '<div class="r2">'+(m.name||m.symbol||'')+' <span class="mut" style="font-size:10.5px">'+(P_LAB[m.period]||m.period||'')+'</span>'+
      '<span style="float:right;color:'+col+'">'+(m.side==='long'?'▲多':m.side==='short'?'▼空':'')+'</span></div>'+
      '<div class="r3">'+kl+' '+lab(m.from)+' → <b style="color:#4a9eff">'+lab(m.to)+'</b></div>';
    return div;
  }
  const long=(m.side||'long')==='long';
  const cls=m.kind==='A'?('A '+m.side):('B '+m.side);
  const kind=m.snapshot
    ?(m.state==='watch_a'?'A类·观察':m.state==='cand_a'?'A类·候选':m.state==='conf_a'?'A类·确认':m.state==='trig_b'?'B类·触发':'B类·候选')
    :((m.pattern||'').startsWith('VREV_CONF')?'A类·确认'
      :(m.pattern||'').startsWith('VREV')?'A类·候选'
      :(m.pattern||'').includes('TRIG')?'B类·触发':'B类·候选');
  const sub=m.kind==='A'
    ?(m.snapshot?'观察中，破位即报警':('3→4跨 <b>'+(m.bi_span??'?')+'</b> 笔'))
    :('幅度 <b>'+(m.ratio??'?')+'</b>×');
  const cont=!!(m.first_time&&m.first_time!==trigT(m));
  const confCard=isConf(m)||(m.state==='conf_a'||m.state==='trig_b');
  const bif=confCard?(m.bi_formed?'<span class="bif on">已成笔</span>':'<span class="bif">未成笔</span>'):'';
  div.className='evt '+cls;
  div.onclick=()=>location.href='/pc/detail?sym='+encodeURIComponent(m.symbol)+'&period='+encodeURIComponent(m.period||'15');
  div.innerHTML='<div class="r1"><span class="kind">'+kind+'</span>'+
    (cont?'<span style="color:#e8b339;font-size:9.5px">延续</span>':'')+
    '<span>'+fmtT(trigT(m))+'</span>'+bif+'</div>'+
    '<div class="r2">'+(m.name||m.symbol||'')+' <span class="mut" style="font-size:10.5px">'+(P_LAB[m.period]||m.period||'')+'</span>'+
    '<span style="float:right;color:'+(long?'#ef5350':'#26a69a')+'">'+(long?'▲多':'▼空')+'</span></div>'+
    '<div class="r3">'+(m.price??'')+'</div>'+
    '<div class="r4">'+(m.brief||sub||'')+'</div>';
  return div;
}
const fmtT=t=>t?String(t).replace('T',' ').slice(5,16):'';
const fmtTs=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return (p(d.getMonth()+1))+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());};

/* ---------- 渲染 ---------- */
let _prevLight={};
function render(){
  const grid=$('grid');
  grid.innerHTML='';
  const n=Math.max(4,POSITIONS.length);
  for(let i=0;i<n;i++){
    const p=POSITIONS[i];
    if(!p){
      const s=document.createElement('div');
      s.className='slot';
      s.innerHTML='<div class="big">空仓位</div><div class="mut">等矩阵信号响了再加仓</div>';
      grid.appendChild(s);
      continue;
    }
    grid.appendChild(panelEl(p));
  }
}
function panelEl(p){
  const a=analyze(p), long=a.long, unit=P_LAB[p.period]||p.period;
  const myRank=P_RANK[p.period]||0;
  const q=(QUOTES[p.symbol]||{}).price;
  const p0=p.price?parseFloat(p.price):null;
  const sl=SL[p.symbol]||null;
  let profit=null,locked=null,expo=null;
  if(p0&&q)profit=long?(q-p0):(p0-q);
  if(p0&&sl)locked=long?Math.max(sl-p0,0):Math.max(p0-sl,0);
  if(q&&sl)expo=long?(q-sl):(sl-q);
  const dur=(()=>{
    if(!p.open_iso)return '';
    const days=Math.floor((Date.now()-new Date(p.open_iso))/86400000);
    return days>=1?('第 '+(days+1)+' 天'):(Math.floor((Date.now()-new Date(p.open_iso))/3600000)+' 小时');
  })();
  const myEvs=EVTS.filter(m=>m.symbol===p.symbol&&(m.period===p.period||(P_RANK[m.period]||0)>myRank))
    .map(m=>({_t:Date.parse(trigT(m))||Date.parse(String(trigT(m)).replace(' ','T'))||0,m}));
  const myUps=UPCARDS.filter(u=>u.symbol===p.symbol&&(u.period===p.period||(P_RANK[u.period]||0)>myRank))
    .map(u=>({_t:u._ts,m:u}));
  const all=myEvs.concat(myUps).sort((x,y)=>y._t-x._t);
  const total=all.length, show=EXP[p.id]?all:all.slice(0,3);
  const div=document.createElement('div');
  div.className='posBig';
  div.innerHTML=
    '<div class="head"><span class="pname">'+p.name+'</span><span class="psym">'+p.symbol+'</span>'+
      '<span class="dir '+(long?'long':'short')+'">'+(long?'▲ 多单':'▼ 空单')+'</span>'+
      '<span class="mut">'+unit+' · '+posLabel(p.entry)+' → '+posLabel(p.exit)+' · 已持 '+dur+'</span><span class="sp"></span></div>'+
    '<div class="light '+a.light+'"><span class="lamp">'+(a.light==='green'?'🟢':a.light==='yellow'?'🟡':'🔴')+'</span>'+
      '<span class="ltxt">'+a.lightTxt+'</span></div>'+
    '<div class="ladder">'+[p.period].concat(PERIODS.filter(x=>(P_RANK[x]||0)>myRank)).map(l=>lvDiv(p,l)).join('')+'</div>'+
    '<div class="body"><div class="left">'+
      '<div class="pgrid">'+
        '<div><div class="k">进场价</div><div class="v">'+(p0?p0:'<input id="ep_'+p.id+'" placeholder="录入" size="4"><span class="set" onclick="savePrice(\''+p.id+'\')">存</span>')+'</div></div>'+
        '<div><div class="k">现价</div><div class="v dim">'+(q||'—')+'</div></div>'+
        '<div><div class="k">浮盈（点）</div><div class="v '+(profit==null?'dim':profit>=0?'pos':'neg')+'">'+(profit==null?'—':(profit>=0?'+':'')+profit.toFixed(1))+'</div></div>'+
        '<div><div class="k">止损线</div><div class="v dim">'+(sl||'矩阵⚙设')+'</div></div>'+
        '<div><div class="k">已锁定</div><div class="v '+(locked>0?'pos':'dim')+'">'+(sl?(p0?(locked>0?'+'+locked.toFixed(1):'0'):'—'):'—')+'</div></div>'+
        '<div><div class="k">敞口→止损</div><div class="v '+(expo==null?'dim':'neg')+'">'+(expo==null?'—':expo.toFixed(1))+'</div></div>'+
      '</div></div>'+
      '<div class="cards"><div class="ct">实时卡片（本级别+大级别 · '+total+'条）</div>'+
      (show.length?show.map(x=>cardEl(x.m).outerHTML).join(''):'<div class="none">暂无卡片——没消息就是好消息</div>')+
      (total>3?'<div class="more" onclick="toggleExp(\''+p.id+'\')">'+(EXP[p.id]?'▲ 收起':'▼ 展开全部 '+total+' 条')+'</div>':'')+
      '</div></div>'+
    '<div class="foot"><div class="rule"><b>出场只认两条：</b>本级别二卖确认→平（可留底仓）｜三卖→无条件全平。<b>其余一切=噪音</b>，灯替你盯着。</div>'+
      '<button onclick="posEdit(\''+p.id+'\')">编辑</button>'+
      '<button class="close" onclick="askClose(\''+p.id+'\')">平仓</button></div>';
  return div;
}

/* ---------- 平仓：阻尼（软熔断）→ 交易简报 → 删除 ---------- */
function askClose(id){
  const p=POSITIONS.find(x=>x.id===id);if(!p)return;
  const a=analyze(p);
  if(a.light==='red'){
    if(confirm('✅ 体系同意平仓：'+a.lightTxt+'\n确认进入平仓简报？'))posDel(id);
    return;
  }
  $('dampT').textContent='⚠ 体系判定：现在卖出违反你的出场规则';
  $('dampB').innerHTML='当前状态：<b>'+(a.light==='green'?'🟢 持有':'🟡 观察')+'</b> —— '+a.lightTxt+
    '<br>你的规则只有两条：<b>本级别二卖确认→平；三卖→全平</b>。其他一切都不构成卖出理由。'+
    '<br>历史上你亏的不是拿久了，是<b>卖早了</b>。';
  $('dampGo').textContent='仍然平仓（我接受）';
  $('dampGo').onclick=()=>{dampClose();posDel(id);};
  $('damp').style.display='flex';
}
function dampClose(){$('damp').style.display='none';}
function posDel(id){
  const rec=POSITIONS.find(x=>x.id===id);if(!rec)return;
  const now=new Date();
  const opened=rec.open_iso?new Date(rec.open_iso):now;
  const hold=Math.max(0,Math.round((now-opened)/60000));
  const hm=hold>=60?Math.floor(hold/60)+'小时'+hold%60+'分':hold+'分钟';
  $('pcInfo').innerHTML='<b style="color:#d1d4dc">'+rec.name+'（'+rec.symbol+'）</b> '+(P_LAB[rec.period]||rec.period)+'<br>'+
    '进场 <b style="color:#d1d4dc">'+posLabel(rec.entry)+'</b> → 离场 <b style="color:#d1d4dc">'+posLabel(rec.exit)+'</b><br>'+
    '开仓 '+rec.open_time+' '+rec.weekday+' · 持仓 <b style="color:#e8d44d">'+hm+'</b><br>'+
    '<span style="font-size:11px;">简报全部选填，直接确认就是平仓删除</span>';
  $('pcDelId').value=id;
  document.querySelectorAll('#pcResults button').forEach(x=>x.classList.remove('sel'));
  $('pcPnl').value='';
  $('pcModal').style.display='flex';
}
async function posDelConfirm(){
  const id=$('pcDelId').value;
  const selB=document.querySelector('#pcResults button.sel');
  try{
    const r=await fetch('/api/positions/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id,close_result:selB?selB.dataset.v:'',close_pnl:$('pcPnl').value.trim()})});
    const d=await r.json();
    if(d.error){alert(d.error);return;}
    POSITIONS=d.positions||[];render();
  }catch(e){alert('平仓失败：'+e);}
  $('pcModal').style.display='none';
}
function pcSel(b){
  document.querySelectorAll('#pcResults button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
}

/* ---------- 编辑持仓 ---------- */
function posEdit(id){posFormOpen(id);}
function posFormOpen(editId){
  posEditId=editId||null;
  const sel=$('pfSymbol');
  if(CONTRACTS.length)sel.innerHTML=CONTRACTS.map(c=>'<option value="'+c.symbol+'">'+c.name+' '+c.symbol+'</option>').join('');
  const rec=editId?POSITIONS.find(x=>x.id===editId):null;
  if(rec){
    sel.value=rec.symbol;
    $('pfPeriod').value=rec.period;
    $('pfEntry').value=rec.entry;
    $('pfExit').value=rec.exit;
    $('pfPrice').value=rec.price||'';
    $('pfNote').value=rec.note||'';
    $('pfSubmit').textContent='保存修改';
  }
  $('pfModal').style.display='flex';
}
function posFormClose(){$('pfModal').style.display='none';posEditId=null;}
function pfDeriveExit(){$('pfExit').value=POS_EXIT[$('pfEntry').value]||'';}
async function posSubmit(){
  if(!posEditId)return;
  const body={id:posEditId,period:$('pfPeriod').value,entry:$('pfEntry').value,exit:$('pfExit').value,
    note:$('pfNote').value.trim()};
  const pv=parseFloat($('pfPrice').value);
  if(pv>0)body.price=pv;
  try{
    const r=await fetch('/api/positions/update',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const d=await r.json();
    if(d.error){alert(d.error);return;}
    POSITIONS=d.positions||[];render();
  }catch(e){alert('保存失败：'+e);}
  posFormClose();
}
/* 进场价快捷录入（卡面） */
async function savePrice(id){
  const v=parseFloat($('ep_'+id).value);
  if(!v||v<=0){alert('请输入有效的价格');return;}
  try{
    const r=await fetch('/api/positions/update',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id,price:v})});
    const d=await r.json();
    if(d.error){alert(d.error);return;}
    POSITIONS=d.positions||[];render();
  }catch(e){alert('保存失败：'+e);}
}

/* ---------- 升级推送：级别状态推进（观察→候选→确认/触发）时本地插一张升级卡 ---------- */
function onCell(c){
  if(!c||!c.symbol)return;
  const k=c.symbol+'|'+c.period, prev=CELLS[k];
  if(prev){
    const pr=UP_RANK[prev.state]??0, nr=UP_RANK[c.state]??0;
    if(nr>pr){
      UPCARDS.push({_up:1,symbol:c.symbol,name:c.name,period:c.period,from:prev.state,to:c.state,side:c.side,_ts:Date.now()});
      if(UPCARDS.length>60)UPCARDS=UPCARDS.slice(-60);
    }
  }
  CELLS[k]=c;
}
function toggleExp(id){EXP[id]=!EXP[id];render();}

/* ---------- 提醒：红灯翻转响铃+闪标题 ---------- */
function beep(){
  try{
    const ctx=window.__audio||(window.__audio=new (window.AudioContext||window.webkitAudioContext)());
    [[0,880],[0.18,1140]].forEach(([dt,fr])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=fr;o.type='sine';g.gain.value=.22;
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+dt);o.stop(ctx.currentTime+dt+.16);
    });
  }catch(e){}
}
let _titleTimer=null,_baseTitle=document.title;
function flashTitle(txt){
  if(_titleTimer)clearInterval(_titleTimer);
  let on=true;_titleTimer=setInterval(()=>{document.title=(on?'🔴 '+txt:_baseTitle);on=!on;},700);
  setTimeout(()=>{clearInterval(_titleTimer);document.title=_baseTitle;_titleTimer=null;},10000);
}

/* ---------- 数据 ---------- */
async function loadPositions(){
  try{const r=await fetch('/api/positions');const d=await r.json();POSITIONS=d.positions||[];render();}catch(e){}
}
async function loadQuotes(){
  try{
    const r=await fetch('/api/quotes');const d=await r.json();
    POSITIONS.forEach(p=>{if(d[p.symbol])QUOTES[p.symbol]=d[p.symbol];});
    render();
  }catch(e){}
}
async function loadSL(){
  try{
    POSITIONS.forEach(async p=>{
      const r=await fetch('/api/sl_line?sym='+encodeURIComponent(p.symbol));
      const d=await r.json();SL[p.symbol]=d.price;render();
    });
  }catch(e){}
}
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/ws?role=pc');
  ws.onopen=()=>{$('dot').classList.add('on');$('connTx').textContent='已连接';};
  ws.onclose=()=>{$('dot').classList.remove('on');$('connTx').textContent='断线重连中…';setTimeout(connect,3000);};
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(m.type==='pattern_state'){onCell(m.cell);render();}
    else if(m.type==='pattern_alert'||m.type==='pattern_alert_update'){upsertEvent(m);render();}
  };
}
(async function(){
  try{
    const r=await fetch('/api/pattern_matrix');
    const d=await r.json();
    CONTRACTS=d.contracts||[];
    (d.cells||[]).forEach(c=>{CELLS[c.symbol+'|'+c.period]=c;});
    (d.events||[]).forEach(upsertEvent);
  }catch(e){}
  await loadPositions();
  loadQuotes();loadSL();
  connect();
  setInterval(loadQuotes,10000);      // 现价 10s
  setInterval(loadPositions,30000);   // 持仓 30s
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadPositions();loadQuotes();}});
})();
</script>
