<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品种详情</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  body{background:#131722;color:#d1d4dc;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .red{color:#ef5350;} .green{color:#26a69a;} .gold{color:#f0b90b;} .mut{color:#787b86;}
  header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;background:#1e222d;border-bottom:1px solid #2a2e39;flex:none;}
  header a{color:#f0b90b;text-decoration:none;font-size:14px;flex:none;white-space:nowrap;}
  .head-group{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-width:0;}
  .head-group.left{flex:0 0 auto;align-items:center;gap:8px;}
  .head-group.left > a{flex:none;width:76px;font-size:14px;white-space:nowrap;}
  .head-group.mid{flex:1 1 0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:#f0b90b;min-width:0;}
  .head-group.mid b{color:#d1d4dc;font-weight:700;}
  .head-group.right{flex:0 0 auto;margin-left:auto;justify-content:flex-end;gap:6px 8px;}
  .name-block{flex:none;width:220px;line-height:1.15;}
  .name-block .nm{display:flex;align-items:baseline;gap:8px;font-size:19px;font-weight:800;white-space:nowrap;}
  .name-block .upd{font-size:12px;color:#787b86;font-weight:400;}
  .name-block .cd{font-size:12px;color:#787b86;margin-top:1px;white-space:nowrap;}
  .period-area{display:flex;align-items:center;gap:8px;flex:none;}
  .price{flex:none;min-width:90px;text-align:right;white-space:nowrap;}
  .price .p{font-size:24px;font-weight:800;line-height:1;}
  #tradeStatus{flex:none;font-size:12px;white-space:nowrap;}
  .icon-btn{width:40px;min-width:40px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px;}
  #rollbackBtn{font-weight:700;}
  /* 极窄屏再压缩，默认MacBook一行能放下 */
  @media (max-width:1150px){
    .name-block{width:200px;}
    .name-block .nm{font-size:17px;}
    .price .p{font-size:21px;}
    .seg button{padding:6px 9px;font-size:12px;}
    .navbtns button{padding:5px 8px;font-size:12px;}
    .head-group.mid{font-size:12px;gap:6px 12px;}
    .icon-btn{width:36px;min-width:36px;font-size:16px;}
  }
  @media (max-width:980px){
    .head-group.mid{order:99;flex-basis:100%;border-top:1px solid #2a2e39;padding-top:8px;justify-content:flex-start;}
  }
  /* 右侧信息栏显隐 */
  .side.hidden{display:none!important;}
  .btn{border:1px solid #2a2e39;background:#2a2e39;color:#d1d4dc;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;flex:none;}
  .btn:hover{filter:brightness(1.2);}
  .seg{display:flex;border:1px solid #2a2e39;border-radius:8px;overflow:hidden;}
  .seg button{background:#1e222d;color:#787b86;border:none;padding:7px 11px;font-size:12.5px;cursor:pointer;}
  .seg button.on{background:#2c3140;color:#f0b90b;font-weight:700;}
  .navbtns{display:flex;gap:5px;}
  .navbtns button{padding:5px 10px;font-size:14px;}
  main{flex:1;display:flex;gap:14px;padding:14px 20px;overflow:hidden;}
  #chartbox{flex:1;min-width:0;background:#131722;border:1px solid #2a2e39;border-radius:12px;position:relative;}
  #chartbox.measuring{cursor:crosshair;}
  .side{width:300px;flex:none;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .card{background:#1e222d;border:1px solid #2a2e39;border-radius:12px;padding:14px 16px;}
  .card .t{font-size:12px;color:#787b86;margin-bottom:10px;}
  .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .row b{font-weight:700;}
  .sigs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .sig{border-radius:10px;padding:9px 11px;font-size:12.5px;border-left:3px solid;flex:none;}
  .sig.buy{background:rgba(239,83,80,.12);border-color:#ef5350;}
  .sig.sell{background:rgba(38,166,154,.12);border-color:#26a69a;}
  .chatbox{flex:none;display:flex;gap:7px;}
  .chatbox input{flex:1;min-width:0;background:#2a2e39;border:1px solid #2a2e39;border-radius:8px;color:#d1d4dc;padding:8px 11px;font-size:13px;outline:none;}
  .chatbox input:focus{border-color:#f0b90b;}
  .chatbox button{flex:none;background:#f0b90b;border:none;color:#1a1a1a;font-weight:700;border-radius:8px;padding:8px 13px;cursor:pointer;}
  /* 止损计算器 */
  .calc-field{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .calc-field label{width:52px;font-size:12px;color:#787b86;flex:none;}
  .calc-field input[type=number]{flex:1;min-width:0;background:#131722;border:1px solid #2a2e39;border-radius:6px;color:#d1d4dc;padding:6px 9px;font-size:13px;outline:none;width:100%;}
  .calc-field input[type=number]:focus{border-color:#f0b90b;}
  .calc-field .unit{font-size:12px;color:#787b86;flex:none;width:20px;}
  .calc-field .seg{flex:1;}
  .calc-field .seg button{padding:6px 4px;font-size:11.5px;flex:1;}
  #calcBtn{width:100%;margin:4px 0 10px;padding:9px;font-weight:700;}
  #calcBtn.active{background:#ef5350;border-color:#ef5350;color:#fff;}
  .calc-result{border-top:1px solid #2a2e39;padding-top:8px;}
  .calc-result .row{padding:4px 0;font-size:13px;}
  .calc-hint{font-size:11px;color:#5a5d6a;margin-top:6px;line-height:1.5;}
  ::-webkit-scrollbar{width:7px;} ::-webkit-scrollbar-thumb{background:#2a2e39;border-radius:4px;}
  /* 右键菜单 */
  #ctxMenu{position:absolute;z-index:9999;background:#1e222d;border:1px solid #2a2e39;border-radius:8px;padding:4px;display:none;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,.5);}
  #ctxMenu .item{padding:8px 14px;cursor:pointer;border-radius:6px;font-size:13px;color:#d1d4dc;}
  #ctxMenu .item:hover{background:#2a2e39;}
  #ctxMenu .item.up{color:#ef5350;}
  #ctxMenu .item.down{color:#26a69a;}
  #ctxMenu .sep{height:1px;background:#2a2e39;margin:4px 0;}
  /* 预警弹窗 */
  .alert-popup{position:fixed;top:20px;right:20px;z-index:10000;background:#1e222d;border:2px solid #ef5350;border-radius:12px;padding:16px 20px;min-width:280px;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:slideIn .3s ease;}
  .alert-popup.down{border-color:#26a69a;}
  .alert-popup .title{font-size:16px;font-weight:700;margin-bottom:6px;}
  .alert-popup .title.up{color:#ef5350;}
  .alert-popup .title.down{color:#26a69a;}
  .alert-popup .info{font-size:13px;color:#787b86;}
  .alert-popup .close{position:absolute;top:8px;right:12px;cursor:pointer;color:#787b86;font-size:18px;}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  /* 自定义确认弹窗 */
  .confirm-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  .confirm-box{background:#1e222d;border:1px solid #2a2e39;border-radius:14px;padding:24px 28px;min-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .2s ease;}
  @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .confirm-box h3{font-size:16px;font-weight:700;color:#d1d4dc;margin-bottom:10px;}
  .confirm-box p{font-size:13px;color:#787b86;margin-bottom:20px;line-height:1.6;}
  .confirm-box .btns{display:flex;gap:10px;justify-content:flex-end;}
  .confirm-box .btn{padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-weight:600;transition:all .15s;}
  .confirm-box .btn.cancel{background:#2a2e39;color:#787b86;}
  .confirm-box .btn.cancel:hover{background:#363b47;color:#d1d4dc;}
  .confirm-box .btn.danger{background:#ef5350;color:#fff;}
  .confirm-box .btn.danger:hover{background:#f44336;transform:translateY(-1px);}
</style>
</head>
<body>
<header>
  <div class="head-group left">
    <a href="/pc">‹ 返回总览</a>
    <div class="name-block">
      <div class="nm"><span id="nm">加载中</span><span class="upd" id="nameUpd"></span></div>
      <div class="cd" id="cd"></div>
    </div>
    <div class="period-area">
      <div class="seg" id="periodSeg">
        <button data-p="30">30秒</button>
        <button data-p="1">1分</button>
        <button data-p="3">3分</button>
        <button data-p="15">15分</button>
        <button data-p="60">60分</button>
        <button data-p="daily">日线</button>
      </div>
      <div class="navbtns">
        <button class="btn" onclick="prevContract()" title="上一个合约">↑</button>
        <button class="btn" onclick="nextContract()" title="下一个合约">↓</button>
      </div>
    </div>
  </div>
  <div class="head-group mid" id="hmid"></div>
  <div class="head-group right">
    <div class="price"><div class="p" id="p">–</div><div id="chg" class="mut"></div></div>
    <span id="tradeStatus" class="mut"></span>
    <button class="btn icon-btn" onclick="loadPeriod(currentPeriod)" title="刷新" style="font-size: 18px;">⟳</button>
    <button class="btn icon-btn" id="rollbackBtn" onclick="toggleRollback()" title="笔破坏回退开关">回</button>
  </div>
</header>
<main>
  <div id="chartbox"></div>
  <div id="ctxMenu">
    <div class="item" onclick="startAddAlert()">＋ 添加价格预警</div>
    <div class="sep"></div>
    <div class="item" id="ctxToggleSide" onclick="toggleSidePanel()">隐藏右侧信息栏</div>
    <div class="sep"></div>
    <div class="item" onclick="hideCtxMenu()">取消</div>
  </div>
  <!-- 自定义确认弹窗 -->
  <div id="confirmMask" class="confirm-mask" style="display:none">
    <div class="confirm-box">
      <h3 id="confirmTitle">删除预警</h3>
      <p id="confirmMsg">确定删除这条预警线吗？</p>
      <div class="btns">
        <button class="btn cancel" onclick="closeConfirm()">取消</button>
        <button class="btn danger" id="confirmOkBtn">删除</button>
      </div>
    </div>
  </div>
  <div class="side" id="sidePanel">
    <!-- 止损计算器 -->
    <div class="card">
      <div class="t">止损计算器 · 拖拽测量</div>
      <div class="calc-field">
        <label>总资金</label>
        <input id="calcCapital" type="number" value="1000000" min="0">
        <span class="unit">元</span>
      </div>
      <div class="calc-field">
        <label>止损比</label>
        <div class="seg" id="riskSeg">
          <button data-p="0.01">1%</button>
          <button data-p="0.015">1.5%</button>
          <button data-p="0.02" class="on">2%</button>
          <button data-p="0.03">3%</button>
          <button data-p="0.05">5%</button>
        </div>
      </div>
      <div class="calc-field">
        <label>固定手数</label>
        <input id="calcLots" type="number" placeholder="留空自动" min="0" step="1">
        <span class="unit">手</span>
      </div>
      <button class="btn" id="calcBtn" onclick="toggleMeasure()">📐 开始测量</button>
      <div class="calc-result" id="calcResult" style="display:none;">
        <div class="row"><span class="mut">入场价</span><b id="crEntry">–</b></div>
        <div class="row"><span class="mut">止损价</span><b id="crStop">–</b></div>
        <div class="row"><span class="mut">点数</span><b id="crPts">–</b></div>
        <div class="row"><span class="mut">每点价值</span><b id="crTick">–</b></div>
        <div class="row"><span class="mut">建议手数</span><b class="gold" id="crLots">–</b></div>
        <div class="row"><span class="mut">止损金额</span><b id="crMoney">–</b></div>
        <div class="row"><span class="mut">占总资金</span><b id="crPct">–</b></div>
      </div>
      <div class="calc-hint">在K线图上按住鼠标拖动测量止损区间；再点一下图上空白处清除；手数留空则按止损比例自动倒推。</div>
    </div>
    <!-- 买卖点历史 -->
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column;">
      <div class="t">买卖点历史</div>
      <div class="sigs" id="sigs"></div>
      <div class="chatbox" style="margin-top:10px;">
        <input id="chat" placeholder="给手机端留言…" maxlength="80">
        <button onclick="sendChat()">发送</button>
      </div>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const SYM=params.get('sym')||'MA2610';
const PERIOD_LABEL={'30':'30秒','1':'1分','3':'3分','15':'15分','60':'60分','daily':'日线'};
let _savedPeriod=null; try{_savedPeriod=localStorage.getItem('cl_chart_period');}catch(e){}
let currentPeriod=params.get('period')||_savedPeriod||'15';
if(!PERIOD_LABEL[currentPeriod]) currentPeriod='15';

let chart,candle,vol,bi;
let refreshTimer=null;
let ws;
const proto=location.protocol==='https:'?'wss':'ws';

// ===== 前端K线缓存：切换级别时先显示缓存，新数据加载后再更新 =====
const _klineCache={};  // {period: data}
let _cacheLoading={};  // {period: true}

// ===== 交易时段控制 =====
const TRADE_SESSIONS=[[8,55,11,35],[13,25,15,5],[20,55,23,59],[0,0,2,35]];
let _tradingDay=null;
function inTradingSession(){
  const n=new Date(); const m=n.getHours()*60+n.getMinutes();
  return TRADE_SESSIONS.some(([sh,sm,eh,em])=> m>=sh*60+sm && m<=eh*60+em);
}
async function checkTradingStatus(){
  try{
    const r=await fetch('/api/trading_status');
    const s=await r.json();
    _tradingDay=s.trading_day;
    const el=$('tradeStatus');
    if(el){
      if(s.trading){ el.textContent='● 交易中'; el.style.color='#26a69a'; }
      else{ el.textContent='○ '+s.reason; el.style.color='#787b86'; }
    }
  }catch(e){ _tradingDay=true; }
}
function canAutoRefresh(){
  if(_tradingDay===null){
    try{
      const c=JSON.parse(sessionStorage.getItem('cl_trading_day')||'null');
      if(c&&c.date===new Date().toDateString()) _tradingDay=c.val;
    }catch(e){}
  }
  if(_tradingDay===false) return false;
  return inTradingSession();
}

// ===== 合约上下切换 =====
let contractList=[], contractIdx=-1;
async function loadContracts(){
  try{
    const r=await fetch('/api/contracts');
    const s=await r.json();
    contractList=s.contracts||[];
    // 按用户自定义排序（拖动排序结果存localStorage）
    try{
      const order=JSON.parse(localStorage.getItem('cl_symbol_order')||'[]');
      if(order&&order.length){
        contractList.sort((a,b)=>{
          const ia=order.indexOf(a.symbol), ib=order.indexOf(b.symbol);
          if(ia===-1&&ib===-1) return 0;
          if(ia===-1) return 1;
          if(ib===-1) return -1;
          return ia-ib;
        });
      }
    }catch(e){}
    contractIdx=contractList.findIndex(c=>c.symbol===SYM);
  }catch(e){}
}
function gotoContract(idx){
  if(!contractList.length) return;
  const i=((idx%contractList.length)+contractList.length)%contractList.length;
  const c=contractList[i];
  location.href='/pc/detail?sym='+encodeURIComponent(c.symbol)+'&period='+currentPeriod;
}
function prevContract(){ gotoContract(contractIdx-1); }
function nextContract(){ gotoContract(contractIdx+1); }

// ===== 图表视图状态持久化 =====
const VIEW_KEY='cl_chart_view';
let _saveT=null;
function saveView(){
  try{
    const bs=chart.timeScale().options().barSpacing;
    if(isFinite(bs)&&bs>0) localStorage.setItem(VIEW_KEY,JSON.stringify({barSpacing:bs}));
  }catch(e){}
}
function saveViewSoon(){ if(_saveT)return; _saveT=setTimeout(()=>{_saveT=null;saveView();},300); }
function applyView(){
  let raw=null; try{raw=localStorage.getItem(VIEW_KEY);}catch(e){}
  let barSpacing=null;
  if(raw){
    try{
      const r=JSON.parse(raw);
      if(r&&isFinite(r.barSpacing)&&r.barSpacing>0){ barSpacing=r.barSpacing; }
    }catch(e){}
  }
  // 直接用 applyOptions 设置位置，不用 scrollToRealTime/fitContent（避免过场动画）
  if(barSpacing){
    chart.timeScale().applyOptions({barSpacing:barSpacing,rightOffset:3});
  }else{
    chart.timeScale().applyOptions({rightOffset:3});
  }
}

function initChart(){
  const el=$('chartbox');
  chart=LightweightCharts.createChart(el,{
    layout:{background:{type:'solid',color:'#131722'},textColor:'#787b86',fontSize:11},
    grid:{vertLines:{visible:false},horzLines:{color:'rgba(42,46,57,.5)'}},
    crosshair:{mode:0},
    rightPriceScale:{borderColor:'rgba(197,203,206,.15)'},
    timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false}});
  candle=chart.addCandlestickSeries({upColor:'#ef5350',downColor:'#26a69a',
    borderUpColor:'#ef5350',borderDownColor:'#26a69a',wickUpColor:'#ef5350',wickDownColor:'#26a69a'});
  vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',
    lastValueVisible:false,priceLineVisible:false});
  vol.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
  bi=chart.addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
  chart.timeScale().subscribeVisibleLogicalRangeChange(saveViewSoon);
}

function fmt(ts){const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

// lightweight-charts把时间戳当UTC显示，加8小时转成北京时间
const TZ_OFFSET=28800;
function fixTime(data){return data.map(x=>({...x,time:x.time+TZ_OFFSET}));}


// 把UTC时间戳转成本地时间对象，避免lightweight-charts时区问题
function tsToObj(ts){const d=new Date(ts*1000);return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),hour:d.getHours(),minute:d.getMinutes()};}
function toLocalTime(data){return data.map(x=>({...x,time:tsToObj(x.time)}));}


// 只拉统计/手续费/信号历史，不碰K线图
async function loadStats(){
  try{
    const r=await fetch('/api/detail?sym='+encodeURIComponent(SYM));
    const s=await r.json();
    const f=s.fee||{};
    $('hmid').innerHTML=
      `<span>保证金 <b>${s.margin_per_lot??'–'}</b> 元</span>`+
      `<span>开 <b>${f.open_cost??'–'}</b></span>`+
      `<span>平 <b>${f.close_cost??'–'}</b></span>`+
      `<span>乘数 <b>${f.multiplier??'–'}</b></span>`;
    // 保存乘数和最小跳动给止损计算器用
    calc.multiplier = (f.multiplier!=null && !isNaN(f.multiplier)) ? Number(f.multiplier) : 10;
    calc.tick = (f.min_tick!=null && !isNaN(f.min_tick) && Number(f.min_tick)>0) ? Number(f.min_tick) : 1;
    let h='';
    (s.signals||[]).slice().reverse().slice(0,40).forEach(x=>{
      h+=`<div class="sig ${x.side}">${x.side==='buy'?'▲ 买':'▼ 平'} @ <b>${x.price}</b>
           <span class="mut" style="float:right">${fmt(x.time)}</span>
           <div class="mut" style="margin-top:3px;font-size:11px">${x.reason||''}</div></div>`;
    });
    $('sigs').innerHTML=h||'<span class="mut">暂无</span>';
  }catch(e){}
}

function switchPeriod(p){
  if(!PERIOD_LABEL[p]) return;
  currentPeriod=p;
  try{localStorage.setItem('cl_chart_period',p);}catch(e){}
  document.querySelectorAll('#periodSeg button').forEach(b=> b.classList.toggle('on', b.dataset.p===p));
  loadPeriod(p);
}

let _rollback=true;
try{ _rollback=localStorage.getItem('cl_bi_rollback')!=='0'; }catch(e){}

// 右侧信息栏显隐状态（跨会话记忆）
let sideVisible=true;
try{ sideVisible=localStorage.getItem('cl_detail_side_hidden')!=='1'; }catch(e){}
function updateSidePanel(visible){
  const side=$('sidePanel');
  if(!side) return;
  side.classList.toggle('hidden', !visible);
  sideVisible=visible;
  try{ localStorage.setItem('cl_detail_side_hidden', visible?'0':'1'); }catch(e){}
  // 面板隐藏/显示后重设图表尺寸，ResizeObserver会接管后续变化
  if(chart) chart.applyOptions({width:$('chartbox').clientWidth,height:$('chartbox').clientHeight});
}
function toggleSidePanel(){ updateSidePanel(!sideVisible); hideCtxMenu(); }

async function loadPeriod(period, isRefresh, onlyBi){
  try{
    // 定时刷新时保存当前视图位置，setData后恢复（不跳到最新）
    let savedRange=null;
    if(isRefresh){
      try{ savedRange=chart.timeScale().getVisibleRange(); }catch(e){}
    }
    if(onlyBi){
      const rb=_rollback?'1':'0';
      const r=await fetch('/api/live?sym='+encodeURIComponent(SYM)+'&period='+period+'&rollback='+rb);
      const s=await r.json();
      if(s.error) return;
      bi.setData(fixTime(s.bi||[]));
      candle.setMarkers(fixTime(s.markers||[]));
      const label=PERIOD_LABEL[period]||period;
      const ts=new Date().toTimeString().slice(0,8);
      $('nameUpd').textContent='更新 '+ts;
      $('cd').textContent=s.symbol+' · '+label+' · '+s.bar_count+'根/'+s.bi_count+'笔';
      return;
    }
    // ===== 缓存优先：切换级别时先显示缓存数据，避免空白卡顿 =====
    const cached=_klineCache[period];
    if(cached && !isRefresh){
      // 先显示缓存
      renderKlineData(cached, period, false);
      // 如果正在加载中，不重复请求
      if(_cacheLoading[period]) return;
    }
    _cacheLoading[period]=true;
    const rb=_rollback?'1':'0';
    const r=await fetch('/api/live?sym='+encodeURIComponent(SYM)+'&period='+period+'&rollback='+rb);
    const s=await r.json();
    _cacheLoading[period]=false;
    if(s.error){ $('cd').textContent=SYM+' · 出错: '+s.error; return; }
    // 存入缓存
    _klineCache[period]=s;
    // 渲染新数据（如果当前显示的就是这个级别）
    if(currentPeriod===period){
      renderKlineData(s, period, isRefresh, savedRange);
    }
  }catch(e){ _cacheLoading[period]=false; }
}

function renderKlineData(s, period, isRefresh, savedRange){
  const label=PERIOD_LABEL[period]||period;
  const ts=new Date().toTimeString().slice(0,8);
  $('nm').textContent=s.name;
  $('nameUpd').textContent='更新 '+ts;
  $('cd').textContent=s.symbol+' · '+label+' · '+s.bar_count+'根/'+s.bi_count+'笔';
  $('p').textContent=s.last_price;
  const up=s.change>=0;
  $('chg').innerHTML=`<span class="${up?'red':'green'}">${up?'▲':'▼'} ${Math.abs(s.change)} (${s.change_pct}%)</span>`;
  candle.setData(fixTime(s.kline));
  vol.setData(fixTime(s.vol||[]));
  bi.setData(fixTime(s.bi||[]));
  candle.setMarkers(fixTime(s.markers||[]));
  if(isRefresh && savedRange){
    try{ chart.timeScale().setVisibleRange(savedRange); }catch(e){ applyView(); }
  }else{
    applyView();
  }
}

function snapPrice(price){
  // 吸附到最小变动价位的整数倍
  const t=calc.tick||1;
  if(!isFinite(t)||t<=0) return price;
  const snapped=Math.round(price/t)*t;
  const decimals=(t.toString().split('.')[1]||'').length;
  return Number(snapped.toFixed(decimals));
}

  if(p===undefined||isNaN(p)) return undefined;
  return snapPrice(p);
}

function updateCalc(entry, stop){
  const pts=Math.abs(entry-stop);
  const tickValue=calc.multiplier;
  const perLot=pts*tickValue;
  const cap=calc.capital||0;
  const maxLoss=cap*calc.riskPct;
  let lots, autoMode=(calc.fixedLots==null);
  if(autoMode){
    // 自动倒推：向下取整，但最小锁死1手（超上限时变红警告）
    lots=perLot>0?Math.floor(maxLoss/perLot):1;
    if(lots<1) lots=1;
  }else{
    lots=calc.fixedLots;
  }
  const loss=lots*perLot;
  const pct=cap>0?(loss/cap*100):0;
  const over=pct>calc.riskPct*100+0.001;

  $('crStop').textContent=stop.toFixed(1);
  $('crPts').textContent=pts.toFixed(1);
  $('crTick').textContent=tickValue+' 元';
  $('crLots').textContent=lots+' 手'+(autoMode?(over?' (最小1手·超上限)':''):' (固定)');
  $('crLots').className=over?'red':'gold';
  $('crMoney').textContent=loss.toFixed(0)+' 元';
  $('crMoney').className=over?'red':'green';
  $('crPct').textContent=pct.toFixed(2)+'%'+(over?' ⚠超上限':'');
  $('crPct').className=over?'red':'green';

  if(calc.stopLine){
    calc.stopLine.applyOptions({
      title:(over?'⚠ ':'')+loss.toFixed(0)+'元/'+lots+'手/'+pts.toFixed(1)+'点'
    });
  }
}

function confirmAddAlert(price){

  if(!price || isNaN(price)) return;
  const finalPrice=Math.round(price*100)/100;
  // 获取当前最新价格，自动判断方向

  const direction = curPrice <= price ? 'up' : 'down';
  const color=direction==='up'?'#ef5350':'#26a69a';
  // 先把临时线改成正式预警线样式（不消失，直接变色）
  tempLine.applyOptions({
    price:finalPrice,color:color,lineWidth:2,lineStyle:2,
    axisLabelVisible:true,title:(direction==='up'?'上穿':'下穿')+' '+finalPrice
  });
  const line=tempLine;
  tempLine=null;
  addingAlert=false;
  const el=document.getElementById('chartbox');
  el.style.cursor='';
  chart.applyOptions({crosshair:{mode:_origCrosshairMode}});

  fetch('/api/alerts?symbol='+encodeURIComponent(SYM)+'&name='+encodeURIComponent(SYM_NAME)+'&price='+finalPrice+'&direction='+direction,{method:'POST'})
    .then(r=>r.json())

        try{candle.removePriceLine(line);}catch(e){}
      }
    })
    .catch(e=>{

  if(mobileOnline) return;
  const isUp=alert.direction==='up';

  div.className='alert-popup '+(isUp?'up':'down');
  div.innerHTML='<span class="close" onclick="this.parentElement.remove()">×</span>'+
    '<div class="title '+(isUp?'up':'down')+'">'+(isUp?'▲ 涨破预警':'▼ 跌破预警')+'</div>'+

function playAlertSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.15,0.3].forEach((dt,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880+i*220;o.type='square';
      const t0=ctx.currentTime+dt;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.2,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+0.12);
      o.start(t0);o.stop(t0+0.13);
    });
  }catch(e){}
}

let draggingAlert=null;
let dragOffset=0;

function priceAtY(y){
  try{ return candle.coordinateToPrice(y); }catch(e){ return null; }
}

function findAlertNear(y){
  for(const id in alertLines){
    try{
      const line=alertLines[id];
      const lp=line.options().price;
      const ly=candle.priceToCoordinate(lp);
      if(ly!==null && Math.abs(ly-y)<=15){
        return {id:id, line:line, price:lp, y:ly};
      }
    }catch(e){}
  }
  return null;
}

// 用事件委托方式，在document上监听，确保不会被canvas拦截
document.addEventListener('mousedown', function(e){
  if(addingAlert || e.button!==0) return;
  const chartEl=document.getElementById('chartbox');
  if(!chartEl) return;
  const rect=chartEl.getBoundingClientRect();
  if(e.clientX<rect.left || e.clientX>rect.right || e.clientY<rect.top || e.clientY>rect.bottom) return;
  const y=e.clientY-rect.top;
  const found=findAlertNear(y);
  if(found){
    draggingAlert=found;
    const curPrice=priceAtY(y);
    dragOffset = (curPrice!==null) ? (found.price-curPrice) : 0;
    e.preventDefault();
    e.stopPropagation();
    chartEl.style.cursor='ns-resize';
  }
}, true);

document.addEventListener('mousemove', function(e){
  if(!draggingAlert) return;
  const chartEl=document.getElementById('chartbox');
  if(!chartEl) return;
  const rect=chartEl.getBoundingClientRect();
  const y=e.clientY-rect.top;
  const price=priceAtY(y);
  if(price===null) return;
  const newPrice=Math.round((price+dragOffset)*100)/100;
  const kdata=candle.data();
  const curPrice = kdata.length>0 ? kdata[kdata.length-1].close : newPrice;
  const dir = curPrice<=newPrice ? 'up' : 'down';
  const color = dir==='up' ? '#ef5350' : '#26a69a';
  try{ draggingAlert.line.applyOptions({price:newPrice, color:color, title:(dir==='up'?'上穿':'下穿')+' '+newPrice}); }catch(err){}
}, true);

document.addEventListener('mouseup', function(){
  if(!draggingAlert) return;
  const chartEl=document.getElementById('chartbox');
  if(chartEl) chartEl.style.cursor='';
  let newPrice=null;
  try{ newPrice=draggingAlert.line.options().price; }catch(err){}
  const id=draggingAlert.id;
  draggingAlert=null;
  if(newPrice!==null){
    const kdata=candle.data();
    const curPrice = kdata.length>0 ? kdata[kdata.length-1].close : newPrice;
    const dir = curPrice<=newPrice ? 'up' : 'down';

      .then(r=>r.json())
      .then(j=>{})
      .catch(e=>console.error('[预警] 更新失败', e));
  }
});

  document.getElementById('confirmMask').style.display='none';
  _confirmCallback=null;
}
document.getElementById('confirmOkBtn').onclick=()=>{
  const cb=_confirmCallback;
  closeConfirm();
  if(cb)cb();
};
document.getElementById('confirmMask').addEventListener('click', e=>{
  if(e.target.id==='confirmMask')closeConfirm();
});
</script>
</body>
</html>
