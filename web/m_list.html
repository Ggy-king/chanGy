<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1219">
<title>缠论预警 · 手机</title>
<style>
  :root{
    --app:#0E1219; --card:#161C26; --card2:#1A212D;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.04);
    --t1:#E9EEF5; --t2:#8B95A7; --t3:#5C6675;
    --long:#FF5C5C; --short:#2DD4A8; --gold:#F5B83D;
    --mono:"SF Mono","Roboto Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--app);color:var(--t1);font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;}
  #app{margin:0 auto;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;
       position:relative;overflow:hidden;background:var(--app);}

  /* ===== 顶部（各视图自带头部） ===== */
  .app-header{flex-shrink:0;padding:calc(8px + env(safe-area-inset-top)) 18px 12px;}
  .h-row1{display:flex;align-items:center;justify-content:space-between;}
  .h-title{font-size:22px;font-weight:700;letter-spacing:.5px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;flex-shrink:0;}
  .icon-btn:active{filter:brightness(1.4);}
  .ph-l{display:flex;align-items:baseline;gap:10px;}
  .ph-count{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--gold);
    background:rgba(245,184,61,.12);border:1px solid rgba(245,184,61,.25);padding:3px 10px;border-radius:9px;}
  .btn-add{height:38px;padding:0 18px;border-radius:19px;background:var(--gold);color:#241A05;
    font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;border:none;cursor:pointer;}
  .btn-add:active{filter:brightness(1.15);}

  /* 连接胶囊（点整胶囊弹出连接弹窗） */
  .ftabs{display:flex;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:3px;gap:3px;}
  .ftabs button{border:none;background:none;color:var(--t3);font-size:11.5px;font-weight:700;
    padding:6px 12px;border-radius:14px;cursor:pointer;font-family:inherit;}
  .ftabs button.on{background:rgba(245,184,61,.15);color:var(--gold);}
  .conn{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:20px;width:fit-content;max-width:100%;margin-top:11px;}
  .conn.flat{margin-top:0;height:32px;padding:0 11px;}
  .conn .cdot{width:8px;height:8px;border-radius:50%;background:#FF5C5C;flex-shrink:0;transition:background .3s;}
  .conn .cdot.on{background:var(--short);box-shadow:0 0 8px rgba(45,212,168,.9);}
  .conn .ctxt{font-size:12.5px;font-weight:600;color:var(--t3);transition:color .3s;white-space:nowrap;}
  .conn .ctxt.on{color:var(--short);}
  .conn .csep{width:1px;height:14px;background:var(--line);}
  .conn .pc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);white-space:nowrap;}
  .conn .ip{font-family:var(--mono);font-size:11px;color:var(--gold);max-width:96px;
    background:rgba(245,184,61,.1);padding:3px 8px;border-radius:9px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ===== 内容区（滑动三视图） ===== */
  #views{flex:1;display:flex;width:300%;transition:transform .28s ease;min-height:0;}
  #views .view{width:33.3334%;height:100%;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
  .content{flex:1;overflow-y:auto;padding:4px 16px 12px;min-height:0;}
  .grp-label{font-size:11.5px;color:var(--t3);font-weight:600;letter-spacing:1px;margin:8px 4px 6px;
    display:flex;align-items:center;gap:8px;}
  .grp-label::after{content:"";flex:1;height:1px;background:var(--line2);}

  /* ===== 预警信号卡（4 色与 PC 端一致：A买红/A卖青/B买金/B卖紫 + 同色淡渐变底） ===== */
  .sig{position:relative;display:flex;background:var(--card);border:1px solid var(--line);
    border-radius:15px;margin-bottom:8px;overflow:hidden;min-height:98px;cursor:pointer;}
  .sig-bar{width:4px;flex-shrink:0;}
  .sig.A.long{background:linear-gradient(135deg,rgba(239,83,80,.20),rgba(239,83,80,.04));}
  .sig.A.long .sig-bar{background:#ef5350;}
  .sig.A.short{background:linear-gradient(135deg,rgba(38,166,154,.20),rgba(38,166,154,.04));}
  .sig.A.short .sig-bar{background:#26a69a;}
  .sig.B.long{background:linear-gradient(135deg,rgba(240,185,11,.16),rgba(240,185,11,.03));}
  .sig.B.long .sig-bar{background:#f0b90b;}
  .sig.B.short{background:linear-gradient(135deg,rgba(179,136,255,.16),rgba(179,136,255,.03));}
  .sig.B.short .sig-bar{background:#b388ff;}
  .sig.long .sig-bar{background:var(--long);} .sig.short .sig-bar{background:var(--short);} /* 价格预警涨跌 */
  .sig-bd{flex:1;padding:7px 12px;min-width:0;display:flex;flex-direction:column;}
  .sig-r1{display:flex;align-items:center;gap:7px;}
  .sym{font-size:16px;font-weight:700;color:var(--t1);white-space:nowrap;}
  .b-lvl{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#241A05;background:var(--gold);
    padding:2px 7px;border-radius:7px;white-space:nowrap;}
  .b-ab{font-size:11px;color:var(--t2);border:1px solid var(--line);padding:1px 7px;border-radius:7px;white-space:nowrap;}
  .sig-time{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--t3);white-space:nowrap;}
  .sig-time .sno{color:var(--t2);font-weight:800;}
  .sig-r2{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;}
  .sig-price{font-family:var(--mono);font-size:21px;font-weight:700;color:var(--t1);letter-spacing:-.5px;}
  .sig-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;white-space:nowrap;}
  .sig-tag.s-solid{color:#06231C;background:var(--short);}
  .sig-tag.l-solid{color:#2B0B0B;background:var(--long);}
  .sig-tag.s-line{color:var(--short);border:1px solid rgba(45,212,168,.5);background:rgba(45,212,168,.08);}
  .sig-tag.l-line{color:var(--long);border:1px solid rgba(255,92,92,.5);background:rgba(255,92,92,.08);}
  .sig-r3{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:5px;gap:8px;}
  .sig-desc{font-size:12px;color:var(--t2);line-height:1.4;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sig-desc b{color:var(--t1);font-family:var(--mono);font-weight:600;}
  .mini-add{flex-shrink:0;font-size:11.5px;font-weight:600;color:#4da3ff;cursor:pointer;
    border:1px solid rgba(77,163,255,.4);background:rgba(77,163,255,.08);padding:4px 9px;border-radius:9px;white-space:nowrap;}
  .mini-add:active{background:rgba(77,163,255,.22);}
  .sig-fold{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;cursor:pointer;
    background:var(--card2);border:1px dashed var(--line);border-radius:12px;margin-bottom:6px;
    font-size:12.5px;color:var(--t3);}
  .empty{color:var(--t3);font-size:13px;text-align:center;margin-top:48px;line-height:1.9;}

  /* ===== 持仓卡（金色信息带：级别 + 进场时间双主角） ===== */
  .pos{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;
    margin-bottom:10px;overflow:hidden;min-height:178px;display:flex;}
  .pos-bar{width:5px;flex-shrink:0;}
  .pos.long .pos-bar{background:var(--long);} .pos.short .pos-bar{background:var(--short);}
  .pos-bd{flex:1;min-width:0;padding:11px 13px 10px 15px;display:flex;flex-direction:column;}
  .pos-r1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pos-name{display:flex;align-items:baseline;gap:8px;min-width:0;}
  .pos-sym{font-size:19px;font-weight:800;letter-spacing:.5px;}
  .pos-code{font-family:var(--mono);font-size:11px;color:var(--t3);}
  .dir{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .dir.long{color:var(--long);background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);}
  .dir.short{color:var(--short);background:rgba(45,212,168,.1);border:1px solid rgba(45,212,168,.35);}
  .pos-hero{margin-top:9px;background:linear-gradient(135deg,rgba(245,184,61,.14),rgba(245,184,61,.04));
    border:1px solid rgba(245,184,61,.22);border-radius:11px;display:flex;align-items:stretch;}
  .hero-cell{padding:8px 0 8px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .hero-lvl{flex:0 0 33%;}
  .hero-lvl .lv-num{font-size:23px;font-weight:800;color:var(--gold);line-height:1.05;}
  .hero-lvl .lv-num small{font-size:12px;font-weight:700;margin-left:1px;}
  .hero-lvl .lv-lab,.hero-time .tl{font-size:9.5px;color:var(--t2);margin-top:2px;letter-spacing:1px;white-space:nowrap;}
  .hero-div{width:1px;background:rgba(245,184,61,.22);margin:8px 0;}
  .hero-time{flex:1;}
  .hero-time .tv{font-family:var(--mono);font-size:15.5px;font-weight:700;color:var(--t1);letter-spacing:-.3px;line-height:1.1;white-space:nowrap;}
  .ep-row{margin-top:8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;}
  .ep-lab{color:var(--t3);font-size:11px;}
  .ep-name{font-weight:700;font-size:12px;}
  .ep-name.long{color:var(--long);} .ep-name.short{color:var(--short);}
  .ep-arrow{color:var(--t3);font-size:12px;}
  .pos-foot{margin-top:auto;padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dur{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    padding:4px 9px;border-radius:15px;white-space:nowrap;flex-shrink:0;}
  .dur .dd{width:6px;height:6px;border-radius:50%;}
  .dur.today{color:var(--short);background:rgba(45,212,168,.09);}
  .dur.today .dd{background:var(--short);}
  .dur.over{color:#FFB454;background:rgba(255,180,84,.13);}
  .dur.over .dd{background:#FFB454;}
  .pos-actions{display:flex;gap:8px;flex-shrink:0;}
  .pa{height:31px;padding:0 16px;border-radius:16px;font-size:12.5px;font-weight:600;display:flex;align-items:center;cursor:pointer;}
  .pa.edit{color:var(--t2);background:transparent;border:1px solid var(--line);}
  .pa.close{color:var(--long);background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.4);}
  .pos-add{height:46px;border:1.5px dashed var(--line);border-radius:14px;display:flex;cursor:pointer;
    align-items:center;justify-content:center;gap:8px;color:var(--t2);font-size:13.5px;font-weight:600;margin-bottom:10px;}
  .pos-add b{color:var(--gold);font-size:18px;font-weight:400;line-height:1;}
  .pos-add .mut{color:var(--t3);font-weight:400;font-size:12px;}

  /* ===== 留言 ===== */
  .msg-flow{padding:6px 2px;display:flex;flex-direction:column;}
  .bubble{max-width:78%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.5;margin-bottom:9px;word-break:break-all;}
  .bubble .who{font-size:10px;color:var(--t3);margin-bottom:3px;display:block;}
  .bubble.pc{align-self:flex-start;background:var(--card2);border:1px solid var(--line);
    border-bottom-left-radius:5px;color:var(--t1);}
  .bubble.me{align-self:flex-end;background:rgba(245,184,61,.15);border:1px solid rgba(245,184,61,.28);
    border-bottom-right-radius:5px;color:#F2E3B8;}
  .bubble b{font-family:var(--mono);font-weight:600;}
  .msg-inputbar{flex-shrink:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    display:flex;gap:10px;align-items:center;background:rgba(14,18,25,.98);}
  .msg-inputbar input{flex:1;height:44px;background:var(--card);border:1px solid var(--line);border-radius:22px;
    color:var(--t1);padding:0 16px;font-size:13.5px;outline:none;}
  .ms{width:44px;height:44px;border-radius:50%;background:var(--gold);border:none;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}

  /* ===== 底部 Tab ===== */
  .tabbar{flex-shrink:0;height:64px;background:rgba(12,15,21,.98);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--t3);position:relative;cursor:pointer;background:none;border:none;font-family:inherit;}
  .tab svg{width:22px;height:22px;display:block;}
  .tab span{font-size:11px;font-weight:600;line-height:1;}
  .tab.on{color:var(--gold);}
  .tab .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;
    background:var(--long);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;
    display:none;align-items:center;justify-content:center;z-index:2;border:1.5px solid #0c0f15;}
  .tab .badge.show{display:flex;}

  /* ===== 弹层 ===== */
  .sheet-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;
    align-items:flex-end;justify-content:center;}
  .sheet{width:100%;max-width:480px;background:#161C26;border-radius:16px 16px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;}
  .sheet h3{font-size:15px;margin-bottom:14px;}
  .sheet .row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13.5px;}
  .sheet .lab{width:64px;color:var(--t3);font-size:12.5px;flex-shrink:0;}
  .sheet input,.sheet select{flex:1;background:var(--app);border:1px solid var(--line);color:var(--t1);
    border-radius:9px;padding:9px 11px;font-size:13.5px;outline:none;}
  .sheet .btns{display:flex;gap:10px;margin-top:18px;}
  .sheet .btns button{flex:1;border:none;border-radius:10px;padding:11px 0;font-size:14px;cursor:pointer;}
  .btn-cancel{background:var(--card2);color:var(--t1);}
  .btn-ok{background:var(--gold);color:#241A05;font-weight:700;}
  .conn-row{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--app);
    border:1px solid var(--line);border-radius:12px;margin-bottom:12px;font-size:13px;}
  .conn-row .k{color:var(--t3);font-size:11.5px;width:70px;flex-shrink:0;}
  .conn-row .v{font-family:var(--mono);font-size:12.5px;color:var(--t1);word-break:break-all;}

  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1A212D;color:var(--t1);
    border:1px solid rgba(245,184,61,.4);border-radius:10px;padding:9px 16px;font-size:12.5px;z-index:300;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:82%;text-align:center;}
  #toast.show{opacity:1;}
  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="app">
  <div id="views">
    <!-- ===== 页1 预警 ===== -->
    <section class="view">
      <div class="app-header">
        <div class="h-row1">
          <div class="h-title">缠论预警</div>
          <div class="icon-btn" onclick="refresh()" title="请求刷新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-top:11px;">
          <div class="conn" onclick="connOpen()" style="margin-top:0;flex:1;min-width:0;height:34px;">
            <span class="cdot" id="cdot"></span><span class="ctxt" id="ctxt">连接中…</span>
            <span class="csep"></span>
            <span class="pc" id="devTx">电脑离线</span>
            <span class="csep"></span>
            <span class="ip" id="ipTx">…</span>
          </div>
          <div class="ftabs">
            <button id="ftAll" class="on" onclick="setFTab('all')">全部</button>
            <button id="ftConf" onclick="setFTab('conf')">确认</button>
          </div>
        </div>
      </div>
      <div class="content" id="feed"></div>
    </section>
    <!-- ===== 页2 持仓 ===== -->
    <section class="view">
      <div class="app-header">
        <div class="h-row1">
          <div class="ph-l"><div class="h-title">持仓</div><div class="ph-count" id="posCnt">0 / 4</div></div>
          <div class="h-row1">
            <div class="icon-btn" onclick="posLoad()" title="刷新" style="margin-right:9px;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            </div>
            <button class="btn-add" onclick="posFormOpen()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加
            </button>
          </div>
        </div>
      </div>
      <div class="content" id="posList"></div>
    </section>
    <!-- ===== 页3 留言 ===== -->
    <section class="view">
      <div class="app-header">
        <div class="h-row1">
          <div class="h-title">留言</div>
          <div class="conn flat" onclick="connOpen()">
            <span class="cdot" id="cdot2"></span><span class="ctxt" id="ctxt2">连接中…</span>
            <span class="csep"></span>
            <span class="pc" id="devTx2">电脑离线</span>
          </div>
        </div>
      </div>
      <div class="content" id="chatList"><div class="msg-flow" id="chatFlow"></div></div>
      <div class="msg-inputbar">
        <input id="msg" placeholder="给电脑留言…" maxlength="80">
        <button class="ms" onclick="sendMsg()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#241A05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- ===== 底部导航 ===== -->
  <nav class="tabbar">
    <button class="tab on" id="ntab0" onclick="switchTab(0)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg><span>预警</span></button>
    <button class="tab" id="ntab1" onclick="switchTab(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2.5"/><path d="M3 9h18"/></svg>
      <span class="badge" id="posTabN"></span><span>持仓</span></button>
    <button class="tab" id="ntab2" onclick="switchTab(2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-4 3v-3H4z"/></svg><span>留言</span></button>
  </nav>
</div>

<div id="toast"></div>

<!-- 连接 / IP 弹窗（整个连接胶囊点击弹出） -->
<div id="connOv" class="sheet-mask">
  <div class="sheet">
    <h3>连接 · 服务器地址</h3>
    <div class="conn-row"><span class="k">当前状态</span><span class="v" id="coStat">…</span></div>
    <div class="conn-row"><span class="k">电脑地址</span><span class="v" id="coHost">…</span></div>
    <div class="row"><span class="lab">换台电脑</span>
      <input id="coIp" placeholder="IP或地址，如 192.168.1.8 或 192.168.1.8:8000"></div>
    <div style="font-size:11.5px;color:var(--t3);line-height:1.7;">默认地址是电脑的固定机器名（ggydeMacBook-Pro-3.local），换 WiFi / 手机开热点共享给电脑都不用改。换网络后连不上时，留空点「前往」即用默认地址重连。</div>
    <div class="btns">
      <button class="btn-cancel" onclick="connClose()">取消</button>

<script>
/* ================= Gitee 直连（唯一权威数据源） ================= */
const GH={owner:'ggy-king',repo:'chan-gy-data',branch:'master',token:'你的Gitee私人令牌'};
const POS_EXIT={'二买':'二卖','二卖':'二买','三买':'三卖','三卖':'三买'};
const POS_LIMIT=4;
const POS_SYMS=[["jd2611", "鸡蛋"], ["UR2701", "尿素"], ["MA2611", "甲醇"], ["jm2701", "焦煤"], ["CF2701", "棉花"], ["SA2701", "纯碱"], ["SR2701", "白糖"], ["v2701", "PVC"], ["CJ2701", "红枣"], ["SP2611", "纸浆"], ["RU2701", "橡胶"], ["lh2611", "生猪"], ["AP2701", "苹果"], ["pg2611", "液化气"], ["RB2701", "螺纹钢"], ["NI2611", "沪镍"], ["PK2611", "花生"]];
const POS_PNAME={'30':'30秒','3':'3分','5':'5分','15':'15分','30m':'30分','60':'60分','daily':'日线'};
let POSITIONS=[], posEditId=null, posDelId=null, _toastTimer=null;
const _delPend=new Set();   // 已本地删除但还没推到远端的 id（防止 posLoad 拉回）
function posLabel(v){ v=v||''; return v.startsWith('二')?('A类'+v):v.startsWith('三')?('B类'+v):v; }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b){ return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))); }
function ghApi(path){ return `https://gitee.com/api/v5/repos/${GH.owner}/${GH.repo}/contents/${path}`; }
async function ghGet(path){
  const r=await fetch(ghApi(path)+'?access_token='+GH.token+'&_='+Date.now());   // 穿透边缘缓存
  if(!r.ok) throw 'GET '+path+' '+r.status;
  const d=await r.json();
  if(!d.sha) throw '远端不存在';
  return {sha:d.sha, data:JSON.parse(b64dec(d.content))};
}
async function ghPut(path, data, msg){
  let sha=null;
  try{ const d=await ghGet(path); sha=d.sha; }catch(e){}
  const body={access_token:GH.token, content:b64enc(JSON.stringify(data,null,1)), message:msg||'手机端持仓同步', branch:GH.branch};
  if(sha) body.sha=sha;
  const r=await fetch(ghApi(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw 'PUT '+path+' '+r.status+': '+(await r.text()).slice(0,100);
}
function toast(t){
  const el=document.getElementById('toast');
  el.textContent=t; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
function posLocalSave(){ try{localStorage.setItem('cl_pos_cache',JSON.stringify(POSITIONS));}catch(e){} }
function posRenderCache(){
  try{
    const c=JSON.parse(localStorage.getItem('cl_pos_cache')||'null');
    if(c&&c.length){ POSITIONS=c; posRender(POSITIONS); }
  }catch(e){}
}
/* 后台写 Gitee：失败自动重试（读远端最新列表→套用变更→写回，避免互相覆盖） */
function _bgJob(job,label){
  const run=n=>job().catch(e=>{
    if(n>=5){ toast(label+'失败，请检查网络后刷新'); return; }
    setTimeout(()=>run(n+1), 3000+5000*n);
  });
  run(1);
}
function periodLabel(p){ return POS_PNAME[p]||p+'分'; }

/* ================= Tab 切换 + 侧滑 ================= */
let _curTab=0;
function switchTab(i){
  _curTab=Math.max(0,Math.min(2,i));
  document.getElementById('views').style.transform='translateX(-'+(_curTab*100/3)+'%)';
  for(let k=0;k<3;k++) document.getElementById('ntab'+k).classList.toggle('on',k===_curTab);
  if(_curTab===1) posLoad();
}
(function(){
  let sx=0,sy=0,st=0;
  const v=document.getElementById('views');
  v.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
  v.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>800) return;
    if(Math.abs(dx)>60 && Math.abs(dx)>1.6*Math.abs(dy)){
      const nt=_curTab+(dx<0?1:-1);
      if(nt>=0&&nt<=2&&nt!==_curTab) switchTab(nt);
    }
  },{passive:true});
})();

/* ================= 连接胶囊 / IP 弹窗 ================= */
const DEFAULT_HOST='ggydeMacBook-Pro-3.local';   // Mac 的 mDNS 机器名：换 WiFi/开热点都不用改（APK 同此约定）
const DEFAULT_PORT='8000';
function connOpen(){
  document.getElementById('coStat').textContent=
    (document.getElementById('cdot').classList.contains('on')?'已连接':'未连接')+' · '+
    document.getElementById('devTx').textContent;
  document.getElementById('coHost').textContent=location.host||'(离线模式)';
  const ip=document.getElementById('coIp');
  ip.value=''; ip.placeholder='留空=默认 '+DEFAULT_HOST;
  document.getElementById('connOv').style.display='flex';
}
function connClose(){ document.getElementById('connOv').style.display='none'; }
function connGo(){
  let v=document.getElementById('coIp').value.trim();
  if(!v) v=DEFAULT_HOST+':'+DEFAULT_PORT;   // 留空=恢复默认稳定地址
  const addr=/^https?:\/\//.test(v)?v:('http://'+v);
  location.href=addr;
}

/* ================= 预警信号流（按天分组，跨天折叠；顺序与 PC 端一致=触发时刻降序） ================= */
let FEED=[];          // 触发时刻降序
let _showOld=false;
let _booted=false;    // init 历史重放期间不响铃
let FTAB='all';       // all=全部 / conf=仅确认+触发（与 PC 端事件流页签一致）
let _feedSeq=0;       // 首次出现顺序（同触发时刻的 tie-break，与 PC 端稳定排序对齐）
function trigT(m){ return m.trigger_time||m.time||''; }
function evKey(m){ return m.fingerprint||('k_'+(m.pattern||'')+(m.symbol||'')+(m.period||'')+(m.time||'')); }
function isConf(m){
  if(m.ft==='price') return false;
  return m.state==='conf_a'||m.state==='trig_b'||
         (m.pattern||'').includes('CONF')||(m.pattern||'').includes('TRIG');
}
function setFTab(t){
  FTAB=t;
  document.getElementById('ftAll').classList.toggle('on',t==='all');
  document.getElementById('ftConf').classList.toggle('on',t==='conf');
  renderFeed();
}
function dayKey(m){ const t=trigT(m); return t.length>=10?t.slice(5,10):''; }
function timeHM(m){ const t=trigT(m); return t.length>=16?t.slice(11,16):(m.time_str||'').slice(-5); }
function pushFeed(m,type){
  const k=evKey(m);
  const i=FEED.findIndex(x=>evKey(x)===k);
  if(i>=0){   // 同指纹延续触发：原位更新，保留首次时间与首次出现序
    const old=FEED[i];
    if(trigT(m)&&trigT(old)&&trigT(m)<trigT(old)) return;   // 旧快照后到，不回退已更新的状态
    m.first_time=old.first_time||old.time;
    m._seq=old._seq;
    FEED[i]=m;
  }else{
    m.first_time=m.first_time||m.time;
    m._seq=++_feedSeq;
    FEED.unshift(m);
    if(FEED.length>150) FEED=FEED.slice(0,150);
  }
  m.ft=type||'pattern';
  // 与 PC 端一致：主键=触发时刻降序；同刻 tie=首次出现顺序升序（旧事件在前）
  FEED.sort((a,b)=>{
    const ta=trigT(a), tb=trigT(b);
    if(ta!==tb) return ta<tb?1:-1;
    return (a._seq||0)-(b._seq||0);
  });
  renderFeed();
}
function stateTag(m){
  const long=(m.side||'long')==='long';
  const arr=long?'▲多':'▼空';
  let st='';
  if(m.kind==='A'){
    st=m.snapshot||m.state ? ({watch_a:'A类观察',cand_a:'A类候选',conf_a:'A类确认'}[m.state]||'A类候选')
                           : ((m.pattern||'').startsWith('VREV_CONF')?'A类确认':'A类候选');
  }else{
    st=m.snapshot||m.state ? ({cand_b:'B类候选',trig_b:'B类触发'}[m.state]||'B类候选')
                           : ((m.pattern||'').includes('TRIG')?'B类触发':'B类候选');
  }
  const solid=(st.indexOf('确认')>=0||st.indexOf('触发')>=0);
  const cls=long?(solid?'l-solid':'l-line'):(solid?'s-solid':'s-line');
  return {text:arr+' · '+st, cls};
}
function entryOf(m){
  const long=(m.side||'long')==='long';
  return m.kind==='A'?(long?'二买':'二卖'):(long?'三买':'三卖');
}
function feedCard(m,idx){
  const d=document.createElement('div');
  if(m.ft==='price'){                       // 价格预警
    const up=m.direction==='up';
    d.className='sig '+(up?'long':'short');
    d.innerHTML=`<div class="sig-bar"></div><div class="sig-bd">
      <div class="sig-r1"><span class="sym">${m.name||''} ${m.symbol||''}</span><span class="b-ab">价格预警</span><span class="sig-time"><span class="sno">#${idx+1}</span> ${m.triggered_at||fmt(m.ts)}</span></div>
      <div class="sig-r2"><span class="sig-price">${m.triggered_price||m.price||''}</span>
        <span class="sig-tag ${up?'l-solid':'s-solid'}">${up?'▲涨破':'▼跌破'}</span></div>
      <div class="sig-r3"><span class="sig-desc">预警价 @ <b>${m.price||''}</b></span></div></div>`;
    d.onclick=()=>location.href='/m/detail?sym='+encodeURIComponent(m.symbol);
    return d;
  }
  // 形态预警：4 色与 PC 端一致（A买红/A卖青/B买金/B卖紫）
  const long=(m.side||'long')==='long';
  const tag=stateTag(m);
  d.className=`sig ${m.kind==='B'?'B':'A'} ${long?'long':'short'}`;
  d.innerHTML=`<div class="sig-bar"></div><div class="sig-bd">
    <div class="sig-r1"><span class="sym">${m.name||m.symbol||''}</span>
      <span class="b-lvl">${periodLabel(m.period)}</span><span class="b-ab">${m.kind==='A'?'A类':'B类'}</span>
      <span class="sig-time"><span class="sno">#${idx+1}</span> ${timeHM(m)}</span></div>
    <div class="sig-r2"><span class="sig-price">${m.price??''}</span>
      <span class="sig-tag ${tag.cls}">${tag.text}</span></div>
    <div class="sig-r3"><span class="sig-desc">${m.brief||m.text||''}</span>
      <span class="mini-add">＋ 记持仓</span></div></div>`;
  d.onclick=()=>location.href='/m/detail?sym='+encodeURIComponent(m.symbol)+'&period='+encodeURIComponent(m.period||'15');
  d.querySelector('.mini-add').onclick=e=>{ e.stopPropagation(); quickAdd(m); };
  return d;
}
function renderFeed(){
  const box=document.getElementById('feed');
  box.innerHTML='';
  const list=FTAB==='conf'?FEED.filter(isConf):FEED;
  if(!list.length){
    const msg=FTAB==='conf'?'暂无确认/触发信号'
      :(!_wsUp?'未连电脑 · 预警数据待同步<br>连上后自动更新（持仓/留言不受影响）'
              :'暂无预警<br>某品种出现买卖点会在这里弹出<br>点卡片可看该品种K线详情');
    box.innerHTML='<div class="empty">'+msg+'</div>';
    return;
  }
  const today=fmt(Date.now()/1000).slice(0,5);
  const yest=fmt((Date.now()-86400000)/1000).slice(0,5);
  const oldN=list.filter(m=>{const k=dayKey(m);return k&&k!==today&&k!==yest;}).length;
  let lastK=null;
  list.forEach((m,i)=>{
    const k=dayKey(m);
    const isOld=k&&k!==today&&k!==yest;
    if(isOld&&!_showOld) return;
    if(k&&k!==lastK){
      lastK=k;
      const lb=document.createElement('div');
      lb.className='grp-label';
      lb.textContent=(k===today?'今天 · ':k===yest?'昨天 · ':'')+k;
      box.appendChild(lb);
    }
    box.appendChild(feedCard(m,i));
  });
  if(!_showOld&&oldN>0){
    const f=document.createElement('div');
    f.className='sig-fold';
    f.textContent=`更早 · ${oldN} 条旧信号`;
    f.onclick=()=>{_showOld=true;renderFeed();};
    box.appendChild(f);
  }
}

/* 记持仓：用信号卡自带信息直接入库（时间=点击时刻，离场自动推导） */
function quickAdd(m){
  const entry=entryOf(m);
  const exit=POS_EXIT[entry]||'';
  if(POSITIONS.some(p=>p.symbol===m.symbol&&p.period===String(m.period)&&p.entry===entry)){
    toast('该信号已在持仓中'); return;
  }
  if(POSITIONS.length>=POS_LIMIT){ toast('已达持仓上限（'+POS_LIMIT+'个），先平仓再记'); return; }
  const now=new Date();
  const wk='周'+'日一二三四五六'[now.getDay()];
  const t=`${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const rec={id:String(now.getTime()), symbol:m.symbol,
    name:m.name||(POS_SYMS.find(x=>x[0]===m.symbol)||['',''])[1], period:String(m.period),
    entry:entry, exit:exit, open_time:t, weekday:wk,
    open_iso:now.toISOString?now.toISOString():String(now), note:'', result:'', pnl:''};
  rec._dirty=true;
  POSITIONS.push(rec); posRender(POSITIONS); posLocalSave();
  toast(`已记持仓 ${posLabel(entry)} → ${posLabel(exit)}，可去持仓页改`);
  _bgJob(async()=>{
    const d=await ghGet('positions.json');
    const list=d.data.positions||[];
    if(list.length>=POS_LIMIT) throw '已达持仓上限';
    if(!list.some(x=>x.id===rec.id)) list.push(rec);
    await ghPut('positions.json',{positions:list},'记持仓 '+rec.name+' '+t);
    rec._dirty=false;
  },'记持仓');
}

/* ================= 持仓页 ================= */
function posRender(list){
  const box=document.getElementById('posList');
  box.innerHTML='';
  document.getElementById('posCnt').textContent=`${list.length} / ${POS_LIMIT}`;
  const bn=document.getElementById('posTabN');
  bn.textContent=list.length;
  bn.classList.toggle('show',!!list.length);
  if(!list.length){
    box.innerHTML='<div class="empty">暂无持仓<br>预警卡上的「＋ 记持仓」可一键录入</div>';
  }
  const now=new Date();
  list.forEach(p=>{
    const isBuy=(p.entry||'').includes('买');
    const long=isBuy;
    let durHtml='';
    if(p.open_iso){
      const opened=new Date(p.open_iso);
      const days=Math.floor((now-opened)/86400000);
      const hrs=Math.floor((now-opened)/3600000);
      durHtml = days>=1
        ? `<div class="dur over"><span class="dd"></span>第 ${days+1} 天 · 按 ${periodLabel(p.period)} 处理</div>`
        : `<div class="dur today"><span class="dd"></span>已持 ${hrs} 小时</div>`;
    }
    const d=document.createElement('div');
    const lv=periodLabel(p.period), unit=lv.slice(-1), num=lv.slice(0,-1);
    d.className='pos '+(long?'long':'short');
    d.innerHTML=`<div class="pos-bar"></div><div class="pos-bd">
      <div class="pos-r1">
        <div class="pos-name"><span class="pos-sym">${p.name}</span><span class="pos-code">${p.symbol}</span></div>
        <div class="dir ${long?'long':'short'}">${long?'▲ 多单':'▼ 空单'}</div>
      </div>
      <div class="pos-hero">
        <div class="hero-cell hero-lvl"><div class="lv-num">${num}<small>${unit}</small></div><div class="lv-lab">交易级别</div></div>
        <div class="hero-div"></div>
        <div class="hero-cell hero-time"><div class="tv">${p.open_time}</div><div class="tl">${p.weekday} · 进场时间</div></div>
      </div>
      <div class="ep-row">
        <span class="ep-lab">进场</span><span class="ep-name ${long?'long':'short'}">${posLabel(p.entry)}</span>
        <span class="ep-arrow">→</span>
        <span class="ep-lab">离场</span><span class="ep-name ${long?'short':'long'}">${posLabel(p.exit)}</span>
      </div>
      <div class="pos-foot">${durHtml}
        <div class="pos-actions"><div class="pa edit">编辑</div><div class="pa close">平仓</div></div></div></div>`;
    d.querySelector('.edit').onclick=()=>posEdit(p.id);
    d.querySelector('.close').onclick=()=>posDel(p.id);
    box.appendChild(d);
  });
  const remain=POS_LIMIT-list.length;
  const add=document.createElement('div');
  add.className='pos-add';
  add.innerHTML=remain>0
    ?`<b>＋</b> 添加持仓<span class="mut">（还可加 ${remain} 个 · 上限 ${POS_LIMIT}）</span>`
    :`<span class="mut">已达上限 ${POS_LIMIT} 个 · 平仓后可再加</span>`;
  if(remain>0) add.onclick=()=>posFormOpen();
  else add.onclick=()=>toast('已达持仓上限');
  box.appendChild(add);
}
async function posLoad(){
  posRenderCache();
  if(!POSITIONS.length) document.getElementById('posList').innerHTML='<div class="empty">加载中…</div>';
  try{
    const d=await ghGet('positions.json');
    const remote=d.data.positions||[];
    // 合并未推完的本地变更：脏记录覆盖/追加，已删除的不拉回
    POSITIONS.forEach(p=>{
      if(!p._dirty) return;
      const i=remote.findIndex(r=>r.id===p.id);
      if(i>=0) remote[i]=p; else remote.push(p);
    });
    POSITIONS=remote.filter(p=>!_delPend.has(p.id));
    posRender(POSITIONS); posLocalSave();
    return;
  }catch(e){}
  try{
    const r=await fetch('/api/positions',{signal:AbortSignal.timeout?AbortSignal.timeout(4000):undefined});
    const d=await r.json();
    const remote=d.positions||[];
    POSITIONS.forEach(p=>{
      if(!p._dirty) return;
      const i=remote.findIndex(x=>x.id===p.id);
      if(i>=0) remote[i]=p; else remote.push(p);
    });
    POSITIONS=remote.filter(p=>!_delPend.has(p.id));
    posRender(POSITIONS); posLocalSave();
    return;
  }catch(e){}
  if(!POSITIONS.length)
    document.getElementById('posList').innerHTML='<div class="empty">拉取失败<br>请检查网络后点右上 ⟳，或点首页连接胶囊换地址</div>';
}
function posFormOpen(editId){
  if(POSITIONS.length>=POS_LIMIT && !editId){
    toast('已达持仓上限（'+POS_LIMIT+'个），先平仓删除再添加');
    return;
  }
  posEditId=editId||null;
  const sel=document.getElementById('mpfSymbol');
  sel.innerHTML=POS_SYMS.map(x=>`<option value="${x[0]}">${x[1]} ${x[0]}</option>`).join('');
  const rec=editId?POSITIONS.find(x=>x.id===editId):null;
  if(rec){
    document.getElementById('pfTitle').textContent='编辑持仓';
    sel.value=rec.symbol; sel.disabled=true;
    document.getElementById('mpfPeriod').value=rec.period;
    document.getElementById('mpfEntry').value=rec.entry;
    mpfDerive();
    document.getElementById('mpfExit').value=rec.exit;
    document.getElementById('mpfNote').value=rec.note||'';
    document.getElementById('mpfSubmit').textContent='保存修改';
  }else{
    document.getElementById('pfTitle').textContent='添加持仓';
    sel.disabled=false;
    document.getElementById('mpfPeriod').value='5';
    document.getElementById('mpfEntry').value='二买';
    mpfDerive();
    document.getElementById('mpfNote').value='';
    document.getElementById('mpfSubmit').textContent='确认添加';
  }
  document.getElementById('posFormOv').style.display='flex';
}
function posFormClose(){ document.getElementById('posFormOv').style.display='none'; posEditId=null; }
function mpfDerive(){ document.getElementById('mpfExit').value=POS_EXIT[document.getElementById('mpfEntry').value]||''; }
function mpfCollect(){
  return {symbol:document.getElementById('mpfSymbol').value, period:document.getElementById('mpfPeriod').value,
          entry:document.getElementById('mpfEntry').value, exit:document.getElementById('mpfExit').value,
          note:document.getElementById('mpfNote').value.trim()};
}
async function posFormSubmit(){
  const c=mpfCollect();
  const now=new Date();
  const wk='周'+'日一二三四五六'[now.getDay()];
  const t=`${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if(posEditId){
    const eid=posEditId; posEditId=null;
    const rec=POSITIONS.find(x=>x.id===eid);
    if(rec){ Object.assign(rec,{entry:c.entry,exit:c.exit,note:c.note}); rec._dirty=true; posRender(POSITIONS); posLocalSave(); }
    posFormClose(); toast('已保存');
    _bgJob(async()=>{
      const d=await ghGet('positions.json');
      const list=d.data.positions||[];
      const r=list.find(x=>x.id===eid);
      if(r) Object.assign(r,{entry:c.entry,exit:c.exit,note:c.note});
      await ghPut('positions.json',{positions:list},'持仓修改 '+t);
      if(rec) rec._dirty=false;
    },'保存');
  }else{
    if(POSITIONS.length>=POS_LIMIT){ toast('已达持仓上限（'+POS_LIMIT+'个）'); return; }
    const rec={id:String(now.getTime()), symbol:c.symbol,
      name:(POS_SYMS.find(x=>x[0]===c.symbol)||['',''])[1], period:c.period,
      entry:c.entry, exit:c.exit, open_time:t, weekday:wk,
      open_iso:now.toISOString?now.toISOString():String(now), note:c.note, result:'', pnl:''};
    rec._dirty=true;
    POSITIONS.push(rec); posRender(POSITIONS); posLocalSave(); posFormClose(); toast('已添加');
    _bgJob(async()=>{
      const d=await ghGet('positions.json');
      const list=d.data.positions||[];
      if(list.length>=POS_LIMIT) throw '已达持仓上限';
      if(!list.some(x=>x.id===rec.id)) list.push(rec);
      await ghPut('positions.json',{positions:list},'持仓添加 '+t);
      rec._dirty=false;
    },'添加');
  }
}
function posEdit(id){ posFormOpen(id); }
function posDel(id){
  const rec=POSITIONS.find(x=>x.id===id); if(!rec) return;
  const now=new Date();
  const opened=rec.open_iso?new Date(rec.open_iso):now;
  const hold=Math.max(0,Math.round((now-opened)/60000));
  const hm=hold>=60?`${Math.floor(hold/60)}小时${hold%60}分`:`${hold}分钟`;
  document.getElementById('mpcInfo').innerHTML=`<b style="color:var(--t1);">${rec.name}（${rec.symbol}）</b> ${periodLabel(rec.period)}<br>
    进场 <b style="color:var(--t1);">${posLabel(rec.entry)}</b> → 离场 <b style="color:var(--t1);">${posLabel(rec.exit)}</b><br>
    开仓 ${rec.open_time} ${rec.weekday} · 持仓 <b style="color:var(--gold);">${hm}</b><br>
    <span style="font-size:11px;">简报全部选填，直接确认就是平仓删除</span>`;
  document.querySelectorAll('#mpcResults button').forEach(x=>x.classList.remove('sel'));
  document.getElementById('mpcPnl').value='';
  posDelId=id;
  document.getElementById('posCloseOv').style.display='flex';
}
function mpcSel(b){
  document.querySelectorAll('#mpcResults button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
}
async function posDelConfirm(){
  if(!posDelId) return;
  const selB=document.querySelector('#mpcResults button.sel');
  const result=selB?selB.dataset.v:'';
  const pnl=document.getElementById('mpcPnl').value.trim();
  const id=posDelId; posDelId=null;
  const rec=POSITIONS.find(x=>x.id===id);
  // 乐观：本地立即移除，后台推 Gitee（失败自动重试）
  _delPend.add(id);
  POSITIONS=POSITIONS.filter(x=>x.id!==id);
  posRender(POSITIONS); posLocalSave();
  document.getElementById('posCloseOv').style.display='none';
  toast('已平仓');
  const now=new Date();
  const t=`${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  _bgJob(async()=>{
    const d=await ghGet('positions.json');
    const list=d.data.positions||[];
    const r=list.find(x=>x.id===id);
    if(result||pnl){   // 空简报=试验单，纯删除不进 history
      const src=r||rec;
      const opened=src&&src.open_iso?new Date(src.open_iso):now;
      const hold=Math.max(0,Math.round((now-opened)/60000));
      let hist=[];
      try{ const h=await ghGet('history.json'); hist=h.data.history||[]; }catch(e){}
      hist.unshift({...src, close_result:result, close_pnl:pnl,
        close_time:t, close_iso:now.toISOString?now.toISOString():String(now),
        weekday_close:'周'+'日一二三四五六'[now.getDay()], hold_min:hold});
      await ghPut('history.json', {history:hist}, '平仓简报 '+(src?src.name:'')+' '+t);
    }
    const left=list.filter(x=>x.id!==id);
    await ghPut('positions.json', {positions:left}, '平仓删除 '+(r?r.name:'')+' '+t);
    _delPend.delete(id);
  },'平仓');
}
posRenderCache();

/* ================= WS：预警/留言/设备状态 ================= */
const $=id=>document.getElementById(id);
let ws;
const proto=location.protocol==='https:'?'wss':'ws';

function beep(up){
  try{navigator.vibrate&&navigator.vibrate([40,30,40]);}catch(e){}
  try{
    const ac=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)());
    if(ac.state==='suspended')ac.resume();
    [0,0.14].forEach((dt,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
      o.frequency.value=up?(560+i*140):(560-i*120);o.type='sine';
      const t0=ac.currentTime+dt;g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(.2,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.32);
      o.start(t0);o.stop(t0+.33);
    });
  }catch(e){}
}
function alertBeep(){
  try{navigator.vibrate&&navigator.vibrate([100,50,100,50,200]);}catch(e){}
  try{
    const ac=alertBeep.ctx||(alertBeep.ctx=new (window.AudioContext||window.webkitAudioContext)());
    if(ac.state==='suspended')ac.resume();
    [0,0.15,0.3].forEach((dt,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
      o.frequency.value=880+i*220;o.type='square';
      const t0=ac.currentTime+dt;g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(.15,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.12);
      o.start(t0);o.stop(t0+.13);
    });
  }catch(e){}
}
function fmt(ts){const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

function addPatternAlert(m,upd){
  if(!m.symbol)return;
  if(_booted&&!upd)alertBeep();
  pushFeed(m,'pattern');
}
function addPriceAlert(a){
  if(_booted)alertBeep();
  pushFeed(a,'price');
}
function addSignal(s){   // 旧版交易信号（已停用，兼容历史重放）
  if(!s.symbol)return;
  if(_booted)beep(s.side==='buy');
  pushFeed({...s, kind:'A', brief:s.reason||'', price:s.price, time:s.time||''},'pattern');
}
function addChat(m){
  const d=document.createElement('div');
  const me=m.from==='m';
  d.className='bubble '+(me?'me':'pc');
  const ts=me?Date.now()/1000:(m.ts||Date.now()/1000);
  d.innerHTML=`<span class="who">${me?'我':'电脑监控端'} · ${fmt(ts)}</span>${m.text||''}`;
  const flow=document.getElementById('chatFlow');
  flow.appendChild(d);
  const box=document.getElementById('chatList');
  box.scrollTop=box.scrollHeight;
}
function renderDevices(d){
  const pc=(d||[]).filter(x=>x.role==='pc').length>0;
  const txt=pc?'电脑在线':'电脑离线';
  $('devTx').textContent=txt; $('devTx2').textContent=txt;
}
let _wsUp=false;
function paintConn(on,txt){
  _wsUp=on;
  $('cdot').classList.toggle('on',on); $('ctxt').classList.toggle('on',on); $('ctxt').textContent=txt;
  $('cdot2').classList.toggle('on',on); $('ctxt2').classList.toggle('on',on); $('ctxt2').textContent=txt;
  $('msg').placeholder=on?'给电脑留言…':'离线中 · 连上电脑后可留言';
  renderFeed();   // 空态文案随连接状态刷新
}
function refresh(){ toast('已请求刷新'); if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'refresh_request'})); }
function sendMsg(){const v=$('msg').value.trim();if(!v)return;
  if(!ws||ws.readyState!==1){toast('未连接电脑，消息未发出');return;}
  ws.send(JSON.stringify({type:'chat',text:v}));addChat({text:v,from:'m',ts:Date.now()/1000});$('msg').value='';}

function connect(){
  ws=new WebSocket(`${proto}://${location.host}/ws?role=m`);
  ws.onopen=()=>{paintConn(true,'已连接');};
  ws.onclose=()=>{paintConn(false,'未连电脑');setTimeout(connect,1500);};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='init'){
    renderDevices(m.devices);
    (m.history||[]).forEach(x=>{
      if(x.type==='pattern_alert'||x.type==='pattern_alert_update')addPatternAlert(x);
      else if(x.type==='price_alert')addPriceAlert(x);
      else if(x.type==='chat')addChat(x);
      else if(x.type==='signal')addSignal(x);
    });
      _booted=true;
    }
    else if(m.type==='devices'){renderDevices(m.devices);}
    else if(m.type==='pattern_alert'){addPatternAlert(m,false);}
    else if(m.type==='pattern_alert_update'){addPatternAlert(m,true);}
    else if(m.type==='price_alert'){addPriceAlert(m);}
    else if(m.type==='signal'){addSignal(m);}
    else if(m.type==='chat'||m.type==='ack'){addChat(m);}
  };
}
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
document.addEventListener('touchstart',()=>{if(beep.ctx&&beep.ctx.state==='suspended')beep.ctx.resume();},{once:false});
$('ipTx').textContent=DEFAULT_HOST;   // 胶囊显示稳定机器名（换网不变）
/* 预警流与监控页同源：启动拉 /api/pattern_matrix 全量事件（deque 100，含延续更新后的最新版），
   WS init history 只作兜底（指纹原位去重），实时增量照旧——解决手机端缺卡/顺序与 PC 不一致 */
async function loadPatternEvents(){
  try{
    const r=await fetch('/api/pattern_matrix',{signal:AbortSignal.timeout?AbortSignal.timeout(6000):undefined});
    const d=await r.json();
    (d.events||[]).forEach(x=>addPatternAlert(x,false));
  }catch(e){}
}
loadPatternEvents();
connect();
posLoad();   // 启动静默拉一次（记持仓查重 + tab 徽章）
</script>
