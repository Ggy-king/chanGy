<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>回测 · 缠论预警</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#131722;--panel:#1e222d;--line:#2a2e39;--txt:#d1d4dc;--mut:#787b86;
        --red:#ef5350;--green:#26a69a;--gold:#f0b90b;}
  body{background:var(--bg);color:var(--txt);
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
       position:sticky;top:0;background:var(--bg);z-index:10;}
  .top h1{font-size:16px;white-space:nowrap;}
  .back{color:var(--mut);text-decoration:none;font-size:13px;}
  .back:hover{color:var(--txt);}
  select{appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--txt);
         border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;
         background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23787b86' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
         background-repeat:no-repeat;background-position:right 10px center;}
  .stratbtn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;
            padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .seg button{background:var(--panel);color:var(--mut);border:none;padding:7px 12px;font-size:13px;cursor:pointer;}
  .seg button.on{background:#2c3140;color:var(--gold);}
  .go{background:var(--gold);color:#131722;border:none;border-radius:6px;padding:8px 18px;
      font-size:13px;font-weight:700;cursor:pointer;}
  .go:disabled{opacity:.5;cursor:default;}
  .meta{color:var(--mut);font-size:12px;margin-left:auto;}
  /* 未回测时的默认说明面板 */
  .sbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;max-width:780px;}
  .stitle{font-size:15px;font-weight:700;margin-bottom:10px;}
  .sdesc{font-size:13px;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;}
  .shint{color:var(--mut);font-size:12.5px;margin-top:12px;}
  /* 策略面板（弹层） */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-start;
         justify-content:center;z-index:99;padding-top:8vh;}
  .modal.show{display:flex;}
  .mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:20px 24px;width:min(660px,92vw);max-height:78vh;overflow:auto;}
  .mbox h3{font-size:15px;margin-bottom:14px;color:var(--gold);}
  .mbox .mname{font-size:14px;font-weight:700;margin:14px 0 6px;}
  .mbox .mname.cur{color:var(--gold);}
  .mbox .mdesc{font-size:12.5px;line-height:1.9;color:var(--txt);white-space:pre-wrap;margin-bottom:8px;}
  .mbox .mtip{color:var(--mut);font-size:11.5px;margin-top:14px;line-height:1.8;}
  .pill{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:10px;
        font-size:11px;padding:1px 8px;margin-left:8px;font-weight:400;vertical-align:1px;}
  .wrap{padding:16px 18px;}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:110px;}
  .card .k{color:var(--mut);font-size:11px;margin-bottom:4px;}
  .card .v{font-size:20px;font-weight:700;}
  .pos{color:var(--red);} .neg{color:var(--green);} .neu{color:var(--gold);}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:16px;}
  #chart{width:100%;height:460px;}
  #eq{width:100%;height:160px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--mut);font-weight:600;}
  td.l,th.l{text-align:left;}
  .tblwrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .tblwrap table{margin:0;}
  .loading{color:var(--mut);font-size:14px;padding:40px;text-align:center;}
  .err{color:var(--red);padding:20px;}
  h2{font-size:14px;margin:6px 0 10px;color:var(--txt);}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"><script src="/popup_cards.js"></script><script src="/posbi_cards.js"></script>
</head>
<body>
<div class="top">
  <a class="back" href="/pc">← 返回总览</a>
  <h1>回测</h1>
  <select id="sym">
    <option value="ALL">全部品种</option>
  </select>
  <div class="seg" id="seg">
    <button data-m="1">近1月</button>
    <button data-m="2">近2月</button>
    <button data-m="3">近3月</button>
    <button data-m="0">全部</button>
  </div>
  <button class="go" id="go">开始回测</button>
  <span class="meta" id="meta"></span>
  <button class="stratbtn" id="btnStrat" onclick="toggleStrat()" title="当前回测策略">⚙ 策略</button>
</div>

<div class="wrap">
  <div id="result"><div class="loading">加载中…</div></div>
</div>

<div class="modal" id="stratModal" onclick="if(event.target===this)toggleStrat()">
  <div class="mbox" id="stratBox"></div>
</div>

<script>
let SYMS = [];   // 从服务端 /api/contracts 动态加载（换合约只改 config.py，页面自动跟随）
const sel = document.getElementById('sym');
function fillSyms(list){
  sel.innerHTML='';
  const all=document.createElement('option'); all.value='ALL'; all.textContent='全部'; sel.appendChild(all);
  list.forEach(([s,n])=>{ const o=document.createElement('option'); o.value=s; o.textContent=n+' '+s; sel.appendChild(o); });
  if(q.get('sym')) sel.value = q.get('sym'); else sel.value='ALL';   // 默认=全部
  fitSel();
}
/* 原生 select 箭头永远贴盒右缘；已 appearance:none 自绘箭头。
   宽度：取全部选项里最宽的一条，固定不变（切换品种时盒子不跳）；
   箭头：跟随当前选中文字，间距 16px 留呼吸感 */
function fitSel(){
  const ctx=fitSel.c||(fitSel.c=document.createElement('canvas').getContext('2d'));
  ctx.font='13px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif';
  const W=o=>Math.ceil(ctx.measureText(o.textContent).width);
  const opts=Array.from(sel.options); if(!opts.length)return;
  const widest=Math.max.apply(null,opts.map(W));      // 最宽选项定宽，选择切换不再改变盒宽
  sel.style.width=(widest+34)+'px';                   // 左内边距10 + 文字 + 间隙16 + 箭头10 + 余量
  const cur=sel.options[sel.selectedIndex];
  sel.style.backgroundPosition=((cur?W(cur):0)+16)+'px center';
}
sel.addEventListener('change',fitSel);
fetch('/api/contracts').then(r=>r.json())
  .then(d=>fillSyms((d.contracts||[]).map(c=>[c.symbol,c.name])))
  .catch(()=>{});   // 服务端同源，页面能打开接口就通；失败时下拉为空属服务异常

const q = new URLSearchParams(location.search);
let months = parseInt(q.get('months')||'1',10);
if(![0,1,2,3].includes(months)) months=1;
if(q.get('sym')) sel.value = q.get('sym'); else sel.value='ALL';

const seg = document.getElementById('seg');
function markSeg(){ seg.querySelectorAll('button').forEach(b=> b.classList.toggle('on', +b.dataset.m===months)); }
markSeg();
seg.querySelectorAll('button').forEach(b=> b.onclick=()=>{ months=+b.dataset.m; markSeg(); });

let chart=null, eqChart=null;
function fmtT(ts){ const d=new Date(ts*1000); return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function cls(v){ return v>0?'pos':(v<0?'neg':'neu'); }
function num(v,f){ if(v===null||v===undefined) return '—'; return f?f(v):v; }

document.getElementById('go').onclick = run;

/* ── 策略信息：未回测时的默认说明页 + 右上角「策略」弹层 ── */
let STRATS={}, DEF_STRAT=null, CUR_STRAT=null;
function paramTable(st){
  let h='<table style="margin:0;">';
  st.params.forEach(p=>{ h+='<tr><td class="l" style="color:var(--mut);width:90px;">'+p.label+'</td><td class="l">'+p.value+'</td></tr>'; });
  return h+'</table>';
}
function renderDefault(){
  if(!DEF_STRAT) return;
  const st=STRATS[CUR_STRAT]||STRATS[DEF_STRAT];
  document.getElementById('result').innerHTML=
    '<div class="sbox">'
    +'<div class="stitle">当前策略：'+st.name+'<span class="pill">回测用</span></div>'
    +'<div class="sdesc">'+st.desc+'</div>'
    +paramTable(st)
    +'<div class="shint">选择品种和时间区间，点"开始回测"。右上角「⚙ 策略」可随时查看策略详情。</div>'
    +'</div>';
}
function renderModal(){
  let h='<h3>回测策略</h3>';
  Object.keys(STRATS).forEach(k=>{
    const st=STRATS[k];
    h+='<div class="mname'+(k===CUR_STRAT?' cur':'')+'">'+st.name+(k===CUR_STRAT?'<span class="pill">当前选中</span>':'')+'</div>'
      +'<div class="mdesc">'+st.desc+'</div>'+paramTable(st);
  });
  h+='<div class="mtip">· 以后新增策略：在 backtest.py 的 STRATEGIES 注册表里加一条记录，这里会自动列出。<br>· 参数目前为固定值（写死在策略里）；开放调参时会在「参数」下加输入控件，接口已预留 strategy 传参。</div>';
  document.getElementById('stratBox').innerHTML=h;
}
function toggleStrat(){
  const m=document.getElementById('stratModal');
  m.classList.toggle('show');
  if(m.classList.contains('show')) renderModal();
}
fetch('/api/backtest/strategy').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(d=>{
  STRATS=d.strategies||{}; DEF_STRAT=d.default||Object.keys(STRATS)[0]; CUR_STRAT=q.get('strategy')||DEF_STRAT;
  renderDefault();
}).catch(()=>{ document.getElementById('result').innerHTML='<div class="err">策略信息加载失败——server 没起来或没重启（新接口 /api/backtest/strategy），重启 server 后刷新。</div>'; });
function run(){
  const go=document.getElementById('go'); go.disabled=true;
  document.getElementById('result').innerHTML='<div class="loading">正在回测（全部品种需拉17个数据，稍候十几秒）…</div>';
  document.getElementById('meta').textContent='';
  fetch('/api/backtest?sym='+encodeURIComponent(sel.value||'ALL')+'&months='+months+'&strategy='+encodeURIComponent(CUR_STRAT||''))
    .then(r=>r.json()).then(r=>{
      go.disabled=false;
      if(r.error){ document.getElementById('result').innerHTML='<div class="err">'+r.error+'</div>'; return; }
      render(r);
    })
    .catch(e=>{ go.disabled=false; document.getElementById('result').innerHTML='<div class="err">请求失败：'+e+'</div>'; });
}

// 把UTC时间戳转成本地时间对象，避免lightweight-charts时区问题
function tsToObj(ts){const d=new Date(ts*1000);return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),hour:d.getHours(),minute:d.getMinutes()};}
function toLocalTime(data){return data.map(x=>({...x,time:tsToObj(x.time)}));}

// lightweight-charts把时间戳当UTC显示，加8小时转成北京时间
const TZ_OFFSET=28800;
function fixTime(data){return data.map(x=>({...x,time:x.time+TZ_OFFSET}));}

function render(r){
  const box=document.getElementById('result');
  if(r.mode==='all'){ renderAll(r,box); } else { renderOne(r,box); }
}

function card(k,v,c){ return '<div class="card"><div class="k">'+k+'</div><div class="v '+ (c||'') +'">'+v+'</div></div>'; }

function renderOne(r,box){
  const s=r.stats;
  document.getElementById('meta').textContent = r.name+' '+r.symbol+' · 15分钟 · '+r.start.slice(0,16)+' ~ '+r.end.slice(0,16)+' · '+r.bar_count+'根K线 · '+r.bi_count+'笔';
  let h='<div class="cards">'
    + card('笔数', r.bi_count, 'neu')
    + card('交易笔数', s.trades, 'neu')
    + card('胜率', num(s.win_rate,null)+(s.win_rate!==null?'%':''), cls(s.win_rate-50))
    + card('盈亏比', num(s.pl_ratio), 'neu')
    + card('均盈/均亏(点)', (s.avg_win_pts??0)+'/'+(s.avg_loss_pts??0), 'neu')
    + card('净盈亏(元)', s.total_money, cls(s.total_money))
    + card('最大回撤(元)', s.max_dd, 'neg')
    + card('平均回撤(元)', s.avg_dd, 'neg')
    + '</div>';
  h+='<div class="chartbox"><div id="chart"></div></div>';
  h+='<div class="chartbox"><h2>资金曲线（元/手）</h2><div id="eq"></div></div>';
  h+='<h2>交易明细</h2><div class="tblwrap"><table><thead><tr>'
    +'<th class="l">#</th><th class="l">买时间</th><th>买价</th><th class="l">卖时间</th><th>卖价</th><th>盈亏(点)</th><th>盈亏(元)</th></tr></thead><tbody>';
  r.trades.forEach((t,i)=>{
    h+='<tr><td class="l">'+(i+1)+'</td><td class="l">'+fmtT(t.buy_time)+'</td><td>'+t.buy_price
      +'</td><td class="l">'+fmtT(t.sell_time)+'</td><td>'+t.sell_price
      +'</td><td class="'+cls(t.pts)+'">'+(t.pts>0?'+':'')+t.pts
      +'</td><td class="'+cls(t.money)+'">'+(t.money>0?'+':'')+t.money+'</td></tr>';
  });
  h+='</tbody></table></div>';
  box.innerHTML=h;

  if(chart){ chart.remove(); chart=null; }
  if(eqChart){ eqChart.remove(); eqChart=null; }
  chart = LightweightCharts.createChart(document.getElementById('chart'),{
    layout:{background:{color:'#131722'},textColor:'#d1d4dc'},
    grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
    rightPriceScale:{borderColor:'#2a2e39'},
    timeScale:{borderColor:'#2a2e39',timeVisible:true,secondsVisible:false}});
  const kc=chart.addCandlestickSeries({upColor:'#ef5350',downColor:'#26a69a',wickUpColor:'#ef5350',wickDownColor:'#26a69a',borderVisible:false});
  kc.setData(fixTime(r.kline)); kc.setMarkers(fixTime(r.markers||[]));
  const bl=chart.addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  bl.setData(fixTime(r.bi_line||[]));
  chart.timeScale().fitContent();

  eqChart = LightweightCharts.createChart(document.getElementById('eq'),{
    layout:{background:{color:'#131722'},textColor:'#9ca3af',fontSize:10},
    grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
    rightPriceScale:{borderColor:'#2a2e39'},timeScale:{timeVisible:true,borderVisible:false}});
  const es=eqChart.addAreaSeries({lineColor:'#f0b90b',topColor:'rgba(240,185,11,.3)',bottomColor:'rgba(240,185,11,.02)'});
  es.setData(fixTime(r.equity||[])); eqChart.timeScale().fitContent();
}

function renderAll(r,box){
  const g=r.global;
  document.getElementById('meta').textContent='全部品种 · 15分钟 · 共'+g.watch+'个品种'+(g.failed?'（失败'+g.failed+'）':'');
  let h='<div class="cards">'
    + card('品种数', g.watch, 'neu')
    + card('总交易笔数', g.total_trades, 'neu')
    + card('总净盈亏(元)', g.total_money, cls(g.total_money))
    + card('平均胜率', (g.avg_win_rate!=null?g.avg_win_rate+'%':'—'), 'neu')
    + card('平均盈亏比', (g.avg_pl_ratio!=null?g.avg_pl_ratio:'—'), 'neu')
    + card('总最大回撤(元)', (g.total_max_dd!=null?g.total_max_dd:'—'), 'neg')
    + '</div>';
  h+='<h2>各品种明细</h2><div class="tblwrap"><table><thead><tr>'
    +'<th class="l">品种</th><th>K线</th><th>笔</th><th>交易</th><th>胜率</th><th>盈亏比</th><th>净盈亏(元)</th><th>最大回撤(元)</th></tr></thead><tbody>';
  r.rows.forEach(x=>{
    if(x.error){ h+='<tr><td class="l">'+x.name+' '+x.symbol+'</td><td colspan="6" class="err">'+x.error+'</td></tr>'; return; }
    h+='<tr style="cursor:pointer" onclick="openOne(\''+x.symbol+'\')"><td class="l">'+x.name+' '+x.symbol+'</td><td>'+x.bars
      +'</td><td>'+x.bi+'</td><td>'+x.trades
      +'</td><td>'+(x.win_rate!=null?x.win_rate+'%':'—')
      +'</td><td>'+(x.pl_ratio!=null?x.pl_ratio:'—')
      +'</td><td class="'+cls(x.total_money)+'">'+(x.total_money>0?'+':'')+x.total_money
      +'</td><td class="neg">'+x.max_dd+'</td></tr>';
  });
  h+='</tbody></table></div>';
  box.innerHTML=h;
}
function openOne(s){ location.href='/pc/backtest?sym='+s+'&months='+months; }
</script>
</body>
</html>
